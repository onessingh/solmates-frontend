<script>
// OS-based theme-color for TWA status bar
(function(){
  var m=document.getElementById('theme-color-meta');
  if(!m){m=document.createElement('meta');m.name='theme-color';m.id='theme-color-meta';document.head.appendChild(m);}
  function setOsColor(){m.setAttribute('content',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#0f172a':'#ffffff');}
  setOsColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setOsColor);
})();
</script>

      --primary: #0f2b46;
      --accent: #0071e3;
      --bg: #f5f5f7;

    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    .header-bar {

    document.onkeydown = function(e) {

    };
    setInterval(function() {
        let devtoolsOpen = false;
        const threshold = 160;
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) devtoolsOpen = true;
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) devtoolsOpen = true;
        if (devtoolsOpen) {
            document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:20%;'>Security Violation: Access Denied.</h1>";
            document.head.innerHTML = "";

  <script>
    // URL param population for Exam Prep AI integration
    // Parses the plain-text "Q: / A) / B) / C) / D) / CORRECT: / EXPLANATION: / HINGLISH: / ===END===" format.
    // This is intentionally forgiving: a broken/missing field only drops that ONE question instead of
    // failing the entire batch the way JSON.parse() used to.
    function parseMCQText(text, difficulty) {
        if (!text) throw new Error("Empty response");

        let clean = text.replace(/\r\n/g, '\n').trim();
        // Strip stray markdown fences or "Sure, here are..." style intros if the AI adds them anyway
        clean = clean.replace(/^```[a-z]*\n?/i, '').replace(/```$/i, '').trim();
        clean = clean.replace(/^(sure|here are|here is|here's|okay|ok)[^\n]*:?\n/i, '').trim();
        const firstQ = clean.indexOf('Q:');
        if (firstQ > 0) clean = clean.substring(firstQ);

        let blocks = clean.split(/===\s*END\s*===/i).map(b => b.trim()).filter(Boolean);
        if (blocks.length === 0) blocks = [clean];

        const questions = [];

        blocks.forEach((block) => {
            const qMatch = block.match(/Q:\s*([\s\S]*?)\n\s*A\)/i);
            const aMatch = block.match(/A\)\s*([\s\S]*?)\n\s*B\)/i);
            const bMatch = block.match(/B\)\s*([\s\S]*?)\n\s*C\)/i);
            const cMatch = block.match(/C\)\s*([\s\S]*?)\n\s*D\)/i);
            const dMatch = block.match(/D\)\s*([\s\S]*?)(?:\n\s*CORRECT:|$)/i);
            const correctMatch = block.match(/CORRECT:\s*([A-D])/i);
            const expMatch = block.match(/EXPLANATION:\s*([\s\S]*?)(?:\n\s*HINGLISH:|$)/i);
            const hinglishMatch = block.match(/HINGLISH:\s*([\s\S]*?)$/i);

            // Skip this one block if the essentials are missing — don't fail the whole batch
            if (!qMatch || !aMatch || !bMatch || !correctMatch) return;

            const options = [aMatch[1], bMatch[1], cMatch ? cMatch[1] : null, dMatch ? dMatch[1] : null]
                .filter(Boolean)
                .map(o => o.trim());

            const correctIndex = correctMatch[1].toUpperCase().charCodeAt(0) - 65; // A=0, B=1, C=2, D=3

            questions.push({
                id: questions.length + 1,
                q: qMatch[1].trim(),
                options: options,
                correct: correctIndex,
                explanation: expMatch ? expMatch[1].trim() : '',
                hinglish_explanation: hinglishMatch ? hinglishMatch[1].trim() : '',
                tag: difficulty
            });
        });

        if (questions.length === 0) throw new Error("No valid questions could be parsed from AI response");
        return questions;
    }
    
    window.onload = () => {
      if (typeof ExamContextManager !== 'undefined') {
        const ctx = ExamContextManager.getContext();
        if (ctx) {
          const badge = document.getElementById('exam-context-badge');
          if (badge) {
            badge.style.display = 'inline-block';
            document.getElementById('ec-text').innerText = ctx.exam_name + " - " + ctx.subject_name;
          }
        }
      }
      window.solmatesAPI = new SolmatesAPI();
      const urlParams = new URLSearchParams(window.location.search);
      const fields = ['exam', 'subject', 'topic', 'difficulty', 'language'];
      fields.forEach(f => {
        if (urlParams.has(f)) {
          const el = document.getElementById(f);
          if (el) el.value = urlParams.get(f);
        }
      });
      if(urlParams.has('question_count')) {
        document.getElementById('q-count').value = urlParams.get('question_count');
      }
    };

    let generatedQuestions = [];

    async function generateMCQs() {
      const exam = document.getElementById('exam').value || 'General';
      const subject = document.getElementById('subject').value || 'Topic';
      const topic = document.getElementById('topic').value || 'General Concepts';
      const count = parseInt(document.getElementById('q-count').value);
      const difficulty = document.getElementById('difficulty').value;
      const lang = document.getElementById('language').value;
      const qType = document.getElementById('q-type').value;
      
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('loader-msg').innerText = `Analyzing ${exam} ${subject} syllabus & generating questions...`;
      
      try {
        const prompt = `Generate exactly ${count} multiple-choice questions for ${exam}, subject: ${subject}, topic: ${topic}.
Difficulty: ${difficulty}. Language: ${lang}. Type: ${qType}.

Output EACH question in EXACTLY this plain text format (no JSON, no markdown, no numbering):

Q: <question text>
A) <option A>
B) <option B>
C) <option C>
D) <option D>
CORRECT: <A or B or C or D>
EXPLANATION: <1-2 line explanation of why the correct option is right>
HINGLISH: <same explanation in simple Hinglish>
===END===

Repeat this exact block for all ${count} questions, one after another, each one ending with "===END===" on its own line.
Do not write any intro, outro, or commentary. Start your response directly with "Q:". Keep explanations extremely concise (max 1-2 lines).`;

        const res = await window.solmatesAPI.sendChatMessage(prompt + "\n\nCRITICAL: Follow the exact plain text format above. Start immediately with 'Q:'. No JSON, no markdown, no extra text.", []);
        const resText = res.message || res.reply;
        if (res.success && resText) {

            try {
                generatedQuestions = parseMCQText(resText, difficulty);
            } catch (parseErr) {
                console.error("Parse Error:", parseErr, resText.substring(0, 200));
                throw new Error("Invalid response format from AI");
            }
        } else {
            throw new Error("Failed to generate questions");
        }

        renderQuestions();
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('setup-mode').style.display = 'none';
        document.getElementById('result-mode').style.display = 'block';
        history.pushState({view: 'result'}, '', '');
        window.scrollTo(0,0);
      } catch (err) {
          console.error(err);
          document.getElementById('result-mode').style.display = 'block';
        document.getElementById('result-mode').innerHTML = '<div style="padding:30px;text-align:center;background:var(--card);border-radius:16px;border:1px solid var(--border);"><i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--danger);margin-bottom:15px;display:block;"></i><h3 style="color:var(--primary);margin-bottom:10px;">Failed to generate paper</h3><p style="color:var(--light);margin-bottom:15px;">The AI response was not in the expected format. Please try again.</p><button onclick="location.reload()" style="background:var(--accent);color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;">Try Again</button></div>';
          document.getElementById('loader').style.display = 'none';
      }
    }

    
    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const showExp = document.getElementById('include-exp').checked;
      
      let html = '';
      generatedQuestions.forEach((q, index) => {
        let optionsHtml = '';
        q.options.forEach((opt, oIdx) => {
          optionsHtml += `
            <div class="mcq-option" onclick="selectOption(this, ${index}, ${oIdx})">
              <span style="font-weight: 600; width: 25px;">${String.fromCharCode(65 + oIdx)}.</span> 
              <span>${opt}</span>
            </div>
          `;
        });

        html += `
          <div class="mcq-card" id="qcard-${index}">
            <div class="mcq-header">
              <span>Q${index + 1}</span>
              <span class="mcq-tag"><i class="fas fa-tag"></i> ${q.tag}</span>
            </div>
            <div class="mcq-question">${q.q}</div>
            <div class="mcq-options">
              ${optionsHtml}
            </div>
            <button class="exp-toggle-btn" id="exp-btn-${index}" onclick="toggleExp(${index})" style="display:none;">
              <span>View Explanation</span> <i class="fas fa-chevron-down"></i>
            </button>
            <div class="mcq-explanation" id="exp-${index}"></div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function selectOption(element, qIndex, oIdx) {
      // In standalone list mode, we reveal answer immediately upon selection
      const card = document.getElementById(`qcard-${qIndex}`);
      const options = card.querySelectorAll('.mcq-option');
      
      // Prevent multiple clicks
      if(card.classList.contains('answered')) return;
      card.classList.add('answered');
      
      const q = generatedQuestions[qIndex];
      const isCorrect = (oIdx === q.correct);
      
      element.classList.add('selected');
      
      options.forEach((opt, idx) => {
        if(idx === q.correct) {
          opt.classList.add('correct');
        } else if (idx === oIdx && !isCorrect) {
          opt.classList.add('incorrect');
        }
        opt.style.pointerEvents = 'none';
      });

      if(document.getElementById('include-exp').checked) {
        const btn = document.getElementById(`exp-btn-${qIndex}`);
        if (btn) btn.style.display = 'flex';
        
        const expDiv = document.getElementById(`exp-${qIndex}`);
        let eng = q.explanation || "";
        let hin = q.hinglish_explanation || "";
        
        let expHtml = "<strong>Explanation:</strong><br><br>";
        if (eng) expHtml += `${eng}<br><br>`;
        if (hin) expHtml += `<div style="color:var(--primary); font-size:0.95rem;">${hin}</div>`;
        
        expDiv.innerHTML = expHtml;
      }
    }

    function toggleExp(idx) {
      const btn = document.getElementById(`exp-btn-${idx}`);
      const exp = document.getElementById(`exp-${idx}`);
      if(exp.classList.contains('show')) {
        exp.classList.remove('show');
        btn.classList.remove('open');
        btn.querySelector('span').innerText = 'View Explanation';
      } else {
        exp.classList.add('show');
        btn.classList.add('open');
        btn.querySelector('span').innerText = 'Hide Explanation';
      }
    }

    function backToSetup() {
      if (history.state && history.state.view === 'result') {
        history.back();
      } else {
        document.getElementById('result-mode').style.display = 'none';
        document.getElementById('setup-mode').style.display = 'block';
      }
    }

    window.addEventListener('popstate', function(e) {
      if (!e.state || e.state.view !== 'result') {
        document.getElementById('result-mode').style.display = 'none';
        document.getElementById('setup-mode').style.display = 'block';
      }
    });

    function startQuiz() {
      alert('This will launch the Quiz UI with these ' + generatedQuestions.length + ' questions.');
    }

    function exportToAnalyzer() {
      window.location.href = 'performance-analyzer.html';
    }
  </script>
</body>
</html>
