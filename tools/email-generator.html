<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'screen'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

    <div class="header-bar" style="position: relative;">

<div class="container">
  
  <div class="input-panel">
    
    
    <div class="form-group">
      <label>Your Full Name</label>
      <input type="text" id="in_name" class="form-control" placeholder="e.g. Shivarn Singh" oninput="generateTemplates()">
    </div>
    
    <div class="form-group">
      <label>Target Company</label>
      <input type="text" id="in_company" class="form-control" placeholder="e.g. Google, Deloitte" oninput="generateTemplates()">
    </div>

    <div class="form-group">
      <label>Target Job Role</label>
      <input type="text" id="in_role" class="form-control" placeholder="e.g. Marketing Intern, Data Analyst" oninput="generateTemplates()">
    </div>

    <div class="form-group">
      <label>Recipient's Name (HR/Manager)</label>
      <input type="text" id="in_hr" class="form-control" placeholder="e.g. Mr. Smith (Optional)" oninput="generateTemplates()">
    </div>

    <div class="form-group">
      <label>Your Key Skill or Degree</label>
      <input type="text" id="in_skill" class="form-control" placeholder="e.g. MBA Student, Python Developer" oninput="generateTemplates()">
    </div>

    <button class="btn-generate" onclick="generateTemplates()"><i class="fas fa-magic"></i> Generate Messages</button>
  </div>

  <div class="output-panel" id="outputPanel">
    <div class="placeholder-msg">
      <i class="fas fa-envelope-open-text"></i>
      <h3>Your Templates Will Appear Here</h3>
      <p>Fill in the details on the left to see instant results.</p>
    </div>
  </div>

</div>

<script>
  function fallback(val, def) {
    return val && val.trim() !== '' ? val.trim() : def;
  }

  function copyToClipboard(button, textId) {
    const text = document.getElementById(textId).innerText;
    navigator.clipboard.writeText(text).then(() => {
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="fas fa-check"></i> Copied!';
      button.classList.add('copied');
      setTimeout(() => {
        button.innerHTML = originalHTML;
        button.classList.remove('copied');
      }, 2000);
    });
  }

  function generateTemplates() {
    const rawName = document.getElementById('in_name').value;
    const rawCompany = document.getElementById('in_company').value;
    const rawRole = document.getElementById('in_role').value;
    const rawHr = document.getElementById('in_hr').value;
    const rawSkill = document.getElementById('in_skill').value;

    const name = fallback(rawName, "[Your Name]");
    const company = fallback(rawCompany, "[Company]");
    const role = fallback(rawRole, "[Job Role]");
    const hr = fallback(rawHr, "Hiring Manager");
    const skill = fallback(rawSkill, "[Your Degree/Skill]");

    const hrGreeting = rawHr.trim() === "" ? "Hi Team," : "Hi " + hr + ",";

    const templates = [
      {
        id: "linkedin",
        title: "LinkedIn Connection Request",
        icon: "fab fa-linkedin",
        content: "Hi " + (hr === 'Hiring Manager' ? 'there' : hr) + ",\n\nI'm a " + skill + " and a huge fan of the work your team is doing at " + company + ". I am actively looking for " + role + " roles and would love to connect and follow your journey here!\n\nBest,\n" + name
      },
      {
        id: "coldemail",
        title: "<div style='display:flex; flex-direction:column; gap:2px;'><span>Direct Cold Email</span><span style='font-size:0.85rem; font-weight:500; color:#64748b;'>(Short & Punchy)</span></div>",
        icon: "fas fa-envelope",
        content: "Subject: Interested in " + role + " opportunities at " + company + "\n\n" + hrGreeting + "\n\nMy name is " + name + " and I am currently a " + skill + ".\n\nI have been following " + company + " closely and I am very impressed by your recent projects. I am reaching out to see if there are any openings for a " + role + " on your team.\n\nI have attached my resume for your reference. I would love the opportunity to chat for 10 minutes about how I can add value to your team.\n\nThank you for your time!\n\nBest regards,\n" + name
      },
      {
        id: "internship",
        title: "Internship Pitch",
        icon: "fas fa-briefcase",
        content: "Subject: " + role + " Application - " + name + "\n\n" + hrGreeting + "\n\nI hope this email finds you well.\n\nI am a " + skill + " with a strong passion for your industry. I am writing to express my profound interest in joining " + company + " as a " + role + " for the upcoming season.\n\nI am eager to bring my background to your team and learn from the best. Could we schedule a brief call next week to discuss any potential opportunities?\n\nThank you,\n" + name
      },
      {
        id: "followup",
        title: "<div style='display:flex; flex-direction:column; gap:2px;'><span>Follow-Up Message</span><span style='font-size:0.85rem; font-weight:500; color:#64748b;'>(1 Week Later)</span></div>",
        icon: "fas fa-reply",
        content: "Hi " + (hr === 'Hiring Manager' ? 'Team' : hr) + ",\n\nI hope you're having a great week.\n\nI'm following up on my previous message regarding the " + role + " position at " + company + ". I remain very interested in the opportunity and would love to know if you need any additional information from me.\n\nLooking forward to hearing from you.\n\nBest,\n" + name
      }
    ];

    let html = "";
    
    // Only show if at least one field is somewhat filled
    if(rawName || rawCompany || rawRole || rawHr || rawSkill) {
      templates.forEach(t => {
        html += '<div class="template-card">' +
                '<div class="template-header">' +
                '<div class="template-title"><i class="' + t.icon + '"></i> ' + t.title + '</div>' +
                '<button class="btn-copy" onclick="copyToClipboard(this, \'txt_' + t.id + '\')"><i class="far fa-copy"></i> Copy</button>' +
                '</div>' +
                '<div class="template-content" id="txt_' + t.id + '">' + t.content + '</div>' +
                '</div>';
      });
    } else {
      html = '<div class="placeholder-msg">' +
             '<i class="fas fa-envelope-open-text"></i>' +
             '<h3>Your Templates Will Appear Here</h3>' +
             '<p>Fill in the details on the left to see instant results.</p>' +
             '</div>';
    }

    document.getElementById('outputPanel').innerHTML = html;
  }
</script>
