<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'screen'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

  <div class="header-bar">
    <h1><i class="fas fa-file-invoice-dollar" style="color: var(--accent);"></i> GST Calculator</h1>
  </div>

  <div class="container">
    <!-- Input Form -->
    <div class="card" style="align-self: start;">
      <div class="card-title">
        <i class="fas fa-calculator"></i> Enter Details
      </div>

      <!-- Action Mode -->
      <div class="toggle-group" id="mode-group">
        <button class="toggle-btn active" onclick="setMode('add', this)">Add GST (+)</button>
        <button class="toggle-btn" onclick="setMode('remove', this)">Remove GST (-)</button>
      </div>

      <!-- Tax Type Mode -->
      <div class="toggle-group" id="tax-type-group" style="margin-bottom: 25px;">
        <button class="toggle-btn active" onclick="setTaxType('intra', this)">CGST + SGST (Local)</button>
        <button class="toggle-btn" onclick="setTaxType('inter', this)">IGST (Inter-state)</button>
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <div class="input-icon-wrapper">
          <i class="fas fa-rupee-sign"></i>
          <input type="number" id="in-amount" class="form-control" placeholder="0.00" oninput="calculateGST()" value="10000">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 5px;">
        <label>GST Rate (%)</label>
        <div class="rate-grid" id="rate-grid">
          <button class="rate-btn" onclick="setRate(3, this)">3%</button>
          <button class="rate-btn" onclick="setRate(5, this)">5%</button>
          <button class="rate-btn" onclick="setRate(12, this)">12%</button>
          <button class="rate-btn active" onclick="setRate(18, this)">18%</button>
          <button class="rate-btn" onclick="setRate(28, this)">28%</button>
        </div>
      </div>

    </div>

    <!-- Results Panel / Invoice -->
    <div style="display: flex; flex-direction: column;">
      <div class="bill-panel" id="invoice-card">
        <div class="bill-header">
          <i class="fas fa-file-invoice watermark"></i>
          <h3>Tax Breakdown</h3>
          <p id="invoice-subtitle">Exclusive of GST (Adding 18%)</p>
        </div>
        
        <div class="bill-body">
          <div class="bill-row">
            <span class="label">Net Amount (Base Price)</span>
            <span class="value" id="out-net">₹0.00</span>
          </div>
          
          <div class="divider"></div>
          
          <!-- Tax Rows -->
          <div id="tax-breakdown-container">
            <div class="bill-row tax-row" id="row-cgst">
              <span class="label">CGST (9%)</span>
              <span class="value" id="out-cgst">₹0.00</span>
            </div>
            <div class="bill-row tax-row" id="row-sgst">
              <span class="label">SGST (9%)</span>
              <span class="value" id="out-sgst">₹0.00</span>
            </div>
            <div class="bill-row tax-row" id="row-igst" style="display:none;">
              <span class="label">IGST (18%)</span>
              <span class="value" id="out-igst">₹0.00</span>
            </div>
          </div>
          
          <div class="divider"></div>

          <div class="bill-row">
            <span class="label">Total Tax Amount</span>
            <span class="value" style="color: var(--danger);" id="out-tax">₹0.00</span>
          </div>
          
          <div class="bill-total">
            <span class="label">Gross Total</span>
            <span class="value" id="out-gross">₹0.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State variables
    let currentMode = 'add'; // 'add' or 'remove'
    let currentTaxType = 'intra'; // 'intra' (CGST+SGST) or 'inter' (IGST)
    let currentRate = 18;

    function setMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('#mode-group .toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculateGST();
    }

    function setTaxType(type, btn) {
      currentTaxType = type;
      document.querySelectorAll('#tax-type-group .toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // Update UI rows
      if(type === 'intra') {
        document.getElementById('row-cgst').style.display = 'flex';
        document.getElementById('row-sgst').style.display = 'flex';
        document.getElementById('row-igst').style.display = 'none';
      } else {
        document.getElementById('row-cgst').style.display = 'none';
        document.getElementById('row-sgst').style.display = 'none';
        document.getElementById('row-igst').style.display = 'flex';
      }
      calculateGST();
    }

    function setRate(rate, btn) {
      currentRate = rate;
      document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculateGST();
    }

    // Format currency helper
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(amount);
    };

    function calculateGST() {
      const amountInput = parseFloat(document.getElementById('in-amount').value) || 0;
      
      let netAmount = 0;
      let taxAmount = 0;
      let grossAmount = 0;

      if (currentMode === 'add') {
        // Amount is Net
        netAmount = amountInput;
        taxAmount = netAmount * (currentRate / 100);
        grossAmount = netAmount + taxAmount;
        document.getElementById('invoice-subtitle').textContent = `Exclusive of GST (Adding ${currentRate}%)`;
      } else {
        // Amount is Gross
        grossAmount = amountInput;
        // Formula: Net = Gross - [Gross * Rate / (100 + Rate)]
        taxAmount = grossAmount - (grossAmount * (100 / (100 + currentRate)));
        netAmount = grossAmount - taxAmount;
        document.getElementById('invoice-subtitle').textContent = `Inclusive of GST (Removing ${currentRate}%)`;
      }

      // Update Labels for Tax Rate
      const halfRate = currentRate / 2;
      document.querySelector('#row-cgst .label').textContent = `CGST (${halfRate}%)`;
      document.querySelector('#row-sgst .label').textContent = `SGST (${halfRate}%)`;
      document.querySelector('#row-igst .label').textContent = `IGST (${currentRate}%)`;

      // Assign amounts to UI
      document.getElementById('out-net').textContent = formatCurrency(netAmount);
      document.getElementById('out-tax').textContent = formatCurrency(taxAmount);
      document.getElementById('out-gross').textContent = formatCurrency(grossAmount);
      
      // Breakdown tax
      if(currentTaxType === 'intra') {
        const halfTax = taxAmount / 2;
        document.getElementById('out-cgst').textContent = formatCurrency(halfTax);
        document.getElementById('out-sgst').textContent = formatCurrency(halfTax);
      } else {
        document.getElementById('out-igst').textContent = formatCurrency(taxAmount);
      }
    }

    // Init calculation on load
    window.onload = () => calculateGST();

  </script>



</body>
