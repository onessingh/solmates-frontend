    (function() {

        if (darkStyle) {

<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<script>
  let targetPct = 80;

  function setTarget(btn, val) {
    document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    targetPct = val;
  }

  function calculate() {
    const attended = parseInt(document.getElementById('attended').value);
    const total = parseInt(document.getElementById('total').value);

    if (isNaN(attended) || isNaN(total) || total <= 0 || attended < 0 || attended > total) {
      alert('Please enter valid values. Classes attended cannot exceed total classes.');
      return;
    }

    const pct = (attended / total) * 100;
    const rounded = pct.toFixed(1);

    // Determine state
    let state = pct >= targetPct ? 'safe' : pct >= targetPct - 10 ? 'warning' : 'danger';

    // Banner
    const banner = document.getElementById('pctBanner');
    banner.className = 'pct-banner ' + state;
    document.getElementById('pctValue').textContent = rounded + '%';
    document.getElementById('pctStatus').textContent =
      state === 'safe' ? '✅ Target Met' :
      state === 'warning' ? '⚠️ At Risk' : '🔴 Below Target';

    // Info tiles
    let tilesHtml = '';

    if (pct >= targetPct) {
      // Can bunk
      // attended - x / total + future = targetPct/100
      // If we skip x classes (no new classes), find max x where (attended)/(total+x) >= target/100
      // Wait ? bunking means attended stays same, total increases
      // (attended) / (total + x) >= target/100
      // x <= (attended * 100/target) - total
      const canSkip = Math.floor((attended * 100 / targetPct) - total);
      tilesHtml += tile('🎉', canSkip >= 0 ? canSkip : 0, 'Classes you can skip<br>& still meet target', canSkip > 0 ? 'good' : 'warn');
    } else {
      // Need to attend
      // (attended + x) / (total + x) >= target/100
      // 100*(attended+x) >= target*(total+x)
      // 100*attended + 100x >= target*total + target*x
      // x*(100-target) >= target*total - 100*attended
      // x >= (target*total - 100*attended) / (100 - target)
      // Guard: if target is 100% and not already at 100%, it's impossible
      const divisor = 100 - targetPct;
      const needAttend = divisor === 0 ? '∞' : Math.ceil((targetPct * total - 100 * attended) / divisor);
      tilesHtml += tile('📚', needAttend, 'Consecutive classes<br>needed to hit target', 'bad');
    }

    // Extra stats
    const absent = total - attended;
    tilesHtml += tile('📅', total, 'Total Classes Held', '');
    tilesHtml += tile('✏️', attended, 'Classes Attended', '');
    tilesHtml += tile('❌', absent, 'Classes Missed', absent === 0 ? 'good' : absent / total > 0.25 ? 'bad' : 'warn');

    document.getElementById('infoGrid').innerHTML = tilesHtml;

    // Advice
    const adviceBox = document.getElementById('adviceBox');
    adviceBox.className = 'advice-box ' + state;
    document.getElementById('adviceIcon').textContent = state === 'safe' ? '🎯' : state === 'warning' ? '⚠️' : '🚨';

    if (state === 'safe') {
      const canSkip = Math.max(0, Math.floor((attended * 100 / targetPct) - total));
      document.getElementById('adviceTitle').textContent = 'You\'re on track!';
      document.getElementById('adviceText').textContent =
        `Your attendance is ${rounded}% which is above your ${targetPct}% target. You can afford to skip up to ${canSkip} more classes before falling below the limit. Stay consistent!`;
    } else if (state === 'warning') {
      const needAttend2 = (100 - targetPct) === 0 ? '∞' : Math.ceil((targetPct * total - 100 * attended) / (100 - targetPct));
      document.getElementById('adviceTitle').textContent = 'Close to the limit!';
      document.getElementById('adviceText').textContent =
        `Your attendance is ${rounded}% — just ${(targetPct - pct).toFixed(1)}% below your ${targetPct}% target. Attend the next ${needAttend2} classes consecutively to get back on track. Don't skip any more!`;
    } else {
      const needAttend = (100 - targetPct) === 0 ? '∞' : Math.ceil((targetPct * total - 100 * attended) / (100 - targetPct));
      document.getElementById('adviceTitle').textContent = 'Danger Zone!';
      document.getElementById('adviceText').textContent =
        `Your attendance is dangerously low at ${rounded}%. You need to attend the next ${needAttend} classes in a row to reach ${targetPct}%. Skipping even one more class will make recovery harder. Talk to your teacher if needed.`;
    }

    // Show result
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function tile(icon, val, desc, cls) {
    return `
      <div class="info-tile">
        <div class="tile-icon">${icon}</div>
        <div class="tile-val ${cls}">${val}</div>
        <div class="tile-desc">${desc}</div>
      </div>`;
  }

  function resetCalc() {
    document.getElementById('attended').value = '';
    document.getElementById('total').value = '';
    document.getElementById('resultCard').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
