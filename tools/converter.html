<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();

<script>
  const fileInput = document.getElementById('fileInput');
  const dropArea = document.getElementById('dropArea');
  const optionsArea = document.getElementById('optionsArea');
  const formatGrid = document.getElementById('formatGrid');
  const convertBtn = document.getElementById('convertBtn');
  const resultsArea = document.getElementById('resultsArea');
  const downloadResultBtn = document.getElementById('downloadResultBtn');
  const fileList = document.getElementById('fileList');

  let currentFiles = [];
  let targetFormat = 'application/pdf';
  let processedBlob = null;
  let processedFilename = '';

  dropArea.onclick = () => fileInput.click();
  fileInput.onchange = (e) => handleFiles(e.target.files);
  
  dropArea.ondragover = (e) => { e.preventDefault(); dropArea.style.borderColor = '#0071e3'; };
  dropArea.ondragleave = () => { dropArea.style.borderColor = '#ddd'; };
  dropArea.ondrop = (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); };

  function handleFiles(files) {
    if (!files.length) return;
    currentFiles = Array.from(files);
    fileList.innerHTML = currentFiles.map(f => `<div class="file-pill"><span>${f.name}</span></div>`).join('');
    optionsArea.style.display = 'block';
    resultsArea.style.display = 'none';
  }

  formatGrid.addEventListener('click', (e) => {
    if (e.target.dataset.format) {
      targetFormat = e.target.dataset.format;
      Array.from(formatGrid.children).forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      
      const zeroOpts = document.getElementById('zeroSizeOptions');
      if (zeroOpts) {
        zeroOpts.style.display = targetFormat === 'application/pdf-zero' ? 'block' : 'none';
      }
    }
  });

  async function decodeHEIC(file) {
    if (file.name.toLowerCase().endsWith('.heic') || file.type.includes('heic')) {
      const converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
      return Array.isArray(converted) ? converted[0] : converted;
    }
    return file;
  }

  downloadResultBtn.onclick = async () => {
    if (processedBlob && processedFilename) {
      if (typeof window.triggerDownload === 'function') {
        await window.triggerDownload(processedBlob, processedFilename);
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(processedBlob);
        a.download = processedFilename;
        a.click();
      }
    }
  };

  convertBtn.onclick = async () => {
    convertBtn.disabled = true;
    convertBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    resultsArea.style.display = 'none';
    
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'px', compress: true });
      doc.deletePage(1);
      
      const isZero = targetFormat === 'application/pdf-zero';
      const zeroLayout = document.getElementById('zeroSizeLayout') ? parseInt(document.getElementById('zeroSizeLayout').value) : 9;
      const isPdfOut = targetFormat.startsWith('application/pdf'); 
      
        if (isPdfOut) {
            // High-Resolution A4 (increased to 6.0 for crystal-clear sharp text)
            const PRINT_SCALE = 6.0;
            const A4_W = 595 * PRINT_SCALE, A4_H = 842 * PRINT_SCALE; 
            
            if (currentFiles[0].type === 'application/pdf') {
              const arrayBuffer = await currentFiles[0].arrayBuffer();
              const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
              const numPages = pdf.numPages;
              const MAX_PER = isZero ? zeroLayout : 1;
              const numSheets = Math.ceil(numPages / MAX_PER);
    
              for (let s = 0; s < numSheets; s++) {
                const startP = s * MAX_PER + 1;
                const endP = Math.min(startP + MAX_PER - 1, numPages);
                
                let cols = 1, rows = 1;
                if (isZero) {
                   if (MAX_PER === 9) { cols = 3; rows = 3; }
                   else if (MAX_PER === 6) { cols = 2; rows = 3; }
                   else if (MAX_PER === 4) { cols = 2; rows = 2; }
                   else if (MAX_PER === 2) { cols = 1; rows = 2; }
                }
                
                const mW = isZero ? A4_W : (await pdf.getPage(1)).getViewport({scale: PRINT_SCALE}).width;
                const mH = isZero ? A4_H : (await pdf.getPage(1)).getViewport({scale: PRINT_SCALE}).height;
                
                const master = document.createElement('canvas');
                master.width = mW; master.height = mH;
                const mCtx = master.getContext('2d');
                mCtx.fillStyle='#fff'; mCtx.fillRect(0,0,mW,mH);
                
                if (isZero) {
                  const pad = 10 * PRINT_SCALE;
                  const cellW = (mW - (cols + 1) * pad) / cols;
                  const cellH = (mH - (rows + 1) * pad) / rows;
                  
                  for (let i = startP; i <= endP; i++) {
                    const p = await pdf.getPage(i);
                    const origViewport = p.getViewport({ scale: 1.0 });
                    
                    // Render page at exact cell size to prevent interpolation blur
                    const scaleForCell = cellW / origViewport.width;
                    const v = p.getViewport({ scale: scaleForCell });
                    
                    const tmp = document.createElement('canvas');
                    tmp.width = cellW; tmp.height = cellH;
                    const tmpCtx = tmp.getContext('2d');
                    tmpCtx.imageSmoothingEnabled = true;
                    tmpCtx.imageSmoothingQuality = 'high';
                    
                    await p.render({ canvasContext: tmpCtx, viewport: v }).promise;
                    
                    const idx = i - startP;
                    const x = pad + (idx % cols) * (cellW + pad);
                    const y = pad + Math.floor(idx / cols) * (cellH + pad);
                    mCtx.drawImage(tmp, x, y, cellW, cellH);
                    mCtx.strokeStyle='#ccc'; mCtx.lineWidth = 2 * PRINT_SCALE;
                    mCtx.strokeRect(x,y,cellW,cellH);
                  }
                } else {
                  const page = await pdf.getPage(startP);
                  const v = page.getViewport({ scale: PRINT_SCALE });
                  await page.render({ canvasContext: mCtx, viewport: v }).promise;
                }
                
                const data = master.toDataURL('image/jpeg', 1.0);
                const physW = isZero ? 595 : (await pdf.getPage(1)).getViewport({scale:1}).width;
                const physH = isZero ? 842 : (await pdf.getPage(1)).getViewport({scale:1}).height;
                doc.addPage([physW, physH], physW > physH ? 'l' : 'p');
                doc.addImage(data, 'JPEG', 0, 0, physW, physH);
              }
            } else {
              const MAX_PER = isZero ? zeroLayout : 1;
              const numSheets = Math.ceil(currentFiles.length / MAX_PER);
              for (let s = 0; s < numSheets; s++) {
                const startIdx = s * MAX_PER;
                const endIdx = Math.min(startIdx + MAX_PER, currentFiles.length);
                let cols = 1, rows = 1;
                if (isZero) {
                   if (MAX_PER === 9) { cols = 3; rows = 3; }
                   else if (MAX_PER === 6) { cols = 2; rows = 3; }
                   else if (MAX_PER === 4) { cols = 2; rows = 2; }
                   else if (MAX_PER === 2) { cols = 1; rows = 2; }
                }
                const mW = isZero ? A4_W : (new Image(), await (new Promise(r=>{const i=new Image();i.src=URL.createObjectURL(currentFiles[startIdx]);i.onload=()=>r(i.width)})));
                const mH = isZero ? A4_H : (new Image(), await (new Promise(r=>{const i=new Image();i.src=URL.createObjectURL(currentFiles[startIdx]);i.onload=()=>r(i.height)})));
                const master = document.createElement('canvas');
                master.width = mW; master.height = mH;
                const mCtx = master.getContext('2d');
                mCtx.fillStyle='#fff'; mCtx.fillRect(0,0,mW,mH);
                if (isZero) {
                  const pad = 10 * PRINT_SCALE;
                  const cellW = (mW - (cols + 1) * pad) / cols;
                  const cellH = (mH - (rows + 1) * pad) / rows;
                  for (let i = startIdx; i < endIdx; i++) {
                    let f = await decodeHEIC(currentFiles[i]);
                    const img = new Image(); img.src = URL.createObjectURL(f);
                    await new Promise(res => img.onload = res);
                    const idx = i - startIdx;
                    const x = pad + (idx % cols) * (cellW + pad);
                    const y = pad + Math.floor(idx / cols) * (cellH + pad);
                    mCtx.drawImage(img, 0, 0, img.width, img.height, x, y, cellW, cellH);
                    mCtx.strokeStyle='#ccc'; mCtx.lineWidth = 2 * PRINT_SCALE;
                    mCtx.strokeRect(x,y,cellW,cellH);
                  }
                } else {
                  let f = await decodeHEIC(currentFiles[startIdx]);
                  const img = new Image(); img.src = URL.createObjectURL(f);
                  await new Promise(res => img.onload = res);
                  mCtx.drawImage(img, 0, 0);
                }
                const data = master.toDataURL('image/jpeg', 1.0);
                const physW = isZero ? 595 : (mW / PRINT_SCALE);
                const physH = isZero ? 842 : (mH / PRINT_SCALE);
                doc.addPage([physW, physH], physW > physH ? 'l' : 'p');
                doc.addImage(data, 'JPEG', 0, 0, physW, physH);
              }
            }
            processedBlob = doc.output('blob');
            processedFilename = `solmates_${Date.now()}.pdf`;

          } else {
        const zip = new JSZip();
        for (let i = 0; i < currentFiles.length; i++) {
          if (currentFiles[i].type === 'application/pdf') {
            const ab = await currentFiles[i].arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
            for (let j = 1; j <= pdf.numPages; j++) {
              const p = await pdf.getPage(j);
              const v = p.getViewport({ scale: 2.0 });
              const canv = document.createElement('canvas');
              canv.width = v.width; canv.height = v.height;
              await p.render({ canvasContext: canv.getContext('2d'), viewport: v }).promise;
              const b = await new Promise(res => canv.toBlob(res, targetFormat, 0.9));
              zip.file(`page_${j}.${targetFormat.split('/')[1]}`, b);
            }
          } else {
            let f = await decodeHEIC(currentFiles[i]);
            const img = new Image(); img.src = URL.createObjectURL(f);
            await new Promise(res => img.onload = res);
            const canv = document.createElement('canvas');
            canv.width = img.width; canv.height = img.height;
            canv.getContext('2d').drawImage(img, 0, 0);
            const b = await new Promise(res => canv.toBlob(res, targetFormat, 0.9));
            zip.file(`image_${i}.${targetFormat.split('/')[1]}`, b);
          }
        }
        processedBlob = await zip.generateAsync({ type: 'blob' });
        processedFilename = `converted_${Date.now()}.zip`;
      }
      
      resultsArea.style.display = 'block';
      convertBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Convert Another';
    } catch (e) {
      console.error(e); alert('Error: ' + e.message);
      convertBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Convert File(s)';
    } finally {
      convertBtn.disabled = false;
    }
  };

</script>
</body>
