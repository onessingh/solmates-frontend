<script>
// OS-based theme-color for TWA status bar
(function(){
  var m=document.getElementById('theme-color-meta');
  if(!m){m=document.createElement('meta');m.name='theme-color';m.id='theme-color-meta';document.head.appendChild(m);}
  function setOsColor(){m.setAttribute('content',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#0f172a':'#ffffff');}
  setOsColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setOsColor);
})();
</script>

    .res-neutral{background:rgba(0,113,227,0.07);color:#2563eb;border:1px solid rgba(0,113,227,0.15);}

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'screen'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<script>
const RATIOS = {
  liquidity: [
    {
      name: 'Current Ratio',
      formula: 'Current Assets / Current Liabilities',
      desc: 'Measures ability to pay short-term obligations. Ideal: 2:1',
      inputs: [{id:'ca', label:'Current Assets (?)'}, {id:'cl', label:'Current Liabilities (?)'}],
      calc: (v) => v.ca / v.cl,
      fmt: (r) => r.toFixed(2) + ' : 1',
      interp: (r) => r >= 2 ? ['good','? Good. Company can comfortably pay short-term debts.'] : r >= 1 ? ['warn','?? Acceptable but tight. Monitor cash flow carefully.'] : ['bad','?? Poor. Company may struggle to meet short-term obligations.']
    },
    {
      name: 'Quick Ratio (Acid Test)',
      formula: '(Current Assets - Inventory) / Current Liabilities',
      desc: 'Stricter liquidity measure excluding inventory. Ideal: = 1',
      inputs: [{id:'ca', label:'Current Assets (?)'}, {id:'inv', label:'Inventory (?)'}, {id:'cl', label:'Current Liabilities (?)'}],
      calc: (v) => (v.ca - v.inv) / v.cl,
      fmt: (r) => r.toFixed(2) + ' : 1',
      interp: (r) => r >= 1 ? ['good','? Strong quick ratio. Liquid assets cover short-term liabilities.'] : r >= 0.7 ? ['warn','?? Below ideal. Company relies on inventory for liquidity.'] : ['bad','?? Weak. Business is highly dependent on inventory sales.']
    },
    {
      name: 'Cash Ratio',
      formula: 'Cash & Equivalents / Current Liabilities',
      desc: 'Most conservative liquidity ratio • only cash counts. Ideal: 0.5•1',
      inputs: [{id:'cash', label:'Cash & Equivalents (?)'}, {id:'cl', label:'Current Liabilities (?)'}],
      calc: (v) => v.cash / v.cl,
      fmt: (r) => r.toFixed(2),
      interp: (r) => r >= 0.5 ? ['good','? Healthy cash position.'] : r >= 0.2 ? ['warn','?? Low cash reserve. May need external funding for emergencies.'] : ['bad','?? Very low cash ratio. High liquidity risk.']
    },
  ],
  profitability: [
    {
      name: 'Gross Profit Margin',
      formula: '(Revenue - COGS) • Revenue • 100',
      desc: 'Profitability after direct production costs. Ideal: Industry-specific',
      inputs: [{id:'rev', label:'Revenue (?)'}, {id:'cogs', label:'Cost of Goods Sold (?)'}],
      calc: (v) => ((v.rev - v.cogs) / v.rev) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 40 ? ['good','? Strong gross margin. Good pricing or low production cost.'] : r >= 20 ? ['warn','?? Moderate margin. Keep a close eye on COGS.'] : ['bad','?? Low gross margin. High production costs may be a concern.']
    },
    {
      name: 'Net Profit Margin',
      formula: 'Net Profit • Revenue • 100',
      desc: 'Percentage of revenue that becomes profit after all expenses.',
      inputs: [{id:'np', label:'Net Profit (?)'}, {id:'rev', label:'Revenue (?)'}],
      calc: (v) => (v.np / v.rev) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 15 ? ['good','? Excellent profitability.'] : r >= 5 ? ['warn','?? Moderate. Room for cost optimization.'] : r >= 0 ? ['warn','?? Thin margin. Very sensitive to revenue drops.'] : ['bad','?? Negative margin. Company is losing money.']
    },
    {
      name: 'Return on Investment (ROI)',
      formula: '(Net Gain • Cost of Investment) • 100',
      desc: 'Measures efficiency of an investment. Higher is better.',
      inputs: [{id:'gain', label:'Net Gain / Profit (?)'}, {id:'cost', label:'Cost of Investment (?)'}],
      calc: (v) => (v.gain / v.cost) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 20 ? ['good','? Excellent ROI. Investment is highly efficient.'] : r >= 10 ? ['warn','?? Decent ROI. Better than most fixed deposits.'] : r >= 0 ? ['warn','?? Low but positive. Consider alternatives.'] : ['bad','?? Negative ROI. Loss-making investment.']
    },
    {
      name: 'Return on Equity (ROE)',
      formula: 'Net Income • Shareholders\' Equity • 100',
      desc: 'How effectively the company generates profit from shareholders\' equity.',
      inputs: [{id:'ni', label:'Net Income (?)'}, {id:'eq', label:"Shareholders' Equity (?)"}],
      calc: (v) => (v.ni / v.eq) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 15 ? ['good','? Strong ROE. Shareholders are getting good returns.'] : r >= 8 ? ['warn','?? Average ROE. Reasonable but could be better.'] : ['bad','?? Low ROE. Shareholders may not be getting enough returns.']
    },
    {
      name: 'Return on Assets (ROA)',
      formula: 'Net Income • Total Assets • 100',
      desc: 'How profitably a company uses its assets to generate earnings.',
      inputs: [{id:'ni', label:'Net Income (?)'}, {id:'ta', label:'Total Assets (?)'}],
      calc: (v) => (v.ni / v.ta) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 10 ? ['good','? High ROA. Assets are being used very efficiently.'] : r >= 5 ? ['warn','?? Moderate ROA. Average asset utilization.'] : ['bad','?? Low ROA. Assets may be underutilized or over-invested.']
    },
    {
      name: 'EBITDA Margin',
      formula: 'EBITDA • Revenue • 100',
      desc: 'Operating profitability before non-cash and financing charges.',
      inputs: [{id:'ebitda', label:'EBITDA (?)'}, {id:'rev', label:'Revenue (?)'}],
      calc: (v) => (v.ebitda / v.rev) * 100,
      fmt: (r) => r.toFixed(2) + '%',
      interp: (r) => r >= 25 ? ['good','? Excellent EBITDA margin. Highly efficient operations.'] : r >= 10 ? ['warn','?? Healthy EBITDA. Operational costs are manageable.'] : ['bad','?? Low EBITDA margin. Operations may be inefficient.']
    },
  ],
  leverage: [
    {
      name: 'Debt-to-Equity (D/E) Ratio',
      formula: 'Total Debt • Shareholders\' Equity',
      desc: 'Measures financial leverage. Lower D/E = less risky. Ideal: < 1',
      inputs: [{id:'debt', label:'Total Debt (?)'}, {id:'eq', label:"Shareholders' Equity (?)"}],
      calc: (v) => v.debt / v.eq,
      fmt: (r) => r.toFixed(2),
      interp: (r) => r <= 0.5 ? ['good','? Low leverage. Company is mostly equity-funded • conservative & stable.'] : r <= 1 ? ['warn','?? Moderate leverage. Manageable debt load.'] : r <= 2 ? ['warn','?? High leverage. May become risky if earnings drop.'] : ['bad','?? Very high D/E. Potential debt servicing difficulties.']
    },
    {
      name: 'Debt-to-Assets Ratio',
      formula: 'Total Debt • Total Assets',
      desc: 'Proportion of assets financed by debt. Ideal: < 0.5',
      inputs: [{id:'debt', label:'Total Debt (?)'}, {id:'ta', label:'Total Assets (?)'}],
      calc: (v) => v.debt / v.ta,
      fmt: (r) => r.toFixed(2),
      interp: (r) => r <= 0.3 ? ['good','? Healthy. Most assets are equity-funded.'] : r <= 0.5 ? ['warn','?? Moderate. Watch debt growth against asset growth.'] : ['bad','?? High ratio. More than half of assets funded by debt • risky.']
    },
    {
      name: 'Interest Coverage Ratio',
      formula: 'EBIT • Interest Expense',
      desc: 'Ability to pay interest on outstanding debt. Ideal: > 3',
      inputs: [{id:'ebit', label:'EBIT (?)'}, {id:'int', label:'Interest Expense (?)'}],
      calc: (v) => v.ebit / v.int,

function N(x) {
    let sign = (x < 0) ? -1 : 1;
    x = Math.abs(x) / Math.sqrt(2.0);
    let t = 1.0 / (1.0 + 0.3275911 * x);
    let a1 =  0.254829592;
    let a2 = -0.284496736;
    let a3 =  1.421413741;
    let a4 = -1.453152027;
    let a5 =  1.061405429;
    let erf = 1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return 0.5 * (1.0 + sign * erf);
}

function phi(x) {
    return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
}

function calcGreeksAndPrices(S, K, T, v, r, q, type) {
    const d1 = (Math.log(S / K) + (r - q + (v * v) / 2) * T) / (v * Math.sqrt(T));
    const d2 = d1 - v * Math.sqrt(T);

    const Nd1 = N(d1);
    const Nd2 = N(d2);
    const N_d1 = N(-d1);
    const N_d2 = N(-d2);
    
    let price, delta, gamma, theta, vega, rho;
    
    gamma = Math.exp(-q * T) * phi(d1) / (S * v * Math.sqrt(T));
    vega = S * Math.exp(-q * T) * phi(d1) * Math.sqrt(T);
    const vega_1pct = vega / 100;

    if (type === 'call') {
        price = S * Math.exp(-q * T) * Nd1 - K * Math.exp(-r * T) * Nd2;
        delta = Math.exp(-q * T) * Nd1;
        theta = -(S * Math.exp(-q * T) * phi(d1) * v) / (2 * Math.sqrt(T)) - r * K * Math.exp(-r * T) * Nd2 + q * S * Math.exp(-q * T) * Nd1;
        rho = K * T * Math.exp(-r * T) * Nd2;
    } else {
        price = K * Math.exp(-r * T) * N_d2 - S * Math.exp(-q * T) * N_d1;
        delta = Math.exp(-q * T) * (Nd1 - 1);
        theta = -(S * Math.exp(-q * T) * phi(d1) * v) / (2 * Math.sqrt(T)) + r * K * Math.exp(-r * T) * N_d2 - q * S * Math.exp(-q * T) * N_d1;
        rho = -K * T * Math.exp(-r * T) * N_d2;
    }
    
    const theta_1day = theta / 365;
    const rho_1pct = rho / 100;

    return {
        price, d1, d2, Nd1, Nd2, delta, gamma, theta_1day, vega_1pct, rho_1pct, T, v, r, q, N_d1, N_d2
    };
}

function textNumberToDays(text) {
    // Convert written-out time expressions to approximate days
    const wordMap = {
        'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5,
        'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10,
        'eleven': 11, 'twelve': 12, 'half': 0.5, 'a': 1, 'an': 1
    };
    // e.g. "two months left", "three months", "half year", "one year"
    let m = text.match(/(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|half|an?)\s+(?:and\s+(?:a\s+)?half\s+)?months?/i);
    if(m) {
        let base = wordMap[m[1].toLowerCase()] || 1;
        let extra = m[0].includes('and') ? 0.5 : 0;
        return (base + extra) * 30;
    }
    m = text.match(/(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|half|an?)\s+(?:and\s+(?:a\s+)?half\s+)?years?/i);
    if(m) {
        let base = wordMap[m[1].toLowerCase()] || 1;
        let extra = m[0].includes('and') ? 0.5 : 0;
        return (base + extra) * 365;
    }
    // "a quarter" => ~91 days
    if(text.match(/a quarter/i)) return 91;
    return null;
}

function runLocalParser(text) {
    let detected = { S: null, K: null, T: null, v: null, r: null, q: null, type: null };
    const digitPat = '([\\d.,]*\\d[\\d.,]*)';

    // Stock price patterns — most specific first
    const sP = new RegExp(
        '(?:market price of (?:a|the) (?:share|stock|equity|underlying)|' +
        'underlying security(?:\\s+is)?\\s+(?:quoted|priced|valued|trading) at|' +
        'underlying asset(?:\\s+is)?\\s+(?:quoted|priced|valued|trading) at|' +
        'underlying(?:\\s+is)?\\s+(?:quoted|priced|valued|trading) at|' +
        'underlying price|underlying asset price|' +
        'market price|share price|current market price|current market value|' +
        'stock(?: is)?(?: currently)? trading at|currently trading at|' +
        'stock(?: is)?(?: currently)? valued at|stock(?: is)?(?: currently)? quoted at|' +
        'share(?: is)?(?: currently)? valued at|share(?: is)?(?: currently)? quoted at|' +
        'current value of the (?:stock|share)|stock(?: is)? priced at|share(?: is)? priced at|' +
        'current stock price|stock price|s\\s*=)' +
        '[^\\d]*' + digitPat, 'i');
    let sM = text.match(sP);
    if(sM) { let v = parseFloat(sM[1].replace(/,/g, '')); if(!isNaN(v)) detected.S = v; }

    // Strike price patterns — most specific first
    const kP = new RegExp(
        '(?:contractual exercise(?:\\s+level| price)|' +
        'exercise(?:\\s+level|\\s+price)(?:\\s+of(?:\\s+the)?(?:\\s+option)?)?|' +
        'strike(?:\\s+price)?(?:\\s+of(?:\\s+the)?(?:\\s+option)?)?|' +
        'k\\s*=)' +
        '[^\\d]*' + digitPat, 'i');
    let kM = text.match(kP);
    if(kM) { let v = parseFloat(kM[1].replace(/,/g, '')); if(!isNaN(v)) detected.K = v; }

    // Time to expiry — numeric first, then written-out
    const tDayP = new RegExp(digitPat + '\\s*(?:trading\\s+)?days?(?:\\s+to\\s+expiry|\\s+remaining|\\s+until|\\s+left|\\s+before)?', 'i');
    const tMonP = new RegExp(digitPat + '\\s*months?', 'i');
    const tYrP  = new RegExp(digitPat + '\\s*years?', 'i');
    let tDM = text.match(tDayP);
    let tMM = text.match(tMonP);
    let tYM = text.match(tYrP);
    if(tDM) detected.T = parseFloat(tDM[1]);
    else if(tMM) detected.T = parseFloat(tMM[1]) * 30;
    else if(tYM) detected.T = parseFloat(tYM[1]) * 365;
    else {
        // Try written-out word numbers
        let written = textNumberToDays(text);
        if(written !== null) detected.T = written;
    }

    // Volatility
    const vP = new RegExp('(?:annualized(?:\\s+standard deviation|\\s+volatility)|annual(?:\\s+volatility)?|volatility|standard deviation)[^\\d]*' + digitPat, 'i');
    let vM = text.match(vP); if(vM) detected.v = parseFloat(vM[1]);

    // Risk-free rate
    const rP = new RegExp('(?:continuously compounded risk-free(?: interest)? (?:rate|return)|risk-free(?: interest)? (?:rate|return)|risk free(?: interest)? (?:rate|return)|r\\s*=)[^\\d]*' + digitPat, 'i');
    let rM = text.match(rP); if(rM) detected.r = parseFloat(rM[1]);

    // Dividend yield
    const qP = new RegExp('(?:annual dividend yield|dividend yield|annual dividend(?! per)|q\\s*=)[^\\d]*' + digitPat, 'i');
    let qM = text.match(qP); if(qM) detected.q = parseFloat(qM[1]); else detected.q = 0;

    // Option type
    if(text.includes('put')) detected.type = 'put';
    else if(text.includes('call')) detected.type = 'call';

    return detected;
}

function getMissingFields(detected) {
    let missing = [];
    if(detected.S === null || isNaN(detected.S)) missing.push('Stock Price');
    if(detected.K === null || isNaN(detected.K)) missing.push('Strike Price');
    if(detected.T === null || isNaN(detected.T)) missing.push('Days to Expiry');
    if(detected.v === null || isNaN(detected.v)) missing.push('Volatility');
    if(detected.r === null || isNaN(detected.r)) missing.push('Risk-Free Rate');
    return missing;
}

function applyDetectedToUI(detected, aiAssisted) {
    if(detected.S !== null) document.getElementById('bs_S').value = detected.S;
    else document.getElementById('bs_S').value = '';
    if(detected.K !== null) document.getElementById('bs_K').value = detected.K;
    else document.getElementById('bs_K').value = '';
    if(detected.T !== null) document.getElementById('bs_T').value = detected.T;
    else document.getElementById('bs_T').value = '';
    if(detected.v !== null) document.getElementById('bs_v').value = detected.v;
    else document.getElementById('bs_v').value = '';
    if(detected.r !== null) document.getElementById('bs_r').value = detected.r;
    else document.getElementById('bs_r').value = '';
    document.getElementById('bs_q').value = (detected.q !== null && !isNaN(detected.q)) ? detected.q : '0';
    if(detected.type !== null) document.getElementById('bs_type').value = detected.type;

    let missing = getMissingFields(detected);
    let errDiv = document.getElementById('bs-parse-error');
    let detectedTitle = document.getElementById('bs-detected-title');

    if(missing.length > 0) {
        errDiv.innerText = "Could not detect: " + missing.join(", ") + ". Please enter them manually.";
        errDiv.style.color = "var(--danger)";
    } else {
        errDiv.innerText = aiAssisted ? "Detection successful (AI-assisted). Please review the values." : "Detection successful. Please review the values.";
        errDiv.style.color = "var(--success)";
    }

    detectedTitle.style.display = 'block';
    detectedTitle.innerText = aiAssisted ? "Detected Values (AI-assisted)" : "Detected Values";
    document.getElementById('bs-inputs-section').style.display = 'block';
    document.getElementById('bs-calc-btn-text').innerText = "Solve";
}

function mergeWithAI(local, ai) {
    let merged = Object.assign({}, local);
    const fields = ['S', 'K', 'T', 'v', 'r', 'q', 'type'];
    for(let f of fields) {
        if((merged[f] === null || isNaN(merged[f])) && ai[f] !== null && ai[f] !== undefined) {
            merged[f] = ai[f];
        }
    }
    return merged;
}

async function parseBSQuestion() {
    const questionText = document.getElementById('bs-question-text').value;
    const text = questionText.toLowerCase();
    
    document.getElementById('bs-parse-error').innerText = '';
    document.getElementById('bs-result').style.display = 'none';

    let detected = runLocalParser(text);
    let missing = getMissingFields(detected);

    if(missing.length === 0) {
        // Local parser got everything — no AI needed
        applyDetectedToUI(detected, false);
        return;
    }

    // AI fallback for missing fields
    let errDiv = document.getElementById('bs-parse-error');
    let detectBtn = document.getElementById('bs-detect-btn');
    
    // Set loading state on button instead of errDiv
    detectBtn.innerText = "Detecting values...";
    detectBtn.disabled = true;
    detectBtn.style.opacity = "0.7";
    detectBtn.style.cursor = "not-allowed";

    try {
        if(window.solmatesAPI) {
            const aiResult = await window.solmatesAPI.generateAIToolData('black-scholes-parser', { question: questionText });
            if(aiResult && aiResult.success !== false) {
                let aiData = (aiResult.data !== undefined) ? aiResult.data : aiResult;
                let aiDetected = {
                    S: (aiData.stockPrice !== undefined && aiData.stockPrice !== null) ? parseFloat(aiData.stockPrice) : null,
                    K: (aiData.strikePrice !== undefined && aiData.strikePrice !== null) ? parseFloat(aiData.strikePrice) : null,
                    T: (aiData.daysToExpiry !== undefined && aiData.daysToExpiry !== null) ? parseFloat(aiData.daysToExpiry) : null,
                    v: (aiData.volatility !== undefined && aiData.volatility !== null) ? parseFloat(aiData.volatility) : null,
                    r: (aiData.riskFreeRate !== undefined && aiData.riskFreeRate !== null) ? parseFloat(aiData.riskFreeRate) : null,
                    q: (aiData.dividendYield !== undefined && aiData.dividendYield !== null) ? parseFloat(aiData.dividendYield) : 0,
                    type: aiData.optionType || null
                };
                let merged = mergeWithAI(detected, aiDetected);
                applyDetectedToUI(merged, true);
            } else {
                applyDetectedToUI(detected, false);
            }
        } else {
            applyDetectedToUI(detected, false);
        }
    } catch(e) {
        applyDetectedToUI(detected, false);
        if(getMissingFields(detected).length > 0) {
            errDiv.innerText += " AI fallback failed. Please enter missing values manually.";
        }
    } finally {
        // Restore button state
        detectBtn.innerText = "Detect Values";
        detectBtn.disabled = false;
        detectBtn.style.opacity = "1";
        detectBtn.style.cursor = "pointer";
    }
}

function solveBlackScholes() {
    const type = document.getElementById('bs_type').value;
    const S = parseFloat(document.getElementById('bs_S').value);
    const K = parseFloat(document.getElementById('bs_K').value);
    const T_days = parseFloat(document.getElementById('bs_T').value);
    const v_pct = parseFloat(document.getElementById('bs_v').value);
    const r_pct = parseFloat(document.getElementById('bs_r').value);
    const q_pct = parseFloat(document.getElementById('bs_q').value) || 0;

    if (isNaN(S) || S <= 0) { alert('Please enter a valid stock price greater than 0.'); return; }
    if (isNaN(K) || K <= 0) { alert('Please enter a valid strike price greater than 0.'); return; }
    if (isNaN(T_days) || T_days <= 0) { alert('Please enter days to expiry greater than 0.'); return; }
    if (isNaN(v_pct) || v_pct <= 0) { alert('Please enter volatility greater than 0%.'); return; }
    if (isNaN(r_pct)) { alert('Please enter a valid risk-free rate.'); return; }

    const T = T_days / 365;
    const v = v_pct / 100;
    const r = r_pct / 100;
    const q = q_pct / 100;

    const res = calcGreeksAndPrices(S, K, T, v, r, q, type);
    
    let resultHTML = `
      <div class="res-main">₹ ${res.price.toFixed(2)}</div>
      <div class="res-label">Option Price</div>

        <div class="bs-step-row"><span>Stock Price (S)</span><span>${S}</span></div>
        <div class="bs-step-row"><span>Strike Price (K)</span><span>${K}</span></div>
        <div class="bs-step-row"><span>Time to Expiry (T)</span><span>${res.T.toFixed(5)} years</span></div>
        <div class="bs-step-row"><span>Volatility (σ)</span><span>${(res.v * 100).toFixed(2)}%</span></div>
        <div class="bs-step-row"><span>Risk-Free Rate (r)</span><span>${(res.r * 100).toFixed(2)}%</span></div>
        <div class="bs-step-row"><span>Dividend Yield (q)</span><span>${(res.q * 100).toFixed(2)}%</span></div>
        <div class="bs-step-row"><span>Option Type</span><span style="text-transform: capitalize;">${type}</span></div>
        
        <div class="bs-step-row" style="margin-top:10px;"><span>d1</span><span>${res.d1.toFixed(4)}</span></div>
        <div class="bs-step-row"><span>d2</span><span>${res.d2.toFixed(4)}</span></div>
        <div class="bs-step-row"><span>N(d1)</span><span>${res.Nd1.toFixed(6)}</span></div>
        <div class="bs-step-row"><span>N(d2)</span><span>${res.Nd2.toFixed(6)}</span></div>
      </div>

      <h4 style="margin-top: 20px; color: var(--primary); text-align: left;">Greeks</h4>
      <div class="bs-greeks-grid">
        <div class="bs-greek-card">
          <div class="bs-greek-val">${res.delta.toFixed(4)}</div>
          <div class="bs-greek-lbl">Delta</div>
        </div>
        <div class="bs-greek-card">
          <div class="bs-greek-val">${res.gamma.toFixed(4)}</div>
          <div class="bs-greek-lbl">Gamma</div>
        </div>
        <div class="bs-greek-card">
          <div class="bs-greek-val">${res.theta_1day.toFixed(4)}</div>
          <div class="bs-greek-lbl">Theta (Daily)</div>
        </div>
        <div class="bs-greek-card">
          <div class="bs-greek-val">${res.vega_1pct.toFixed(4)}</div>
          <div class="bs-greek-lbl">Vega (per 1%)</div>
        </div>
        <div class="bs-greek-card">
          <div class="bs-greek-val">${res.rho_1pct.toFixed(4)}</div>
          <div class="bs-greek-lbl">Rho (per 1%)</div>
        </div>
      </div>

      <details style="margin-top: 15px; text-align: left;">
         <summary style="cursor: pointer; color: var(--accent); font-weight: 600;">Show Calculation Steps</summary>
         <div style="margin-top: 10px; font-size: 0.85rem; color: var(--text); padding: 10px; background: rgba(0,0,0,0.03); border-radius: 8px;">
            <p><strong>Step 1:</strong> Convert days into years<br/>T = ${T_days} / 365 = ${res.T.toFixed(5)}</p>

            <p style="margin-top:8px;"><strong>Step 3:</strong> Calculate d1<br/>d1 = [ln(${S}/${K}) + (${res.r} - ${res.q} + ${res.v}²/2) * ${res.T.toFixed(5)}] / (${res.v} * √${res.T.toFixed(5)}) = ${res.d1.toFixed(4)}</p>
            <p style="margin-top:8px;"><strong>Step 4:</strong> Calculate d2<br/>d2 = ${res.d1.toFixed(4)} - ${res.v} * √${res.T.toFixed(5)} = ${res.d2.toFixed(4)}</p>
            <p style="margin-top:8px;"><strong>Step 5:</strong> Calculate N(d1) and N(d2)<br/>N(d1) = ${res.Nd1.toFixed(6)}<br/>N(d2) = ${res.Nd2.toFixed(6)}</p>
            ${type === 'put' ? `<p style="margin-top:8px;"><strong>Step 5b:</strong> Calculate N(-d1) and N(-d2)<br/>N(-d1) = 1 - N(d1) = ${res.N_d1.toFixed(6)}<br/>N(-d2) = 1 - N(d2) = ${res.N_d2.toFixed(6)}</p>` : ''}
            <p style="margin-top:8px;"><strong>Step 6:</strong> Apply ${type} formula<br/>
            ${type === 'call' ? `C = ${S} * e^(-${res.q}*${res.T.toFixed(5)}) * ${res.Nd1.toFixed(6)} - ${K} * e^(-${res.r}*${res.T.toFixed(5)}) * ${res.Nd2.toFixed(6)}` : `P = ${K} * e^(-${res.r}*${res.T.toFixed(5)}) * ${res.N_d2.toFixed(6)} - ${S} * e^(-${res.q}*${res.T.toFixed(5)}) * ${res.N_d1.toFixed(6)}`}</p>
            <p style="margin-top:8px;"><strong>Step 7:</strong> Final Option Price = ₹ ${res.price.toFixed(2)}</p>
         </div>
      </details>
    `;
    
    document.getElementById('bs-result').innerHTML = resultHTML;
    document.getElementById('bs-result').style.display = 'block';
}
function renderRatios() {
  const grid = document.getElementById('ratiosGrid');
  if (currentCat === 'black-scholes') {
    grid.innerHTML = `
<div class="ratio-card" style="grid-column: 1 / -1; max-width: 600px; margin: 0 auto;">
  <div class="rc-head" style="margin-bottom: 20px;">
    <div class="rc-info">
      <div class="rc-name" style="font-size: 1.2rem;">Black-Scholes Option Calculator</div>
    </div>
  </div>
  <div class="bs-modes">
    <div class="bs-mode-tabs" style="display: flex; gap: 8px; margin-bottom: 20px;">
      <button class="ctab bs-mtab active" onclick="setBSMode('manual')" style="flex: 1; justify-content: center;">Manual Calculator</button>
      <button class="ctab bs-mtab" onclick="setBSMode('parser')" style="flex: 1; justify-content: center;">Solve from Question</button>
    </div>
    
    <div id="bs-parser-section" style="display:none; margin-bottom: 20px;">
      <div class="inp-group">
        <label>Paste your Black-Scholes question</label>
        <textarea id="bs-question-text" class="rc-inp" rows="5" placeholder="Example: A stock is currently trading at ₹500. The strike price is ₹520, expiry is 30 days, volatility is 25%, risk-free rate is 6% and dividend yield is 1%. Calculate the European call option value using Black-Scholes model." style="resize: vertical;"></textarea>
      </div>
      <button id="bs-detect-btn" class="btn-calc" style="margin-top: 10px;" onclick="parseBSQuestion()">
         Detect Values
      </button>
      <div id="bs-parse-error" style="margin-top: 10px; font-size: 0.85rem;"></div>
    </div>

    <div id="bs-inputs-section">
       <h4 id="bs-detected-title" style="display:none; margin-bottom: 15px; color: var(--primary);">Detected Values</h4>
       <div class="rc-inputs">
         <div class="inp-group">
           <label>Option Type</label>
           <select id="bs_type" class="rc-inp">
              <option value="call">Call</option>
              <option value="put">Put</option>
           </select>
         </div>
         <div class="inp-group"><label>Current Stock Price (S)</label><input type="number" id="bs_S" class="rc-inp" placeholder="0"></div>
         <div class="inp-group"><label>Strike Price (K)</label><input type="number" id="bs_K" class="rc-inp" placeholder="0"></div>
         <div class="inp-group"><label>Days to Expiry</label><input type="number" id="bs_T" class="rc-inp" placeholder="0"></div>
         <div class="inp-group"><label>Volatility (σ) %</label><input type="number" id="bs_v" class="rc-inp" placeholder="0"></div>
         <div class="inp-group"><label>Risk-Free Rate (r) %</label><input type="number" id="bs_r" class="rc-inp" placeholder="0"></div>
         <div class="inp-group"><label>Dividend Yield (q) % (Optional)</label><input type="number" id="bs_q" class="rc-inp" placeholder="0"></div>
       </div>
       <button class="btn-calc" style="margin-top: 15px;" onclick="solveBlackScholes()">
          <i class="fas fa-calculator"></i> <span id="bs-calc-btn-text">Calculate</span>
       </button>
    </div>
    
    <div id="bs-result" class="result-box" style="margin-top: 20px;"></div>
  </div>
</div>
<style>
.bs-step-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.bs-greeks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; margin-bottom: 15px; }
@media(max-width:500px){ .bs-greeks-grid { grid-template-columns: repeat(2, 1fr); } }
.bs-greek-card { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
.bs-greek-val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
.bs-greek-lbl { font-size: 0.75rem; color: var(--light); margin-top: 3px; }
.dark .bs-greek-card { background: #334155; }
.dark .bs-step-row { border-color: #475569; }
</style>
`;
    return;
  }
  grid.innerHTML = RATIOS[currentCat].map((ratio, idx) => {
    const inputsHTML = ratio.inputs.map(inp => `
      <div class="inp-group">
        <label>${inp.label}</label>
        <input class="rc-inp" type="number" id="${currentCat}_${idx}_${inp.id}" placeholder="0" min="0" step="any">
      </div>
    `).join('');

    return `
      <div class="ratio-card">
        <div class="rc-head">
          <div class="rc-info">
            <div class="rc-name">${ratio.name}</div>
            <div class="rc-formula">${ratio.formula}</div>
            <div class="rc-desc">${ratio.desc}</div>
          </div>
        </div>
        <div class="rc-inputs ${ratio.inputs.length === 1 ? 'single' : ''}">${inputsHTML}</div>
        <button class="btn-calc" onclick="calculate('${currentCat}', ${idx})">
          <i class="fas fa-calculator"></i> Calculate
        </button>
        <div class="result-box" id="res_${currentCat}_${idx}"></div>
      </div>
    `;
  }).join('');
}

function calculate(cat, idx) {
  const ratio = RATIOS[cat][idx];
  const values = {};
  let hasEmpty = false;

  ratio.inputs.forEach(inp => {
    const el = document.getElementById(`${cat}_${idx}_${inp.id}`);
    const val = parseFloat(el.value);
    if (isNaN(val)) { hasEmpty = true; }
    values[inp.id] = val;
  });

  if (hasEmpty) { alert('Please fill in all fields.'); return; }

  let result;
  try { result = ratio.calc(values); }
  catch(e) { alert('Invalid values. Check for zero denominators.'); return; }

  if (!isFinite(result)) { alert('Cannot divide by zero. Please check your inputs.'); return; }

  const formatted = ratio.fmt(result);
  const [interpClass, interpText] = ratio.interp(result);

  const box = document.getElementById(`res_${cat}_${idx}`);
  box.style.display = 'block';
  box.innerHTML = `
    <div class="res-main">${formatted}</div>
    <div class="res-label">${ratio.name}</div>
    <div class="res-interp res-${interpClass}">${interpText}</div>
  `;
}

renderRatios();
</script>
</body>
</html>
