<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">
    :root {
      --bg-body: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-lighter: #cbd5e1;
      --bg-nav: rgba(15, 23, 42, 0.98);
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border-color: #334155;
      --hero-bg: linear-gradient(to bottom, #0f172a, #1e293b);
      --brand-primary: #f8fafc;
      --brand-accent: #c0962d;
      --bg-light: var(--bg-card-hover, #334155);
    }

    body { background: var(--bg-body, #0f172a) !important; color: var(--text-main, #f8fafc) !important; }
    .top-nav, .header-bar, header { background: var(--bg-nav, rgba(15,23,42,0.95)) !important; border-bottom: 1px solid var(--border-color, #334155) !important; }
    .card, .form-card, .result-box, .result-area, .white-box, .container, .main-content, .card-body, .feature-item, .info-box, .upload-area, .upload-card, .tool-card { 
        background: var(--bg-card, #1e293b) !important; 
        border: 1px solid var(--border-color, #334155) !important; 
    }
    #resultArea, #result-section, #workspace { background: var(--bg-card, #1e293b) !important; border-color: var(--border-color, #334155) !important; }
    
    .upload-card:hover { background: var(--bg-card-hover, #334155) !important; border-color: var(--brand-accent, #c0962d) !important; }
    .upload-card i, .upload-card h2 { color: var(--text-main, #f8fafc) !important; }
    h1, h2, h3, h4, .nav-logo { color: var(--text-main, #f8fafc) !important; background: none !important; -webkit-text-fill-color: var(--text-main, #f8fafc) !important; }
    h1 i, h2 i, h3 i, .icon { -webkit-text-fill-color: var(--brand-accent, #c0962d) !important; color: var(--brand-accent, #c0962d) !important; }
    .apple-sub, p, label, .form-label, .text-muted { color: var(--text-muted, #94a3b8) !important; }
    input, select, textarea, .dropdown, .input-field { 
        background: var(--bg-card-hover, #334155) !important;

        border: 1px solid var(--border-color, #475569) !important;

    .back-link, .btn-secondary { color: var(--brand-accent, #c0962d) !important; background: rgba(192, 150, 45, 0.1) !important; }
    .btn-primary { background: #0071e3 !important; color: #ffffff !important; border: none !important; }
    .btn-primary:hover { background: #005bb5 !important; }
    .btn-primary:disabled { background: #334155 !important; color: #94a3b8 !important; }

    /* Fix loading overlay blinding white & position (changed to 100% to avoid mobile scroll issues) */
    .loading-overlay { background: rgba(15, 23, 42, 0.95) !important; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; z-index: 99999 !important; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .loading-overlay p, #loadingText { color: var(--text-main, #f8fafc) !important; }
    .spinner { border-color: #334155 !important; border-top-color: #0071e3 !important; }

    div[style*="background: #ecfdf5"] p strong { color: #10b981 !important; }

    div[style*="background: #f8fafc"] { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; border-left-color: var(--brand-accent, #c0962d) !important; }

    /* Fix tailwind buttons & text in Add/Delete/Favicon pages */
    button.bg-slate-100, button.bg-white, .btn-outline { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; border-color: var(--border-color, #475569) !important; }
    button.bg-slate-100.selected { border-color: var(--brand-accent, #c0962d) !important; }
    .bg-blue-50 { background: rgba(0, 113, 227, 0.1) !important; color: #60a5fa !important; border: 1px solid rgba(0, 113, 227, 0.2) !important; }
    .shutter-btn { border-color: #334155 !important; background: #cbd5e1 !important; }
    .bg-slate-50, .hover\:bg-slate-50:hover, .hover\:bg-slate-50:active, .dark\:bg-slate-800, .dark\:bg-slate-900 { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; }
    .text-slate-500, .text-slate-400, .hover\:text-slate-700, .dark\:text-slate-400, .text-slate-700, .dark\:text-slate-50 { color: var(--text-main, #f8fafc) !important; }
    #summaryText, #summaryText * { color: var(--text-main, #f8fafc) !important; }
    a[download] { color: var(--text-main, #f8fafc) !important; }
    label[for="insert-upload"]:hover, label[for="insert-upload"]:active, label[for="insert-upload"]:focus { background: var(--bg-card-hover, #334155) !important; }

    /* Fix translate pdf container */
    #contentHolder, #contentHolder * { color: var(--text-main, #f8fafc) !important; background: var(--bg-card-hover, #334155) !important; border-color: var(--border-color, #334155) !important; }
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'all');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="file"></i> Crop PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="crop"></i>
        <h2>Select PDF file</h2>
        <p>or drag and drop a PDF here</p>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div id="cropArea" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1.5rem; padding: 2rem; margin-top: 2rem; text-align: center;">
        <div style="margin-bottom: 1.5rem;">
            <p><strong>Step 1:</strong> Drag to select the area you want to keep. The outside will be trimmed.</p>
            <div style="margin-top: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 1rem;">
                <button id="prevPage" class="nav-btn"><i data-lucide="chevron-left"></i></button>
                <span id="pageInfo" style="font-weight: 600; color: var(--primary);">Page 1 of 1</span>
                <button id="nextPage" class="nav-btn"><i data-lucide="chevron-right"></i></button>
            </div>
            <div style="position: relative; display: inline-block; border: 1px solid #e2e8f0; margin-top: 1rem; box-shadow: var(--shadow); background: #f8fafc;">
                <canvas id="pdfCanvas"></canvas>
                <div id="cropOverlay" style="position: absolute; top:0; left:0; width:100%; height:100%; cursor: crosshair;"></div>
                <div id="selectionBox" style="position: absolute; border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); display: none; pointer-events: none;">
                    <div style="position: absolute; top: 0; left: 0; padding: 2px 6px; background: #3b82f6; color: #fff; font-size: 10px; font-weight: 700; border-bottom-right-radius: 4px;">CROP AREA</div>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button id="resetCropBtn" class="btn-secondary">Reset Selection</button>
            <button id="applyCropBtn" class="btn-primary" disabled>
                <i data-lucide="crop"></i> Apply Crop to All Pages
            </button>
        </div>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your document has been precisely cropped.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download Cropped PDF
        </button>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Processing Crop...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInput = document.getElementById('fileInput');
    const cropArea = document.getElementById('cropArea');
    const pdfCanvas = document.getElementById('pdfCanvas');
    const cropOverlay = document.getElementById('cropOverlay');
    const selectionBox = document.getElementById('selectionBox');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const applyCropBtn = document.getElementById('applyCropBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    
    // Pagination Elements
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const pageInfo = document.getElementById('pageInfo');

    let selectedFile = null;
    let processedPdfUrl = null;
    let isSelecting = false;
    let startX, startY;
    let rect = { x: 0, y: 0, w: 0, h: 0 };
    let pdfPageSize = { width: 0, height: 0 };
    
    let currentPdf = null;
    let currentPageNum = 1;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

    async function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        loadingOverlay.style.display = 'flex';
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            
            try {
                currentPdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            } catch (e) {
                if (e.name === 'PasswordException') {
                    const password = prompt(`The file "${file.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    currentPdf = await pdfjsLib.getDocument({ data: arrayBuffer, password }).promise;
                } else {
                    throw e;
                }
            }

            currentPageNum = 1;
            await renderPage(1);
            
            dropZone.style.display = 'none';
            cropArea.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error loading PDF');
        } finally {
            loadingOverlay.style.display = 'none';
        }
    }

    async function renderPage(num) {
        if (!currentPdf) return;
        loadingOverlay.style.display = 'flex';
        try {
            const page = await currentPdf.getPage(num);
            const viewport = page.getViewport({ scale: 1.0 });
            // Dynamic scale for mobile
            const containerW = Math.min(window.innerWidth * 0.9, 600);
            const scale = Math.min(containerW / viewport.width, 800 / viewport.height);
            const scaledViewport = page.getViewport({ scale });
            
            pdfCanvas.width = scaledViewport.width;
            pdfCanvas.height = scaledViewport.height;
            pdfPageSize = { width: scaledViewport.width, height: scaledViewport.height };

            await page.render({
                canvasContext: pdfCanvas.getContext('2d'),
                viewport: scaledViewport
            }).promise;

            pageInfo.textContent = `Page ${num} of ${currentPdf.numPages}`;
            currentPageNum = num;
            
            // Keep selection box visible if it exists
            if (rect.w !== 0 || rect.h !== 0) {
                selectionBox.style.display = 'block';
            }
        } catch (err) {
            console.error(err);
        } finally {
            loadingOverlay.style.display = 'none';
        }
    }

    prevPageBtn.onclick = () => {
        if (currentPageNum > 1) renderPage(currentPageNum - 1);
    };

    nextPageBtn.onclick = () => {
        if (currentPageNum < currentPdf.numPages) renderPage(currentPageNum + 1);
    };

    function getCoords(e) {
        if (e.touches && e.touches[0]) {
            const rect = cropOverlay.getBoundingClientRect();
            return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        }
        return { x: e.offsetX, y: e.offsetY };
    }

    function startSelection(e) {
        isSelecting = true;
        const coords = getCoords(e);
        startX = coords.x;
        startY = coords.y;
        selectionBox.style.display = 'block';
        selectionBox.style.left = startX + 'px';
        selectionBox.style.top = startY + 'px';
        selectionBox.style.width = '0px';
        selectionBox.style.height = '0px';
        if (e.type === 'touchstart') e.preventDefault();
    }

    function moveSelection(e) {
        if (!isSelecting) return;
        const coords = getCoords(e);
        rect.w = coords.x - startX;
        rect.h = coords.y - startY;
        rect.x = rect.w < 0 ? coords.x : startX;
        rect.y = rect.h < 0 ? coords.y : startY;

        selectionBox.style.width = Math.abs(rect.w) + 'px';
        selectionBox.style.height = Math.abs(rect.h) + 'px';
        selectionBox.style.left = rect.x + 'px';
        selectionBox.style.top = rect.y + 'px';
        if (e.type === 'touchmove') e.preventDefault();
    }

    function endSelection() {
        isSelecting = false;
        if (Math.abs(rect.w) > 5 && Math.abs(rect.h) > 5) {
            applyCropBtn.disabled = false;
        }
    }

    cropOverlay.onmousedown = startSelection;
    cropOverlay.onmousemove = moveSelection;
    cropOverlay.onmouseup = endSelection;

    cropOverlay.addEventListener('touchstart', startSelection, { passive: false });
    cropOverlay.addEventListener('touchmove', moveSelection, { passive: false });
    cropOverlay.addEventListener('touchend', endSelection);

    resetCropBtn.onclick = () => {
        selectionBox.style.display = 'none';
        applyCropBtn.disabled = true;
        rect = { x: 0, y: 0, w: 0, h: 0 };
    };

    applyCropBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        applyCropBtn.disabled = true;

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdfDoc;

            try {
                pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            } catch (e) {
                if (e.message.includes('encrypted')) {
                    const password = prompt(`The file "${selectedFile.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { password });
                } else {
                    throw e;
                }
            }

            const { width, height } = pdfDoc.getPages()[0].getSize();

            const scaleX = width / pdfPageSize.width;
            const scaleY = height / pdfPageSize.height;

            const pdfX = rect.x * scaleX;
            const pdfY = height - (rect.y * scaleY) - (Math.abs(rect.h) * scaleY);
            const pdfWidth = Math.abs(rect.w) * scaleX;
            const pdfHeight = Math.abs(rect.h) * scaleY;

            pdfDoc.getPages().forEach(page => {
                page.setCropBox(pdfX, pdfY, pdfWidth, pdfHeight);
            });

            const pdfBytes = await pdfDoc.save();
            processedPdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));

            cropArea.style.display = 'none';
            resultArea.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error cropping PDF');
            applyCropBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = processedPdfUrl;
        link.download = `cropped_${selectedFile.name}`;
        link.click();
    };
</script>
