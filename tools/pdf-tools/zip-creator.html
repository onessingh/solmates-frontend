<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="file"></i> Zip Converter</h1>
    </div>
    



<div class="container">
    

    <div id="uploadArea" class="upload-card">
        <i data-lucide="archive"></i>
        <h2>Click or Drag Files</h2>
        <p>Supported: PDF, Images, DOCX, XLSX, TXT, etc.</p>
        <input type="file" id="fileInput" multiple hidden>
    </div>

    <div id="fileListContainer" style="display:none; margin-bottom: 30px;">
        <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Selected Files:</h3>
        <div id="fileItems"></div>
        <button id="createZipBtn" class="btn-primary" style="margin-top: 20px; width:100%;">
            <i data-lucide="package"></i> Create ZIP Archive
        </button>
    </div>

    <div id="resultArea" class="result-area">
        <h3 style="margin-bottom: 10px;"><i data-lucide="check-circle" style="color:#34c759; vertical-align: middle;"></i> Archive Ready</h3>
        <p style="margin-bottom: 25px; color:#666;">All your files have been bundled into a compressed ZIP archive.</p>
        <button id="downloadBtn" class="btn-primary btn-black" style="width:100%; max-width: 320px; margin: 0 auto; display: flex;">
            <i data-lucide="download"></i> Download ZIP
        </button>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loadingText">Bundling files...</p>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const fileListContainer = document.getElementById('fileListContainer');
    const fileItems = document.getElementById('fileItems');
    const createZipBtn = document.getElementById('createZipBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let selectedFiles = [];
    let finalBlob = null;

    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = (e) => addFiles(e.target.files);

    uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; };
    uploadArea.ondragleave = () => { uploadArea.style.borderColor = 'var(--border)'; };
    uploadArea.ondrop = (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); };

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function addFiles(files) {
        selectedFiles = [...selectedFiles, ...Array.from(files)];
        renderFileList();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    function renderFileList() {
        if (selectedFiles.length === 0) {
            fileListContainer.style.display = 'none';
            return;
        }
        fileListContainer.style.display = 'block';
        resultArea.style.display = 'none';
        
        fileItems.innerHTML = selectedFiles.map((f, i) => `
            <div class="file-item">
                <div class="file-info">
                    <i data-lucide="file" style="width:16px; color:#666;"></i>
                    <span class="file-name">${f.name}</span>
                    <span class="file-size">(${formatBytes(f.size)})</span>
                </div>
                <div class="remove-file" onclick="removeFile(${i})">
                    <i data-lucide="x" style="width:18px;"></i>
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    createZipBtn.onclick = async () => {
        if (selectedFiles.length === 0) return;
        
        loadingOverlay.style.display = 'flex';
        try {
            const zip = new JSZip();
            selectedFiles.forEach(file => {
                zip.file(file.name, file);
            });
            
            finalBlob = await zip.generateAsync({type: "blob", compression: "DEFLATE"});
            
            loadingOverlay.style.display = 'none';
            resultArea.style.display = 'block';
            resultArea.scrollIntoView({ behavior: 'smooth' });
        } catch (err) {
            loadingOverlay.style.display = 'none';
            alert('Error creating ZIP: ' + err.message);
        }
    };

    downloadBtn.onclick = () => {
        if (finalBlob) {
            const filename = `solmates_archive_${Date.now()}.zip`;
            if (typeof window.triggerDownload === 'function') {
                window.triggerDownload(finalBlob, filename);
            } else {
                const url = URL.createObjectURL(finalBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
            }
        }
    };

    lucide.createIcons();
</script>
