<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="scan"></i> Scan to PDF</h1>
    </div>

<div class="container" style="max-width: 600px;">
    
    <div id="cameraArea">
        <div id="cameraView">
            <video id="video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            <canvas id="captureCanvas" style="display: none;"></canvas>
            <div id="cameraPlaceholder" style="position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #1e293b; color: #fff; z-index: 10;">
                <i data-lucide="camera" style="width: 48px; height: 48px;"></i>
                <p id="camMessage" style="margin-top: 1rem; text-align: center; padding: 0 1rem;">Starting Camera...</p>
                <button id="retryCamBtn" class="btn-modern btn-primary" style="display: none; margin-top: 1rem; padding: 10px 20px; font-size: 0.9rem;" onclick="startCamera()">
                    <i data-lucide="refresh-cw"></i> Allow Camera Access
                </button>
            </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
            <div class="shutter-btn" id="shutter"></div>
            <p id="counter" style="color: var(--primary); font-weight: 700; font-size: 1.1rem; background: rgba(15, 43, 70, 0.05); padding: 5px 15px; border-radius: 20px; display: none;">0 pages captured</p>
            
            <div id="actionButtons" style="display: none; gap: 1rem; width: 100%; max-width: 400px; flex-direction: column;">
                <button id="finishBtn" class="btn-modern btn-green" style="width: 100%;">
                    <i data-lucide="check-circle"></i> Finish & Generate PDF
                </button>
            </div>
        </div>
    </div>

    <div id="previewArea" style="display: none; text-align: center; margin-top: 1rem;">
        <h3 style="color: var(--primary); margin-bottom: 1rem;">Review Captured Page</h3>
        <div style="background: var(--bg-card); padding: 10px; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-block;">
            <img id="capturedImage" style="max-width: 100%; max-height: 400px; border-radius: 0.5rem;">
        </div>
        
        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
            <button id="retakeBtn" class="btn-modern btn-outline" style="flex: 1;">
                <i data-lucide="rotate-ccw"></i> Retake
            </button>
            <button id="keepBtn" class="btn-modern btn-primary" style="flex: 1;">
                <i data-lucide="plus"></i> Keep & Add More
            </button>
        </div>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center; display: none;">
        <div style="background: #ecfdf5; color: #065f46; padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border: 1px solid #a7f3d0;">
            <i data-lucide="check-circle" style="width: 48px; height: 48px; margin-bottom: 1rem;"></i>
            <p style="font-size: 1.1rem;"><strong>Success!</strong><br>Your multi-page scan has been converted to a PDF.</p>
        </div>
        <button id="downloadBtn" class="btn-modern btn-primary" style="width: 100%; margin-bottom: 1rem; padding: 16px;">
            <i data-lucide="download"></i> Download PDF (<span id="finalCount">0</span> Pages)
        </button>
        <button onclick="location.reload()" class="btn-modern btn-outline" style="width: 100%;">
            <i data-lucide="refresh-ccw"></i> Start New Scan
        </button>
    </div>
    
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Processing Pages...</p>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    lucide.createIcons();
    const video = document.getElementById('video');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const shutter = document.getElementById('shutter');
    const captureCanvas = document.getElementById('captureCanvas');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const camMessage = document.getElementById('camMessage');
    const retryCamBtn = document.getElementById('retryCamBtn');
    
    const cameraArea = document.getElementById('cameraArea');
    const previewArea = document.getElementById('previewArea');
    const capturedImage = document.getElementById('capturedImage');
    const keepBtn = document.getElementById('keepBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const finishBtn = document.getElementById('finishBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const counter = document.getElementById('counter');
    const actionButtons = document.getElementById('actionButtons');
    const finalCount = document.getElementById('finalCount');

    let stream = null;
    let capturedPages = [];
    let pdfBlob = null;

    async function startCamera() {
        if (stream) return;
        
        camMessage.textContent = "Starting Camera...";
        retryCamBtn.style.display = "none";
        
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                } 
            });
            video.srcObject = stream;
            cameraPlaceholder.style.display = 'none';
        } catch (err) {
            console.error(err);
            camMessage.textContent = "Camera access denied. Please allow permissions in your browser to use the scanner.";
            retryCamBtn.style.display = "inline-flex";
        }
    }

    // Attempt auto-start on load
    startCamera();

    shutter.onclick = () => {
        if (!stream) {
            alert("Camera is not active. Please allow camera permissions first.");
            return;
        }
        const ctx = captureCanvas.getContext('2d');
        captureCanvas.width = video.videoWidth;
        captureCanvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        capturedImage.src = captureCanvas.toDataURL('image/jpeg', 0.85);
        cameraArea.style.display = 'none';
        previewArea.style.display = 'block';
    };

    retakeBtn.onclick = () => {
        previewArea.style.display = 'none';
        cameraArea.style.display = 'block';
    };

    keepBtn.onclick = () => {
        capturedPages.push(capturedImage.src);
        counter.textContent = `${capturedPages.length} page(s) captured`;
        counter.style.display = 'block';
        actionButtons.style.display = 'flex';
        previewArea.style.display = 'none';
        cameraArea.style.display = 'block';
    };

    finishBtn.onclick = () => {
        if (capturedPages.length === 0) return;
        loadingOverlay.style.display = 'flex';
        
        const pdf = new jsPDF();
        capturedPages.forEach((data, index) => {
            if (index > 0) pdf.addPage();
            pdf.addImage(data, 'JPEG', 0, 0, 210, 297); // A4 Portrait
        });

        pdfBlob = pdf.output('blob');
        finalCount.textContent = capturedPages.length;
        
        setTimeout(() => {
            loadingOverlay.style.display = 'none';
            cameraArea.style.display = 'none';
            resultArea.style.display = 'block';
            if (stream) stream.getTracks().forEach(t => t.stop());
        }, 1500);
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = `solmates_scan_${Date.now()}.pdf`;
        link.click();
    };
</script>
