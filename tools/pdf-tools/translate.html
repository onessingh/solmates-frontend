<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="file"></i> Translate PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="languages"></i>
        <h2>Select PDF file</h2>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <select id="targetLang" style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); margin-right: 1rem; font-size: 1rem;">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="hi">Hindi</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ar">Arabic</option>
            <option value="bn">Bengali</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="zh-TW">Chinese (Traditional)</option>
            <option value="it">Italian</option>
            <option value="ko">Korean</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="tr">Turkish</option>
            <option value="ur">Urdu</option>
            <option value="vi">Vietnamese</option>
            <option value="sv">Swedish</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
            <option value="id">Indonesian</option>
            <option value="en">English</option>
        </select>
        <button id="transBtn" class="btn-primary" disabled>
            <i data-lucide="play"></i> Translate PDF
        </button>
    </div>

    <div id="translationFlow" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-top: 2rem;">
        <div style="background: #f8fafc; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; border-left: 4px solid var(--primary);">
            <p style="font-size: 0.95rem; line-height: 1.6;">?? <strong>Pro Tip:</strong> Once the text appears below, use your browser's built-in <strong>"Translate to English/Hindi/etc."</strong> feature (usually Right-Click -> Translate) to translate the entire page. Then click "Save as Translated PDF".</p>
        </div>

        <div id="contentHolder" style="min-height: 300px; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 2rem; background: var(--bg-card); color: #1e293b; line-height: 1.8; font-family: serif; white-space: pre-wrap;" contenteditable="true">
            <!-- PDF Text will be injected here -->
        </div>

        <div style="text-align: center;">
            <button id="downloadBtn" class="btn-primary">
                <i data-lucide="download"></i> Save as Translated PDF
            </button>
        </div>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Translating Document...</p>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    
    const dropZone = document.getElementById('dropZone');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const transBtn = document.getElementById('transBtn');
    const translationFlow = document.getElementById('translationFlow');
    const contentHolder = document.getElementById('contentHolder');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
    
    function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        fileName.textContent = file.name;
        transBtn.disabled = false;
    }

    transBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        transBtn.disabled = true;
        const target = document.getElementById('targetLang').value;

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdf;
            
            try {
                pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            } catch (e) {
                if (e.name === 'PasswordException') {
                    const password = prompt(`The file "${selectedFile.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdf = await pdfjsLib.getDocument({ data: arrayBuffer, password }).promise;
                } else {
                    throw e;
                }
            }

            let fullText = "";
            const pagesToProcess = Math.min(pdf.numPages, 10);

            for (let i = 1; i <= pagesToProcess; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const text = content.items.map(it => it.str).join(" ");
                
                // Segment into chunks for API
                const chunks = text.match(/.{1,1000}/g) || [];
                for (const chunk of chunks) {
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(chunk)}`);
                        const data = await res.json();
                        fullText += data[0].map(x => x[0]).join("") + " ";
                    } catch (apiErr) {
                        fullText += chunk; // Fallback to original
                    }
                }
                fullText += "\n\n--- Page Break ---\n\n";
            }

            contentHolder.textContent = fullText;
            translationFlow.style.display = 'block';
            dropZone.style.display = 'none';
            const th = document.querySelector('.header-bar');
            if(th) th.style.display = 'none';
            transBtn.parentNode.style.display = 'none';
            
            transBtn.innerHTML = '<i data-lucide="check"></i> Translated';
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error processing PDF for translation.');
            transBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = async () => {
        downloadBtn.disabled = true;
        downloadBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Generating PDF...';
        lucide.createIcons();

        const opt = {
            margin: 0.75,
            filename: `translated_${selectedFile.name}`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        try {
            await html2pdf().from(contentHolder).set(opt).save();
            downloadBtn.innerHTML = '<i data-lucide="download"></i> Save as Translated PDF';
            downloadBtn.disabled = false;
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert('Error generating PDF');
            downloadBtn.disabled = false;
        }
    };
</script>

<style>

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
