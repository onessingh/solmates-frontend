<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

    <div class="header-bar">
        <h1><i data-lucide="file"></i> Organize PDF</h1>

<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="layout-list"></i>
        <h2>Select PDF file</h2>
        <p>or drag and drop a PDF here</p>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div id="organizeArea" style="display: none; background: #f1f5f9; border-radius: 1.5rem; padding: 2rem; margin-top: 2rem;">
        <div id="pagesGrid" style="display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; margin-bottom: 2rem;"></div>
        <div style="text-align: center;">
            <button id="saveBtn" class="btn-primary">
                <i data-lucide="save"></i> Save Organized PDF
            </button>
        </div>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your PDF has been reorganized.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download PDF
        </button>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Loading Document Pages...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const organizeArea = document.getElementById('organizeArea');
    const pagesGrid = document.getElementById('pagesGrid');
    const saveBtn = document.getElementById('saveBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let selectedFile = null;
    let pageData = []; 
    let processedPdfUrl = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

    async function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        loadingOverlay.style.display = 'flex';
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            let pdf;
            
            try {
                pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            } catch (e) {
                if (e.name === 'PasswordException') {
                    const password = prompt(`The file "${file.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdf = await pdfjsLib.getDocument({ data: arrayBuffer, password }).promise;
                } else {
                    throw e;
                }
            }

            pageData = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({ canvasContext: context, viewport }).promise;
                pageData.push({
                    originalIndex: i - 1,
                    thumbnail: canvas.toDataURL()
                });
            }
            
            renderPages();
            dropZone.style.display = 'none';
            organizeArea.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error loading PDF');
        } finally {
            loadingOverlay.style.display = 'none';
        }
    }

    function renderPages() {
        pagesGrid.innerHTML = '';
        pageData.forEach((page, currentIdx) => {
            const card = document.createElement('div');
            card.className = 'page-card';
            card.draggable = true;
            card.dataset.index = currentIdx;
            
            card.innerHTML = `
                <img src="${page.thumbnail}" style="max-width: 90%; max-height: 70%; border: 1px solid var(--border-color); pointer-events: none;">
                <div style="position: absolute; bottom: 35px; font-size: 10px; font-weight: 700;">Page ${page.originalIndex + 1}</div>
                <button class="remove-btn" onclick="removePage(${currentIdx})" title="Remove Page">&times;</button>
                <div style="position: absolute; bottom: 0; left: 0; width: 100%; display: flex; gap: 1px; background: #eee; border-top: 1px solid var(--border); border-radius: 0 0 0.75rem 0.75rem; overflow: hidden;">
                    <button onclick="movePage(${currentIdx}, -1)" style="flex: 1; border: none; background: var(--bg-card); padding: 5px; cursor: pointer;" ${currentIdx === 0 ? 'disabled style="opacity:0.3"' : ''} title="Move Left">
                        <i data-lucide="chevron-left" style="width: 14px;"></i>
                    </button>
                    <button onclick="movePage(${currentIdx}, 1)" style="flex: 1; border: none; background: var(--bg-card); padding: 5px; cursor: pointer;" ${currentIdx === pageData.length - 1 ? 'disabled style="opacity:0.3"' : ''} title="Move Right">
                        <i data-lucide="chevron-right" style="width: 14px;"></i>
                    </button>
                </div>
            `;

            card.addEventListener('dragstart', (e) => {
                card.classList.add('dragging');
                e.dataTransfer.setData('text/plain', currentIdx);
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            
            pagesGrid.appendChild(card);
        });
        lucide.createIcons();
        setupDragAndDrop();
    }

    function removePage(index) {
        pageData.splice(index, 1);
        renderPages();
    }

    function movePage(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= pageData.length) return;
        const temp = pageData[index];
        pageData[index] = pageData[newIndex];
        pageData[newIndex] = temp;
        renderPages();
    }

    function setupDragAndDrop() {
        pagesGrid.ondragover = (e) => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            const afterElement = getDragAfterElement(pagesGrid, e.clientX, e.clientY);
            if (afterElement == null) {
                pagesGrid.appendChild(dragging);
            } else {
                pagesGrid.insertBefore(dragging, afterElement);
            }
        };

        pagesGrid.ondrop = (e) => {
            e.preventDefault();
            const cards = [...pagesGrid.querySelectorAll('.page-card')];
            const newPageData = cards.map(card => pageData[parseInt(card.dataset.index)]);
            pageData = newPageData;
            renderPages();
        };
    }

    function getDragAfterElement(container, x, y) {
        const draggableElements = [...container.querySelectorAll('.page-card:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = x - box.left - box.width / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Saving...';
        lucide.createIcons();

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            const sourceDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const newDoc = await PDFLib.PDFDocument.create();
            
            const indices = pageData.map(p => p.originalIndex);
            const copiedPages = await newDoc.copyPages(sourceDoc, indices);
            copiedPages.forEach(page => newDoc.addPage(page));

            const pdfBytes = await newDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            processedPdfUrl = URL.createObjectURL(blob);

            organizeArea.style.display = 'none';
            resultArea.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert('Error saving PDF');
            saveBtn.disabled = false;
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = processedPdfUrl;
        link.download = `organized_${selectedFile.name}`;
        link.click();
    };
</script>
