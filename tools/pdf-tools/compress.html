<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">

      --text-main: #f8fafc;

        background: var(--bg-card, #1e293b) !important;

    }
    #resultArea, #result-section, #workspace { background: var(--bg-card, #1e293b) !important; border-color: var(--border-color, #334155) !important; }
    
    .upload-card:hover { background: var(--bg-card-hover, #334155) !important; border-color: var(--brand-accent, #c0962d) !important; }
    .upload-card i, .upload-card h2 { color: var(--text-main, #f8fafc) !important; }
    h1, h2, h3, h4, .nav-logo { color: var(--text-main, #f8fafc) !important; background: none !important; -webkit-text-fill-color: var(--text-main, #f8fafc) !important; }
    h1 i, h2 i, h3 i, .icon { -webkit-text-fill-color: var(--brand-accent, #c0962d) !important; color: var(--brand-accent, #c0962d) !important; }
    .apple-sub, p, label, .form-label, .text-muted { color: var(--text-muted, #94a3b8) !important; }
    input, select, textarea, .dropdown, .input-field { 
        background: var(--bg-card-hover, #334155) !important; 
        color: var(--text-main, #f8fafc) !important; 
        border: 1px solid var(--border-color, #475569) !important;

    input::placeholder, textarea::placeholder { color: #94a3b8 !important; opacity: 1 !important; }
    .back-link, .btn-secondary { color: var(--brand-accent, #c0962d) !important; background: rgba(192, 150, 45, 0.1) !important; }
    .btn-primary { background: #0071e3 !important; color: #ffffff !important; border: none !important; }
    .btn-primary:hover { background: #005bb5 !important; }
    .btn-primary:disabled { background: #334155 !important; color: #94a3b8 !important; }

    /* Fix loading overlay blinding white & position (changed to 100% to avoid mobile scroll issues) */
    .loading-overlay { background: rgba(15, 23, 42, 0.95) !important; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; z-index: 99999 !important; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .loading-overlay p, #loadingText { color: var(--text-main, #f8fafc) !important; }
    .spinner { border-color: #334155 !important; border-top-color: #0071e3 !important; }

    /* Fix success message boxes */

    div[style*="background: #ecfdf5"] p strong { color: #10b981 !important; }
    div[style*="color: #065f46"] { color: #10b981 !important; }
    div[style*="background: #f8fafc"] { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; border-left-color: var(--brand-accent, #c0962d) !important; }

    /* Fix tailwind buttons & text in Add/Delete/Favicon pages */

    button.bg-slate-100.selected { border-color: var(--brand-accent, #c0962d) !important; }
    .bg-blue-50 { background: rgba(0, 113, 227, 0.1) !important; color: #60a5fa !important; border: 1px solid rgba(0, 113, 227, 0.2) !important; }
    .shutter-btn { border-color: #334155 !important; background: #cbd5e1 !important; }
    .bg-slate-50, .hover\:bg-slate-50:hover, .hover\:bg-slate-50:active, .dark\:bg-slate-800, .dark\:bg-slate-900 { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; }
    .text-slate-500, .text-slate-400, .hover\:text-slate-700, .dark\:text-slate-400, .text-slate-700, .dark\:text-slate-50 { color: var(--text-main, #f8fafc) !important; }

    a[download] { color: var(--text-main, #f8fafc) !important; }
    label[for="insert-upload"]:hover, label[for="insert-upload"]:active, label[for="insert-upload"]:focus { background: var(--bg-card-hover, #334155) !important; }

    /* Fix translate pdf container */
    #contentHolder, #contentHolder * { color: var(--text-main, #f8fafc) !important; background: var(--bg-card-hover, #334155) !important; border-color: var(--border-color, #334155) !important; }
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
</head>
<body>

    <div class="header-bar">
        <h1><i data-lucide="minimize"></i> Compress PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="minimize-2"></i>
        <h2>Select PDF or Image</h2>
        <p>or drag and drop files here (Supports PDF, JPG, PNG, HEIC)</p>
        <input type="file" id="fileInput" accept=".pdf,image/*,.heic" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div id="compressionSettings" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-top: 2rem;">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Compression Mode</label>
            <select id="compressionLevel" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                <option value="0.8">Recommended (High Fidelity)</option>
                <option value="0.95">Low (Crystal Clear / Best Quality)</option>
                <option value="0.5">Extreme (Maximum Compression)</option>
            </select>
        </div>
        <button id="compressBtn" class="btn-primary" style="width: 100%;">
            <i data-lucide="play"></i> Optimize & Compress
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your PDF has been optimized using high-fidelity downsampling.</p>
            <p id="sizeInfo" style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.8;"></p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download Compressed PDF
        </button>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Optimizing Document...</p>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const compressionSettings = document.getElementById('compressionSettings');
    const compressBtn = document.getElementById('compressBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const sizeInfo = document.getElementById('sizeInfo');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let selectedFile = null;
    let processedPdfUrl = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

    function handleFile(file) {
        selectedFile = file;
        fileName.textContent = file.name;
        dropZone.style.display = 'none';
        compressionSettings.style.display = 'block';
    }

    compressBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        compressBtn.disabled = true;

        try {
            const quality = parseFloat(document.getElementById('compressionLevel').value);
            const isPDF = selectedFile.type === 'application/pdf';
            const isHEIC = selectedFile.name.toLowerCase().endsWith('.heic') || selectedFile.type.includes('heic');
            
            let finalBlob;

            if (isPDF) {
                // PDF Compression via Rasterization (High Fidelity)
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const { jsPDF } = window.jspdf;
                const outPdf = new jsPDF({ unit: 'px', compress: true });
                outPdf.deletePage(1);

                for (let i = 1; i <= pdf.numPages; i++) {
                    document.getElementById('loadingText').textContent = `Optimizing Page ${i}/${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    // Use a high baseline scale (2.0) to avoid blur, then compress the jpeg stream
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    
                    const compressedData = canvas.toDataURL('image/jpeg', quality);
                    outPdf.addPage([viewport.width, viewport.height], viewport.width > viewport.height ? 'l' : 'p');
                    outPdf.addImage(compressedData, 'JPEG', 0, 0, viewport.width, viewport.height, undefined, 'FAST');
                }
                finalBlob = outPdf.output('blob');
            } else {
                // Image/HEIC Compression
                let imgFile = selectedFile;
                if (isHEIC) {
                    document.getElementById('loadingText').textContent = "Decoding HEIC Document...";
                    const converted = await heic2any({ blob: imgFile, toType: "image/jpeg", quality: 0.8 });
                    imgFile = Array.isArray(converted) ? converted[0] : converted;
                }

                document.getElementById('loadingText').textContent = "Compressing Visuals...";
                const img = new Image();
                img.src = URL.createObjectURL(imgFile);
                await new Promise((res) => img.onload = res);

                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                
                finalBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
            }
            
            processedPdfUrl = URL.createObjectURL(finalBlob);
            const oldSize = (selectedFile.size / 1024 / 1024).toFixed(2);
            const newSize = (finalBlob.size / 1024 / 1024).toFixed(2);
            sizeInfo.textContent = `Optimized from ${oldSize}MB to ${newSize}MB`;

            compressionSettings.style.display = 'none';
            resultArea.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert('Error: ' + err.message);
            compressBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = processedPdfUrl;
        const isPDF = selectedFile.type === 'application/pdf';
        const ext = isPDF ? '.pdf' : '.jpg';
        const base = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;
        link.download = `compressed_${base}${ext}`;
        link.click();
    };
</script>

    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

</body>
