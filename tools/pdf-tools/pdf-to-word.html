// OS-based theme-color for TWA status bar
(function(){
  var m=document.getElementById('theme-color-meta');
  if(!m){m=document.createElement('meta');m.name='theme-color';m.id='theme-color-meta';document.head.appendChild(m);}
  function setOsColor(){m.setAttribute('content',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#0f172a':'#ffffff');}
  setOsColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setOsColor);
})();

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<div class="container">

        </button>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">

<script>
document.addEventListener('DOMContentLoaded', () => {
    console.log("PDF to Word initialized");
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    
    // Check for docx global
    const docxLib = window.docx || docx;
    if (!docxLib) {
        console.error("docx.js library not loaded properly");
        return;
    }
    const { Document, Packer, Paragraph, TextRun } = docxLib;
    
    const dropZone = document.getElementById('dropZone');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;
    let docxBlob = null;

    dropZone.onclick = () => {
        console.log("Dropzone clicked");
        fileInput.click();
    };
    
    fileInput.onchange = (e) => { 
        if (e.target.files[0]) handleFile(e.target.files[0]); 
    };
    
    function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        fileName.textContent = file.name;
        convertBtn.disabled = false;
        console.log("File selected:", file.name);
    }

    convertBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        convertBtn.disabled = true;

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdf;
            
            try {
                pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            } catch (e) {
                if (e.name === 'PasswordException') {
                    const password = prompt(`The file "${selectedFile.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdf = await pdfjsLib.getDocument({ data: arrayBuffer, password }).promise;
                } else {
                    throw e;
                }
            }

            const sections = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageChildren = [];

                // Group by Y coordinate
                const lines = {};
                textContent.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if (!lines[y]) lines[y] = [];
                    lines[y].push(item);
                });

                const sortedY = Object.keys(lines).sort((a, b) => b - a);
                
                sortedY.forEach(y => {
                    const sortedX = lines[y].sort((a, b) => a.transform[4] - b.transform[4]);
                    const runs = [];
                    
                    sortedX.forEach(it => {
                        const fontSize = Math.round(it.transform[0]);
                        const isBold = it.fontName && (it.fontName.toLowerCase().includes('bold') || it.fontName.toLowerCase().includes('g_d0_f2'));
                        const isItalic = it.fontName && (it.fontName.toLowerCase().includes('italic') || it.fontName.toLowerCase().includes('oblique'));
                        
                        runs.push(new TextRun({
                            text: it.str + " ",
                            size: fontSize * 2,
                            bold: isBold,
                            italics: isItalic
                        }));
                    });

                    if (runs.length > 0) {
                        pageChildren.push(new Paragraph({
                            children: runs,
                            spacing: { after: 120 }
                        }));
                    }
                });

                sections.push({
                    properties: { type: docx.SectionType.NEXT_PAGE },
                    children: pageChildren
                });
            }

            const doc = new Document({ sections });
            docxBlob = await Packer.toBlob(doc);
            
            resultArea.style.display = 'block';
            convertBtn.innerHTML = '<i data-lucide="check"></i> Done!';
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error converting document');
            convertBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(docxBlob);
        link.download = `${selectedFile.name.replace(/\.pdf$/i, '')}.docx`;
        link.click();
    };
});
</script>
