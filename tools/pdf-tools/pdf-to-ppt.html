<script>
// OS-based theme-color for TWA status bar
(function(){
  var m=document.getElementById('theme-color-meta');
  if(!m){m=document.createElement('meta');m.name='theme-color';m.id='theme-color-meta';document.head.appendChild(m);}
  function setOsColor(){m.setAttribute('content',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#0f172a':'#ffffff');}
  setOsColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setOsColor);
})();
</script>

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="monitor"></i> PDF to PowerPoint</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="presentation"></i>
        <h2>Select PDF file</h2>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <button id="convertBtn" class="btn-primary" disabled>
            <i data-lucide="play"></i> Convert to PPTX
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Real PowerPoint slides have been generated.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download PowerPoint (.pptx)
        </button>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Generating Slides...</p>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    lucide.createIcons();
    
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;
    let pptxData = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
    
    function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        fileName.textContent = file.name;
        convertBtn.disabled = false;
    }

    convertBtn.onclick = async () => {
        convertBtn.disabled = true;
        convertBtn.innerHTML = '<i data-lucide="loader" class="spin"></i> Generating .pptx...';
        lucide.createIcons();

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdf;
            try {
                pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            } catch (e) {
                if (e.name === 'PasswordException') {
                    const password = prompt(`The file "${selectedFile.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdf = await pdfjsLib.getDocument({ data: arrayBuffer, password }).promise;
                } else {
                    throw e;
                }
            }
            
            let pres = new PptxGenJS();

            for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                // Group text by Y coordinate for structural slide layout
                const rows = {};
                textContent.items.forEach(item => {
                    const y = Math.round(item.transform[5]);
                    if (!rows[y]) rows[y] = [];
                    rows[y].push({ x: item.transform[4], str: item.str });
                });

                const sortedY = Object.keys(rows).sort((a, b) => b - a);
                let slide = pres.addSlide();
                
                // Header Background
                slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '100%', h: 1.0, fill: { color: 'F8FAFC' } });
                slide.addText(`Slide ${i}`, { x: 0.5, y: 0.3, fontSize: 24, color: "0F2B46", bold: true });

                let currentY = 1.2;
                sortedY.forEach(y => {
                    const lineText = rows[y].sort((a, b) => a.x - b.x).map(item => item.str).join(" ");
                    if (lineText.trim() && currentY < 5.0) {
                        slide.addText(lineText, { x: 0.5, y: currentY, fontSize: 13, color: "334155", w: '90%' });
                        currentY += 0.4;
                    }
                });
            }

            const buffer = await pres.write({ outputType: 'arraybuffer' });
            pptxData = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
            
            resultArea.style.display = 'block';
            convertBtn.innerHTML = '<i data-lucide="check"></i> Done!';
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert('Error generating slides');
            convertBtn.disabled = false;
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pptxData);
        link.download = `${selectedFile.name.replace(/\.pdf$/i, '')}.pptx`;
        link.click();
    };
</script>
