<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="file"></i> HTML to PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="inputArea">
        <i data-lucide="code-2"></i>
        <h2>Paste HTML Content</h2>
        <textarea id="htmlInput" placeholder="<html><body><h1>Hello World</h1></body></html>" style="width: 100%; height: 200px; padding: 1rem; border-radius: 1rem; border: 1px solid var(--border); margin-top: 1rem; font-family: monospace;"></textarea>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <button id="convertBtn" class="btn-primary">
            <i data-lucide="play"></i> Convert HTML to PDF
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your PDF is ready for download.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download PDF
        </button>
    </div>
    
    <div id="hiddenPreview" style="display: none;"></div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Generating PDF...</p>
    </div>
</div>

<script>
    lucide.createIcons();
    const convertBtn = document.getElementById('convertBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const htmlInput = document.getElementById('htmlInput');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const preview = document.getElementById('hiddenPreview');

    let pdfBlob = null;

    convertBtn.onclick = async () => {
        const content = htmlInput.value;
        if (!content) { alert('Please paste some HTML content'); return; }

        loadingOverlay.style.display = 'flex';
        convertBtn.disabled = true;

        try {
            preview.innerHTML = content;
            preview.style.display = 'block'; // Make visible for html2canvas to render
            
            const opt = {
                margin: 1,
                filename: 'converted.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // Generate PDF safely by getting the jsPDF instance
            html2pdf().set(opt).from(preview).toPdf().get('pdf').then(function(pdfInstance) {
                pdfBlob = pdfInstance.output('blob');
                preview.style.display = 'none'; // Hide again
                
                resultArea.style.display = 'block';
                convertBtn.innerHTML = '<i data-lucide="check"></i> Done!';
                convertBtn.disabled = false;
                lucide.createIcons();
                loadingOverlay.style.display = 'none';
            }).catch(function(err) {
                console.error(err);
                alert('Error converting HTML');
                convertBtn.disabled = false;
                loadingOverlay.style.display = 'none';
            });
        } catch (err) {
            console.error(err);
            alert('Error converting HTML');
            convertBtn.disabled = false;
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = `html_converted.pdf`;
        link.click();
    };
</script>
