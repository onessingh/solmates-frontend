<style>

<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">
    :root {
      --bg-body: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-lighter: #cbd5e1;
      --bg-nav: rgba(15, 23, 42, 0.98);
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border-color: #334155;
      --hero-bg: linear-gradient(to bottom, #0f172a, #1e293b);
      --brand-primary: #f8fafc;
      --brand-accent: #c0962d;
      --bg-light: var(--bg-card-hover, #334155);
    }

    body { background: var(--bg-body, #0f172a) !important; color: var(--text-main, #f8fafc) !important; }
    .top-nav, .header-bar, header { background: var(--bg-nav, rgba(15,23,42,0.95)) !important; border-bottom: 1px solid var(--border-color, #334155) !important; }
    .card, .form-card, .result-box, .result-area, .white-box, .container, .main-content, .card-body, .feature-item, .info-box, .upload-area, .upload-card, .tool-card { 
        background: var(--bg-card, #1e293b) !important; 
        border: 1px solid var(--border-color, #334155) !important; 
    }
    #resultArea, #result-section, #workspace { background: var(--bg-card, #1e293b) !important; border-color: var(--border-color, #334155) !important; }
    
    .upload-card:hover { background: var(--bg-card-hover, #334155) !important; border-color: var(--brand-accent, #c0962d) !important; }
    .upload-card i, .upload-card h2 { color: var(--text-main, #f8fafc) !important; }
    h1, h2, h3, h4, .nav-logo { color: var(--text-main, #f8fafc) !important; background: none !important; -webkit-text-fill-color: var(--text-main, #f8fafc) !important; }
    h1 i, h2 i, h3 i, .icon { -webkit-text-fill-color: var(--brand-accent, #c0962d) !important; color: var(--brand-accent, #c0962d) !important; }
    .apple-sub, p, label, .form-label, .text-muted { color: var(--text-muted, #94a3b8) !important; }
    input, select, textarea, .dropdown, .input-field { 
        background: var(--bg-card-hover, #334155) !important; 
        color: var(--text-main, #f8fafc) !important; 
        border: 1px solid var(--border-color, #475569) !important; 
    }
    input::placeholder, textarea::placeholder { color: #94a3b8 !important; opacity: 1 !important; }
    .back-link, .btn-secondary { color: var(--brand-accent, #c0962d) !important; background: rgba(192, 150, 45, 0.1) !important; }
    .btn-primary { background: #0071e3 !important; color: #ffffff !important; border: none !important; }
    .btn-primary:hover { background: #005bb5 !important; }
    .btn-primary:disabled { background: #334155 !important; color: #94a3b8 !important; }

    /* Fix loading overlay blinding white & position (changed to 100% to avoid mobile scroll issues) */
    .loading-overlay { background: rgba(15, 23, 42, 0.95) !important; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100% !important; height: 100% !important; z-index: 99999 !important; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .loading-overlay p, #loadingText { color: var(--text-main, #f8fafc) !important; }
    .spinner { border-color: #334155 !important; border-top-color: #0071e3 !important; }

    /* Fix success message boxes */
    .result-area > div[style*="background: #ecfdf5"], div[style*="background: #ecfdf5"] { background: rgba(16, 185, 129, 0.1) !important; color: #10b981 !important; border: 1px solid rgba(16, 185, 129, 0.2) !important; }
    div[style*="background: #ecfdf5"] p strong { color: #10b981 !important; }
    div[style*="color: #065f46"] { color: #10b981 !important; }
    div[style*="background: #f8fafc"] { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; border-left-color: var(--brand-accent, #c0962d) !important; }

    /* Fix tailwind buttons & text in Add/Delete/Favicon pages */
    button.bg-slate-100, button.bg-white, .btn-outline { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; border-color: var(--border-color, #475569) !important; }
    button.bg-slate-100.selected { border-color: var(--brand-accent, #c0962d) !important; }
    .bg-blue-50 { background: rgba(0, 113, 227, 0.1) !important; color: #60a5fa !important; border: 1px solid rgba(0, 113, 227, 0.2) !important; }
    .shutter-btn { border-color: #334155 !important; background: #cbd5e1 !important; }
    .bg-slate-50, .hover\:bg-slate-50:hover, .hover\:bg-slate-50:active, .dark\:bg-slate-800, .dark\:bg-slate-900 { background: var(--bg-card-hover, #334155) !important; color: var(--text-main, #f8fafc) !important; }
    .text-slate-500, .text-slate-400, .hover\:text-slate-700, .dark\:text-slate-400, .text-slate-700, .dark\:text-slate-50 { color: var(--text-main, #f8fafc) !important; }
    #summaryText, #summaryText * { color: var(--text-main, #f8fafc) !important; }
    a[download] { color: var(--text-main, #f8fafc) !important; }
    label[for="insert-upload"]:hover, label[for="insert-upload"]:active, label[for="insert-upload"]:focus { background: var(--bg-card-hover, #334155) !important; }

    /* Fix translate pdf container */
    #contentHolder, #contentHolder * { color: var(--text-main, #f8fafc) !important; background: var(--bg-card-hover, #334155) !important; border-color: var(--border-color, #334155) !important; }
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'all');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>
</head>
<body>

    <div class="header-bar">
        <h1><i data-lucide="droplet"></i> Watermark PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="stamp"></i>
        <h2>Select PDF file</h2>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div id="watermarkSettings" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-top: 2rem;">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Watermark Type</label>
            <select id="watermarkType" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); margin-bottom: 1rem;">
                <option value="text">Text Watermark</option>
                <option value="image">Image Watermark</option>
            </select>
        </div>

        <div id="textOptions">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Watermark Text</label>
                <input type="text" id="watermarkText" value="SOLMATES" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
            </div>
            <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Font Size</label>
                    <input type="number" id="fontSize" value="50" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Opacity (0.1 - 1.0)</label>
                    <input type="number" id="opacity" value="0.3" step="0.1" min="0.1" max="1" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                </div>
            </div>
        </div>

        <div id="imageOptions" style="display: none;">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Select Watermark Image (JPG, PNG, HEIC)</label>
                <input type="file" id="imageInput" accept="image/*,.heic" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border);">
            </div>
        </div>

        <button id="applyBtn" class="btn-primary" style="width: 100%;">
            <i data-lucide="play"></i> Add Watermark
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Watermark applied successfully.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download Watermarked PDF
        </button>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Applying Watermark...</p>
    </div>
</div>

<script>
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const watermarkSettings = document.getElementById('watermarkSettings');
    const watermarkType = document.getElementById('watermarkType');
    const textOptions = document.getElementById('textOptions');
    const imageOptions = document.getElementById('imageOptions');
    const imageInput = document.getElementById('imageInput');
    const applyBtn = document.getElementById('applyBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedFile = null;
    let processedPdfUrl = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
    
    watermarkType.onchange = () => {
        textOptions.style.display = watermarkType.value === 'text' ? 'block' : 'none';
        imageOptions.style.display = watermarkType.value === 'image' ? 'block' : 'none';
    };

    function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        fileName.textContent = file.name;
        dropZone.style.display = 'none';
        watermarkSettings.style.display = 'block';
    }

    applyBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        applyBtn.disabled = true;
        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
            const pages = pdfDoc.getPages();

            if (watermarkType.value === 'text') {
                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                const text = document.getElementById('watermarkText').value;
                const size = parseInt(document.getElementById('fontSize').value);
                const op = parseFloat(document.getElementById('opacity').value);
                pages.forEach(page => {
                    const { width, height } = page.getSize();
                    page.drawText(text, {
                        x: width / 2 - (text.length * size / 4), y: height / 2,
                        size, font, color: PDFLib.rgb(0.5, 0.5, 0.5), opacity: op, rotate: PDFLib.degrees(45)
                    });
                });
            } else {
                let imgFile = imageInput.files[0];
                if (!imgFile) throw new Error('Please select an image');
                
                if (imgFile.name.toLowerCase().endsWith('.heic') || imgFile.type.includes('heic')) {
                    document.getElementById('loadingText').textContent = "Decoding HEIC image...";
                    const converted = await heic2any({ blob: imgFile, toType: "image/jpeg", quality: 0.8 });
                    imgFile = Array.isArray(converted) ? converted[0] : converted;
                }

                const imgBytes = await imgFile.arrayBuffer();
                const image = imgFile.type === 'image/png' ? await pdfDoc.embedPng(imgBytes) : await pdfDoc.embedJpg(imgBytes);
                const dims = image.scale(0.5);
                pages.forEach(page => {
                    const { width, height } = page.getSize();
                    page.drawImage(image, { x: width/2 - dims.width/2, y: height/2 - dims.height/2, width: dims.width, height: dims.height, opacity: 0.3 });
                });
            }
            const pdfBytes = await pdfDoc.save();
            processedPdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
            watermarkSettings.style.display = 'none'; resultArea.style.display = 'block';
        } catch (err) {
            console.error(err); alert('Error: ' + err.message);
            applyBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
            document.getElementById('loadingText').textContent = "Applying Watermark...";
        }
    };

    downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = processedPdfUrl; a.download = `watermarked_${selectedFile.name}`; a.click();
    };
</script>

<style>
    .spin { animation: rotate 2s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    


    /* Dark Mode Native OS Integration */
    
    </style>

</body>
