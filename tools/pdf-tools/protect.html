<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="lock"></i> Protect PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="lock"></i>
        <h2>Select PDF file</h2>
        <p>or drag and drop a PDF here</p>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div id="protectArea" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-top: 2rem; text-align: center;">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Set Password</label>
            <input type="password" id="password" placeholder="Enter strong password" style="width: 100%; max-width: 400px; padding: 1rem; border-radius: 1rem; border: 1px solid var(--border);">
        </div>
        <div style="margin-bottom: 1.5rem; color: #64748b; font-size: 0.875rem;">
            <i data-lucide="shield-check" style="width:14px;height:14px;vertical-align:middle;"></i>
            &nbsp;RC4-128 bit - PDF Standard Security - Zero uploads
        </div>
        <button id="protectBtn" class="btn-primary">
            <i data-lucide="lock-keyhole"></i> Encrypt PDF
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your PDF is now password protected. Any PDF viewer will ask for your password.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download Protected PDF
        </button>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p style="color: var(--primary); font-weight: 600;">Encrypting PDF...</p>
    </div>
</div>

<script type="module">
import { encryptPDF } from 'https://esm.sh/@pdfsmaller/pdf-encrypt-lite';

lucide.createIcons();


const dropZone    = document.getElementById('dropZone');
const fileInput   = document.getElementById('fileInput');
const fileName    = document.getElementById('fileName');
const protectArea = document.getElementById('protectArea');
const protectBtn  = document.getElementById('protectBtn');
const resultArea  = document.getElementById('resultArea');
const downloadBtn = document.getElementById('downloadBtn');
const loadingOverlay = document.getElementById('loadingOverlay');

let selectedFile   = null;
let protectedBytes = null;

dropZone.onclick    = () => fileInput.click();
dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor='var(--primary)'; };
dropZone.ondragleave = () => { dropZone.style.borderColor=''; };
dropZone.ondrop = (e) => {
    e.preventDefault(); dropZone.style.borderColor='';
    const f = e.dataTransfer.files[0];
    if (f && f.type==='application/pdf') handleFile(f);
};
fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

function handleFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    dropZone.style.display = 'none';
    protectArea.style.display = 'block';
}

protectBtn.onclick = async () => {
    const pass = document.getElementById('password').value;
    if (!pass) { alert('Please enter a password'); return; }
    loadingOverlay.style.display = 'flex';
    protectBtn.disabled = true;
    try {
        const buf = await selectedFile.arrayBuffer();
        
        // PRE-PROCESS with pdf-lib to ensure clean structure (Fixes "Cannot display PDF" error)
        const pdfDoc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
        const cleanBuf = await pdfDoc.save();
        const data = new Uint8Array(cleanBuf);
        
        // Use the imported encryptPDF function from @pdfsmaller/pdf-encrypt-lite
        protectedBytes = await encryptPDF(data, pass);

        protectArea.style.display = 'none';
        resultArea.style.display  = 'block';
    } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        protectBtn.disabled = false;
    } finally {
        loadingOverlay.style.display = 'none';
    }
};

downloadBtn.onclick = () => {
    const blob = new Blob([protectedBytes], { type: 'application/pdf' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'protected_' + selectedFile.name;
    a.click();
};
</script>
