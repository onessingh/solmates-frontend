<script>
// OS-based theme-color for TWA status bar
(function(){
  var m=document.getElementById('theme-color-meta');
  if(!m){m=document.createElement('meta');m.name='theme-color';m.id='theme-color-meta';document.head.appendChild(m);}
  function setOsColor(){m.setAttribute('content',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#0f172a':'#ffffff');}
  setOsColor();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setOsColor);
})();
</script>

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

    <div class="header-bar">
        <h1><i data-lucide="file-text"></i> Word to PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="file-up"></i>
        <h2>Select Word file (.docx)</h2>
        <input type="file" id="fileInput" accept=".docx" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <button id="convertBtn" class="btn-primary" disabled>
            <i data-lucide="play"></i> Convert to PDF
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your Word document has been converted to a high-quality PDF.</p>
        </div>
        <button id="downloadBtn" class="btn-primary">
            <i data-lucide="download"></i> Download PDF
        </button>
    </div>

    <!-- Hidden preview for conversion -->
    <div id="wordPreview" style="display: none; padding: 40px; background: var(--bg-card); color: black; font-family: serif;"></div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Converting to PDF...</p>
    </div>
</div>

<script>
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const convertBtn = document.getElementById('convertBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const wordPreview = document.getElementById('wordPreview');

    let selectedFile = null;
    let pdfBlob = null;

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
    
    function handleFile(file) {
        selectedFile = file;
        fileName.textContent = file.name;
        convertBtn.disabled = false;
    }

    convertBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        convertBtn.disabled = true;

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
            wordPreview.innerHTML = result.value;
            wordPreview.style.display = 'block';

            const opt = {
                margin: 0.5,
                filename: selectedFile.name.replace(/\.docx$/i, '.pdf'),
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'], avoid: 'p, h1, h2, h3, h4, h5, h6, tr, td, li, img' }
            };

            pdfBlob = await new Promise((resolve, reject) => {
                html2pdf().set(opt).from(wordPreview).toPdf().get('pdf').then(pdf => {
                    resolve(pdf.output('blob'));
                }).catch(reject);
            });
            
            wordPreview.style.display = 'none';
            resultArea.style.display = 'block';
            convertBtn.innerHTML = '<i data-lucide="check"></i> Done!';
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert('Error converting document. Ensure it is a valid .docx file.');
            convertBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdfBlob);
        link.download = selectedFile.name.replace(/\.docx$/i, '.pdf');
        link.click();
    };
</script>
