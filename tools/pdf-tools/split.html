<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'all');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

    <div class="header-bar">
        <h1><i data-lucide="scissors"></i> Split PDF</h1>
    </div>
    



<div class="container">
    

    <div class="upload-card" id="dropZone">
        <i data-lucide="scissors"></i>
        <h2>Select PDF file</h2>
        <p>or drag and drop a PDF here</p>
        <input type="file" id="fileInput" accept=".pdf" hidden>
        <p id="fileName" style="margin-top: 1rem; font-weight: 600;"></p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <button id="splitBtn" class="btn-primary" disabled>
            <i data-lucide="play"></i> Split PDF
        </button>
    </div>

    <div class="result-area" id="resultArea" style="text-align: center;">
        <div style="background: #ecfdf5; color: #065f46; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem;">
            <p><strong>Success!</strong> Your PDF has been split into individual pages.</p>
        </div>
        <div id="downloadLinks"></div>
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingText" style="color: var(--primary); font-weight: 600;">Splitting Document...</p>
    </div>
</div>

<script>
    lucide.createIcons();
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const splitBtn = document.getElementById('splitBtn');
    const resultArea = document.getElementById('resultArea');
    const downloadLinks = document.getElementById('downloadLinks');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let selectedFile = null;

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
    };

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary)'; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = 'var(--border)'; };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border)';
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    };

    function handleFile(file) {
        if (file.type !== 'application/pdf') return;
        selectedFile = file;
        fileName.textContent = file.name;
        splitBtn.disabled = false;
    }

    splitBtn.onclick = async () => {
        loadingOverlay.style.display = 'flex';
        splitBtn.disabled = true;

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            let pdf;
            
            try {
                pdf = await PDFLib.PDFDocument.load(arrayBuffer);
            } catch (e) {
                if (e.message.includes('encrypted')) {
                    const password = prompt(`The file "${selectedFile.name}" is password protected. Password:`);
                    if (password === null) throw new Error('User cancelled password entry');
                    pdf = await PDFLib.PDFDocument.load(arrayBuffer, { password });
                } else {
                    throw e;
                }
            }

            const pageCount = pdf.getPageCount();
            downloadLinks.innerHTML = '';

            for (let i = 0; i < pageCount; i++) {
                const newPdf = await PDFLib.PDFDocument.create();
                const [copiedPage] = await newPdf.copyPages(pdf, [i]);
                newPdf.addPage(copiedPage);
                const bytes = await newPdf.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const btn = document.createElement('button');
                btn.className = 'btn-primary';
                btn.style.margin = '0.5rem';
                btn.innerHTML = `<i data-lucide="download"></i> Page ${i + 1}`;
                btn.onclick = () => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `page_${i + 1}.pdf`;
                    link.click();
                };
                downloadLinks.appendChild(btn);
            }

            resultArea.style.display = 'block';
            splitBtn.innerHTML = '<i data-lucide="check"></i> Done!';
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert(err.message || 'Error splitting PDF');
            splitBtn.disabled = false;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    };
</script>
