<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      const applyDark = savedTheme === 'dark'; // Always default to light if no theme is saved
      
      if (applyDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
      } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
      }
      
      // Still need to toggle solmates-dark-style for non-Tailwind elements
      window.addEventListener('DOMContentLoaded', () => {
          const darkStyle = document.getElementById('solmates-dark-style');
          if (darkStyle) {
              if (applyDark) {
                  darkStyle.media = 'all'; 
                  darkStyle.disabled = false;
              } else {
                  darkStyle.media = 'not all'; 
                  darkStyle.disabled = true;
              }
          }
      });
      
      // Also apply immediately if the element is already parsed
      const darkStyleImm = document.getElementById('solmates-dark-style');
      if (darkStyleImm) {
          if (applyDark) {
              darkStyleImm.media = 'all'; 
              darkStyleImm.disabled = false;
          } else {
              darkStyleImm.media = 'not all'; 
              darkStyleImm.disabled = true;
          }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();

        <div id="workspace" class="hidden">

                    </button>

                        Clear
                    </button>
                    <button id="btn-delete" class="px-6 py-2 text-sm font-medium text-white bg-red-600 rounded-lg shadow-sm hover:bg-red-700 transition-colors flex-1 md:flex-none text-center flex items-center justify-center gap-2" disabled>

            <p class="text-slate-500 dark:text-slate-400 mb-6">The selected pages have been removed.</p>

            </a>
            <button onclick="location.reload()" class="block mx-auto mt-4 text-sm text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:text-slate-50">Start Over</button>
        </div>

    <script>
        lucide.createIcons();

        const uploadSection = document.getElementById('upload-section');
        const workspace = document.getElementById('workspace');
        const fileInput = document.getElementById('pdf-upload');
        const pagesGrid = document.getElementById('pages-grid');
        const selectionCount = document.getElementById('selection-count');
        const btnSelectAll = document.getElementById('btn-select-all');
        const btnClear = document.getElementById('btn-clear');
        const btnDelete = document.getElementById('btn-delete');

        let currentFile = null;
        let pdfDoc = null;
        let totalPages = 0;
        let selectedPages = new Set();

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadSection.addEventListener(eventName, () => uploadSection.classList.add('border-red-500', 'bg-red-50'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, () => uploadSection.classList.remove('border-red-500', 'bg-red-50'), false);
        });

        uploadSection.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file && file.type === 'application/pdf') {
                processFile(file);
            } else {
                alert('Please upload a valid PDF file.');
            }
        }, false);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        async function processFile(file) {
            currentFile = file;
            uploadSection.classList.add('hidden');
            workspace.classList.remove('hidden');
            pagesGrid.innerHTML = '<div class="col-span-full text-center py-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-red-600"></div><p class="mt-2 text-slate-500 dark:text-slate-400">Loading document...</p></div>';

            const arrayBuffer = await file.arrayBuffer();

            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;

            renderPages();
        }

        async function renderPages() {
            pagesGrid.innerHTML = '';
            selectedPages.clear();
            updateUI();

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 0.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                const wrapper = document.createElement('div');
                wrapper.className = 'page-item relative bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg cursor-pointer transition-all overflow-hidden group select-none';
                wrapper.dataset.page = i;

                const img = document.createElement('img');
                img.src = canvas.toDataURL();
                img.className = 'w-full h-auto border border-slate-100 shadow-sm';

                const pageNum = document.createElement('div');
                pageNum.className = 'text-center mt-2 text-sm font-medium text-slate-600 dark:text-slate-300';
                pageNum.textContent = `Page ${i}`;

                const overlay = document.createElement('div');
                overlay.className = 'overlay absolute inset-0 bg-red-600/20 hidden items-center justify-center';
                overlay.innerHTML = '<div class="bg-red-600 text-white rounded-full p-2"><i data-lucide="trash-2" class="w-6 h-6"></i></div>';

                wrapper.appendChild(img);
                wrapper.appendChild(pageNum);
                wrapper.appendChild(overlay);

                wrapper.addEventListener('click', () => toggleSelection(wrapper, i));

                pagesGrid.appendChild(wrapper);
            }
            lucide.createIcons();
        }

        function toggleSelection(element, pageNum) {
            if (selectedPages.has(pageNum)) {
                selectedPages.delete(pageNum);
                element.classList.remove('selected');
            } else {
                selectedPages.add(pageNum);
                element.classList.add('selected');
            }
            updateUI();
        }

        function updateUI() {
            selectionCount.textContent = selectedPages.size;
            if (selectedPages.size > 0) {
                btnDelete.disabled = false;
                btnDelete.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnDelete.disabled = true;
                btnDelete.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        btnSelectAll.addEventListener('click', () => {
            const items = document.querySelectorAll('.page-item');
            items.forEach(item => {
                const pageNum = parseInt(item.dataset.page);
                selectedPages.add(pageNum);
                item.classList.add('selected');
            });
            updateUI();
        });

        btnClear.addEventListener('click', () => {
            const items = document.querySelectorAll('.page-item');
            items.forEach(item => {
                const pageNum = parseInt(item.dataset.page);
                selectedPages.delete(pageNum);
                item.classList.remove('selected');
            });
            updateUI();
        });

        const btnDownload = document.getElementById('btn-download');
        const resultSection = document.getElementById('result-section');

        btnDelete.addEventListener('click', async () => {
            if (selectedPages.size === 0) return;
            if (selectedPages.size === totalPages) {
                alert("You cannot delete all pages.");
                return;
            }

            btnDelete.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...';
            btnDelete.disabled = true;
            lucide.createIcons();

            try {
                const newArrayBuffer = await currentFile.arrayBuffer();
                const pdfLibDoc = await PDFLib.PDFDocument.load(newArrayBuffer);
                
                // Pages to keep (0-indexed)
                const pagesToKeep = [];
                for (let i = 1; i <= totalPages; i++) {
                    if (!selectedPages.has(i)) {
                        pagesToKeep.push(i - 1);
                    }
                }

                const newPdfDoc = await PDFLib.PDFDocument.create();
                const copiedPages = await newPdfDoc.copyPages(pdfLibDoc, pagesToKeep);
                copiedPages.forEach((page) => newPdfDoc.addPage(page));

                const pdfBytes = await newPdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                btnDownload.href = url;
                btnDownload.download = `edited_${fileInput.files[0]?.name || 'document.pdf'}`;
                
                workspace.classList.add('hidden');
                resultSection.classList.remove('hidden');
                
            } catch (err) {
                console.error(err);
                alert("Error modifying PDF.");
                btnDelete.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i> Apply Changes';
                btnDelete.disabled = false;
                lucide.createIcons();
            }
        });

    </script>
