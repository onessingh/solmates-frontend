<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Prep AI - Solmates</title>
  <script src="/config.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/exam-context.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global-lockdown.css">
  <style>
    :root {
      --bg-body: #f5f5f7;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --bg-nav: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f0f0f5;
      --border-color: #e5e5ea;
      --brand-primary: #0f2b46;
      --brand-accent: #0071e3;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; }
    
    /* Top Navigation (Reused from main site) */
    .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--bg-nav); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .brand { font-size: 1.2rem; font-weight: 700; color: var(--brand-primary); text-decoration: none; letter-spacing: 1px; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .nav-links a:hover { color: var(--brand-primary); }
    .btn-back { background: var(--brand-primary); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; text-decoration: none; }
    
    /* Main Content */
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-size: 2.2rem; color: var(--brand-primary); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .hero p { font-size: 1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 20px; }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 60px; display: flex; flex-direction: column; gap: 30px; }
    
    /* Categories Grid */
    .categories-section h2 { font-size: 1.2rem; color: var(--brand-primary); margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .category-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; color: var(--text-main); font-weight: 600; font-size: 0.95rem; }
    .category-card:hover, .category-card.active { border-color: var(--brand-accent); background: #eef2ff; color: var(--brand-accent); }
    .category-card i { display: block; font-size: 1.5rem; margin-bottom: 8px; color: var(--text-muted); }
    .category-card:hover i, .category-card.active i { color: var(--brand-accent); }

    /* Exams Grid */
    .exams-section { display: none; }
    .exams-section h2 { font-size: 1.5rem; color: var(--brand-primary); margin-bottom: 20px; }
    .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    
    .exam-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 25px; border-radius: 16px; text-decoration: none; color: inherit; transition: all 0.3s ease; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
    .exam-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: var(--brand-accent); }
    .exam-card h3 { color: var(--brand-primary); margin: 0 0 10px 0; font-size: 1.25rem; }
    .exam-card p { color: var(--text-muted); font-size: 0.9rem; flex-grow: 1; line-height: 1.5; margin: 0 0 15px 0; }
    .exam-card .cta { font-size: 0.85rem; font-weight: 600; color: var(--brand-accent); display: flex; align-items: center; gap: 5px; }
    
    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; grid-column: 1 / -1; }
    
    @media (min-width: 768px) {
      .container { flex-direction: row; align-items: flex-start; }
      .categories-section { flex: 0 0 250px; position: sticky; top: 80px; }
      .category-grid { grid-template-columns: 1fr; gap: 10px; }
      .category-card { text-align: left; display: flex; align-items: center; gap: 15px; padding: 12px 15px; }
      .category-card i { margin-bottom: 0; font-size: 1.2rem; }
      .exams-section { flex: 1; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="brand">SOLMATES</a>
    <div class="nav-links">
      <a href="/tools#academic">Tools</a>
    </div>
    <a href="/tools" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
  </nav>

  <div class="hero">
    <h1><i class="fas fa-graduation-cap"></i> Exam Prep AI</h1>
    <p>Select your target category to explore tailored AI tools, study materials, and mock generators.</p>
  </div>
  
  <div class="container">
    <div class="categories-section">
      <h2>Categories</h2>
      <div class="category-grid" id="category-grid">
        <!-- Categories will be rendered here -->
      </div>
    </div>
    
    <div class="exams-section" id="exams-section">
      <h2 id="selected-category-title">Select a Category</h2>
      <div id="exams-container" class="exam-grid">
        <!-- Exams will be rendered here -->
      </div>
    </div>
  </div>

  <script>
    let allExams = [];
    
    const categories = [
        { id: 'government', name: 'Government / Civil Services', icon: 'fa-landmark' },
        { id: 'ssc', name: 'SSC', icon: 'fa-users-cog' },
        { id: 'banking', name: 'Banking', icon: 'fa-piggy-bank' },
        { id: 'railways', name: 'Railways', icon: 'fa-train' },
        { id: 'defence', name: 'Defence', icon: 'fa-shield-alt' },
        { id: 'medical', name: 'Medical', icon: 'fa-stethoscope' },
        { id: 'engineering', name: 'Engineering', icon: 'fa-cogs' },
        { id: 'teaching', name: 'Teaching / Research', icon: 'fa-chalkboard-teacher' },
        { id: 'management', name: 'Management', icon: 'fa-briefcase' },
        { id: 'law', name: 'Law', icon: 'fa-balance-scale' },
        { id: 'university', name: 'University Entrance', icon: 'fa-university' }
    ];

    async function loadExams() {
      renderCategories();
      
      try {
        const res = await fetch('/api/exams');
        if (res.ok) {
            allExams = await res.json();
        } else {
            // Mock data fallback if backend is empty/down
            allExams = [
                { name: 'UGC NET', slug: 'ugc-net', category_id: 'teaching', short_description: 'University Grants Commission National Eligibility Test for Assistant Professor and JRF.' },
                { name: 'UPSC CSE', slug: 'upsc-cse', category_id: 'government', short_description: 'Civil Services Examination for IAS, IPS, IFS and other central services.' },
                { name: 'SSC CGL', slug: 'ssc-cgl', category_id: 'ssc', short_description: 'Staff Selection Commission Combined Graduate Level Examination.' },
                { name: 'CAT', slug: 'cat', category_id: 'management', short_description: 'Common Admission Test for IIMs and other top B-Schools.' },
                { name: 'NEET-UG', slug: 'neet-ug', category_id: 'medical', short_description: 'National Eligibility cum Entrance Test for undergraduate medical courses.' },
                { name: 'IBPS PO', slug: 'ibps-po', category_id: 'banking', short_description: 'Institute of Banking Personnel Selection Probationary Officer exam.' }
            ];
        }
        
        // Auto-select first category that has exams, or just default to teaching
        selectCategory('teaching', 'Teaching / Research');
      } catch (err) {
        console.error(err);
      }
    }

    function renderCategories() {
        const container = document.getElementById('category-grid');
        container.innerHTML = categories.map(cat => `
            <div class="category-card" id="cat-btn-${cat.id}" onclick="selectCategory('${cat.id}', '${cat.name}')">
                <i class="fas ${cat.icon}"></i>
                <span>${cat.name}</span>
            </div>
        `).join('');
    }

    function selectCategory(catId, catName) {
        // Update active styling
        document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
        const activeBtn = document.getElementById('cat-btn-' + catId);
        if(activeBtn) activeBtn.classList.add('active');
        
        // Show exams section
        document.getElementById('exams-section').style.display = 'block';
        document.getElementById('selected-category-title').innerText = catName + ' Exams';
        
        // Filter exams
        const filtered = allExams.filter(e => e.category_id === catId);
        
        const container = document.getElementById('exams-container');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">No exams found in this category yet.</div>';
            return;
        }
        
        container.innerHTML = filtered.map(exam => `
          <a href="overview.html?exam=${exam.slug}" class="exam-card">
            <h3>${exam.name}</h3>
            <p>${exam.short_description || 'Prepare with AI tailored specifically for this exam.'}</p>
            <div class="cta">Select Exam <i class="fas fa-arrow-right"></i></div>
          </a>
        `).join('');
    }

    window.onload = loadExams;
  </script>
</body>
</html>
