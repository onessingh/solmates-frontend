<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Prep AI - Solmates</title>
  <script src="/config.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/exam-context.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --primary: #0f172a; --accent: #3b82f6; --text: #334155; --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --card: #1e293b; --primary: #f8fafc; --accent: #60a5fa; --text: #cbd5e1; --border: #334155;
      }
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { color: var(--primary); margin-bottom: 10px; }
    .search-box { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; margin-bottom: 20px; box-sizing: border-box; }
    .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .exam-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
    .exam-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .exam-card h3 { color: var(--primary); margin: 0 0 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-graduation-cap"></i> Exam Prep AI</h1>
      <p>Prepare smarter for your exam with Solmates AI.</p>
    </div>
    
    <input type="text" id="search" class="search-box" placeholder="Search exams (e.g. UGC NET, UPSC...)">
    
    <div id="exams-container" class="exam-grid">
      <!-- Injected via JS -->
    </div>
  </div>

  <script>
    async function loadExams() {
      try {
        const res = await fetch('/api/exams');
        const exams = await res.json();
        const container = document.getElementById('exams-container');
        container.innerHTML = exams.map(exam => `
          <a href="overview.html?exam=${exam.slug}" class="exam-card">
            <h3>${exam.name}</h3>
            <span style="font-size: 0.8rem; color: var(--accent);"><i class="fas fa-arrow-right"></i> Explore</span>
          </a>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }
    window.onload = loadExams;
  </script>
</body>
</html>
