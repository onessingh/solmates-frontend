<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=111.9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest Inventory — SOLMATES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--bg-body) !important;
      color: var(--text-main) !important;
    }

    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 52px;
      background: var(--bg-nav);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .nav-logo {
      font-weight: 600;
      font-size: 1.25rem;
    }

    .back-link {
      text-decoration: none;
      color: #0071e3;
      font-weight: 500;
    }

    .page-content {
      padding: 92px 24px 48px;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .btn-primary {
      display: block;
      background: #0071e3;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .question-box {
      background: var(--bg-card-hover);
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .option {
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #0071e3;
    }

    .option.selected {
      background: rgba(0, 113, 227, 0.1);
      border-color: #0071e3;
      font-weight: bold;
    }

    .result-score {
      font-size: 3.5rem;
      font-weight: 700;
      color: #0071e3;
      text-align: center;
      letter-spacing: 5px;
    }

    .code-label {
      text-align: center;
      font-size: 1.2rem;
      color: var(--text-lighter);
      margin-bottom: 20px;
    }

    .trait-list {
      margin-top: 20px;
    }

    .trait-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    
  

    /* Dark Mode Native OS Integration */
    :root {
      --bg-body: #ffffff;
      --text-main: #111111;
      --text-muted: #555555;
      --text-lighter: #666666;
      --bg-nav: rgba(255, 255, 255, 0.98);
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9fb;
      --border-color: #eeeeee;
      --hero-bg: linear-gradient(to bottom, #ffffff, #f5f5f7);
      --brand-primary: #0f2b46;
      --brand-accent: #c0962d;
    }

    /* dark mode moved */
    
    input, select, textarea {
      background: var(--bg-card-hover) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0071e3 !important;
      box-shadow: 0 0 0 2px rgba(0,113,227,0.2);
    }

    </style>
  <script src="/js/sol-cache.js?v=91.0"></script>


<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">

      :root {
        --bg-body: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-lighter: #cbd5e1;
        --bg-nav: rgba(15, 23, 42, 0.98);
        --bg-card: #1e293b;
        --bg-card-hover: #334155;
        --border-color: #334155;
        --hero-bg: linear-gradient(to bottom, #0f172a, #1e293b);
        --brand-primary: #f8fafc;
        --brand-accent: #c0962d;
      }
      .top-nav { border-bottom: 1px solid var(--border-color) !important; }
    
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>
</head>

<body>

  <header class="top-nav" style="justify-content: center;">
    <span class="nav-logo" style="cursor: default;">Interest Inventory</span>
  </header>

  <div class="page-content">
    <div class="container">
      <div id="setupStep" class="card">
        <h1><i class="fas fa-heart"></i> Interest Inventory</h1>
        <p>Discover your Holland Code (RIASEC) to find careers that align with your true interests and passions.</p>
        <br>
        <button class="btn-primary" id="startBtn">Start Assessment</button>
      </div>

      <div id="loadingStep" class="card hidden" style="text-align: center; padding: 40px;">
        <h3 style="color: var(--text-main); font-size: 1.3rem; font-weight: 600;"><i class="fas fa-spinner fa-spin" style="margin-right:10px; color:#0071e3;"></i> Generating AI Assessment...</h3>
      </div>

      <div id="testStep" class="card hidden">
        <div id="progress" style="margin-bottom: 10px; color: var(--text-lighter); font-size: 0.9rem; text-align: right;"></div>
        <div class="question-box">
          <div class="question-text" id="qText"></div>
          <div id="optContainer"></div>
        </div>
        <button class="btn-primary" id="nextBtn">Next</button>
      </div>

      <div id="resultStep" class="card hidden">
        <h1 style="text-align: center;">Your Holland Code</h1>
        <div class="result-score" id="scoreDiv"></div>
        <div class="code-label">Top 3 Interest Areas</div>

        <div class="trait-list" id="traitList"></div>

        <br>
        <button class="btn-primary" onclick="location.reload()">Retake Assessment</button>
      </div>
    </div>
  </div>

  <script src="/config.js?v=118.0"></script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let sessionId, questions = [], answers = [], currentIdx = 0;

      const mappingNames = { 'R': 'Realistic (Doers)', 'I': 'Investigative (Thinkers)', 'A': 'Artistic (Creators)', 'S': 'Social (Helpers)', 'E': 'Enterprising (Persuaders)', 'C': 'Conventional (Organizers)' };

      document.getElementById('startBtn').onclick = async () => {
        document.getElementById('setupStep').classList.add('hidden');
        document.getElementById('loadingStep').classList.remove('hidden');
        try {
          const res = await window.solmatesAPI.generateAIToolData('interest-inventory');
          if (!res.success) throw new Error();
          questions = res.data.questions;
          sessionId = res.data.sessionId;
          answers = new Array(questions.length).fill(null);
          currentIdx = 0;
          document.getElementById('loadingStep').classList.add('hidden');
          document.getElementById('testStep').classList.remove('hidden');
          renderQ();
        } catch (e) {
          alert("Error generating API data"); location.reload();
        }
      };

      function renderQ() {
        if (currentIdx >= questions.length) { submitTest(); return; }
        document.getElementById('progress').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('qText').textContent = questions[currentIdx].text;
        const c = document.getElementById('optContainer'); c.innerHTML = '';
        questions[currentIdx].options.forEach((opt, idx) => {
          const d = document.createElement('div'); d.className = 'option';
          if (answers[currentIdx] === idx) d.classList.add('selected');
          d.textContent = opt;
          d.onclick = () => {
            c.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            d.classList.add('selected'); answers[currentIdx] = idx;
          };
          c.appendChild(d);
        });
        document.getElementById('nextBtn').textContent = currentIdx === questions.length - 1 ? 'Submit' : 'Next';
      }

      document.getElementById('nextBtn').onclick = () => {
        if (answers[currentIdx] === null) return alert("Select an answer");
        currentIdx++; renderQ();
      };

      async function submitTest() {
        document.getElementById('testStep').classList.add('hidden');
        document.getElementById('loadingStep').classList.remove('hidden');
        try {
          const res = await window.solmatesAPI.submitAIToolResult(sessionId, answers);

          document.getElementById('scoreDiv').textContent = res.hollandCode;

          const tList = document.getElementById('traitList');
          tList.innerHTML = '';

          const sortedTraits = Object.entries(res.counts).sort((a, b) => b[1] - a[1]);
          sortedTraits.forEach(([trait, score]) => {
            tList.innerHTML += `<div class="trait-item"><span><b>${trait}</b> - ${mappingNames[trait]}</span> <span>Score: ${score}</span></div>`;
          });

          document.getElementById('loadingStep').classList.add('hidden');
          document.getElementById('resultStep').classList.remove('hidden');
        } catch (e) { alert("Submission failed"); }
      }
    });
  </script>
</body>

</html>
