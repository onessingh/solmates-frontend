<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=111.9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Progress Tracker — SOLMATES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--bg-body) !important;
      color: var(--text-main) !important;
    }

    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 52px;
      background: var(--bg-nav);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .nav-logo {
      font-weight: 600;
      font-size: 1.25rem;
    }

    .back-link {
      text-decoration: none;
      color: #0071e3;
      font-weight: 500;
    }

    .page-content {
      padding: 92px 24px 48px;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .btn-primary {
      background: #0071e3;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    .progress-bar-container {
      background: #eee;
      border-radius: 10px;
      height: 25px;
      width: 100%;
      margin: 20px 0;
      overflow: hidden;
    }

    .progress-fill {
      background: #0071e3;
      height: 100%;
      transition: width 0.5s ease;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .dashboard-panel {
      background: var(--bg-card-hover);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      border-left: 5px solid #0071e3;
    }

    .quote-box {
      font-style: italic;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
      background: var(--bg-card-hover);
      border-radius: 10px;
      margin-top: 20px;
    }
    
  

    /* Dark Mode Native OS Integration */
    :root {
      --bg-body: #ffffff;
      --text-main: #111111;
      --text-muted: #555555;
      --text-lighter: #666666;
      --bg-nav: rgba(255, 255, 255, 0.98);
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9fb;
      --border-color: #eeeeee;
      --hero-bg: linear-gradient(to bottom, #ffffff, #f5f5f7);
      --brand-primary: #0f2b46;
      --brand-accent: #c0962d;
    }

    /* dark mode moved */
    
    input, select, textarea {
      background: var(--bg-card-hover) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0071e3 !important;
      box-shadow: 0 0 0 2px rgba(0,113,227,0.2);
    }

    </style>
  <script src="/js/sol-cache.js?v=91.0"></script>


<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">

      :root {
        --bg-body: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-lighter: #cbd5e1;
        --bg-nav: rgba(15, 23, 42, 0.98);
        --bg-card: #1e293b;
        --bg-card-hover: #334155;
        --border-color: #334155;
        --hero-bg: linear-gradient(to bottom, #0f172a, #1e293b);
        --brand-primary: #f8fafc;
        --brand-accent: #c0962d;
      }
      .top-nav { border-bottom: 1px solid var(--border-color) !important; }
    
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>
</head>

<body>

  <header class="top-nav" style="justify-content: center;">
    <span class="nav-logo" style="cursor: default;">Skill Progress Tracker</span>
  </header>

  <div class="page-content">
    <div class="container">
      <div id="setupStep" class="card">
        <h1><i class="fas fa-tasks"></i> Skill Tracker</h1>
        <p>Log your current skill level and get an AI-generated milestone framework to reach mastery.</p>

        <label>Skill Name</label>
        <input type="text" id="skillName" placeholder="e.g. Python, Public Speaking, SEO">

        <label>Current Proficiency (1-100)</label>
        <input type="number" id="currProf" min="1" max="100" placeholder="e.g. 40">

        <button class="btn-primary" id="startBtn">Generate Tracker</button>
      </div>

      <div id="loadingStep" class="card hidden" style="text-align: center;">
        <h3>Analyzing mastery roadmap...</h3>
      </div>

      <div id="resultStep" class="card hidden">
        <h1 style="text-align: center;" id="rTitle"></h1>

        <div class="progress-bar-container">
          <div class="progress-fill" id="pBar"></div>
        </div>

        <div class="dashboard-panel">
          <h3><i class="fas fa-flag-checkered"></i> Next Milestone</h3>
          <p id="nextMilestoneTxt" style="margin-top: 10px;"></p>
        </div>

        <div class="dashboard-panel">
          <h3><i class="fas fa-star"></i> Long Term Mastery Goal</h3>
          <p id="longTermTxt" style="margin-top: 10px;"></p>
        </div>

        <div class="dashboard-panel">
          <h3><i class="fas fa-clipboard-list"></i> Daily/Weekly Habits to Build</h3>
          <ul id="habitsList" style="margin-top: 10px; padding-left: 20px;"></ul>
        </div>

        <div class="quote-box" id="quoteTxt"></div>

        <button class="btn-primary" onclick="location.reload()">Track Another Skill</button>
      </div>
    </div>
  </div>

  <script src="/config.js?v=118.0"></script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('startBtn').onclick = async () => {
        const sName = document.getElementById('skillName').value;
        const sProf = document.getElementById('currProf').value;
        if (!sName || !sProf) return alert("Please fill all fields.");

        document.getElementById('setupStep').classList.add('hidden');
        document.getElementById('loadingStep').classList.remove('hidden');

        try {
          const res = await window.solmatesAPI.generateAIToolData('skill-tracker', {
            skill: sName,
            proficiency: parseInt(sProf)
          });
          if (!res.success) throw new Error();

          const { skill, currentLevel, nextMilestone, longTermGoal, habitsToBuild, motivationalQuote } = res.data;

          document.getElementById('rTitle').textContent = `${skill} Dashboard`;

          const pb = document.getElementById('pBar');
          pb.style.width = `${currentLevel}%`;
          pb.textContent = `${currentLevel}%`;

          document.getElementById('nextMilestoneTxt').textContent = nextMilestone;
          document.getElementById('longTermTxt').textContent = longTermGoal;
          document.getElementById('habitsList').innerHTML = habitsToBuild.map(h => `<li>${h}</li>`).join('');
          document.getElementById('quoteTxt').textContent = `"${motivationalQuote}"`;

          document.getElementById('loadingStep').classList.add('hidden');
          document.getElementById('resultStep').classList.remove('hidden');
        } catch (e) {
          alert("Error generating API data"); location.reload();
        }
      };
    });
  </script>
</body>

</html>
