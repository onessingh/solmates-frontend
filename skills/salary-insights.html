    .salary-box h4 {

    }

    .salary-box .amt {

    @media(max-width: 600px) {

    /* Dark Mode Native OS Integration */
    :root {
      --bg-body: #ffffff;
      --text-main: #111111;
      --text-muted: #555555;
      --text-lighter: #666666;
      --bg-nav: rgba(255, 255, 255, 0.98);

      --bg-card-hover: #f9f9fb;

      --brand-accent: #c0962d;
    }

    /* dark mode moved */
    
    input, select, textarea {
      background: var(--bg-card-hover) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0071e3 !important;
      box-shadow: 0 0 0 2px rgba(0,113,227,0.2);
    }

<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">

      :root {
        --bg-body: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;

        --brand-primary: #f8fafc;
        --brand-accent: #c0962d;
      }
      .top-nav { border-bottom: 1px solid var(--border-color) !important; }
    
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'all');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

  <header class="top-nav" style="justify-content: center;">
    <span class="nav-logo" style="cursor: default;">Salary Insights</span>
  </header>

  <div class="page-content">
    <div class="container">
      <div id="setupStep" class="card">
        <h1><i class="fas fa-dollar-sign"></i> Salary Insights</h1>
        <p>Get AI-powered real-time compensation estimates and market trends.</p>

        <label>Target Role / Job Title</label>
        <input type="text" id="targetRole" placeholder="e.g. Data Scientist, UX Designer">

        <label>Location</label>
        <input type="text" id="locationInp" placeholder="e.g. Remote, San Francisco, Bangalore">

        <button class="btn-primary" id="startBtn">Get Insights</button>
      </div>

      <div id="loadingStep" class="card hidden" style="text-align: center;">
        <h3>Fetching Market Data via AI...</h3>
      </div>

      <div id="resultStep" class="card hidden">
        <h1 style="text-align: center; margin-bottom: 5px;" id="resRole"></h1>
        <p style="text-align: center; color: var(--text-lighter); margin-bottom: 25px;"><i class="fas fa-map-marker-alt"></i> <span
            id="resLoc"></span></p>

        <h3>Salary Estimates</h3>
        <div class="salary-grid">
          <div class="salary-box">
            <h4>Entry Level</h4>
            <div class="amt" id="sEntry"></div>
          </div>
          <div class="salary-box">
            <h4>Mid Level</h4>
            <div class="amt" id="sMid"></div>
          </div>
          <div class="salary-box">
            <h4>Senior Level</h4>
            <div class="amt" id="sSenior"></div>
          </div>
        </div>

        <h3>Top Paying Industries</h3>
        <ul class="info-list" id="industriesList"></ul>

        <h3>Skills That Boost Pay</h3>
        <ul class="info-list" id="skillsList"></ul>

        <div class="market-trend">
          <b><i class="fas fa-chart-line"></i> Market Trend:</b> <br>
          <span id="marketTrendTxt"></span>
        </div>

        <button class="btn-primary" onclick="location.reload()">Check Another Role</button>
      </div>
    </div>
  </div>

  <script src="/config.js?v=118.0"></script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('startBtn').onclick = async () => {
        const role = document.getElementById('targetRole').value;
        const loc = document.getElementById('locationInp').value;

        if (!role) return alert("Please enter a role");

        document.getElementById('setupStep').classList.add('hidden');
        document.getElementById('loadingStep').classList.remove('hidden');

        try {
          const res = await window.solmatesAPI.generateAIToolData('salary-insights', { role: role, location: loc });
          if (!res.success) throw new Error();

          const { role: rName, location, salaryRanges, topPayingIndustries, skillsThatBoostPay, marketTrend } = res.data;

          document.getElementById('resRole').textContent = rName;
          document.getElementById('resLoc').textContent = location;

          document.getElementById('sEntry').textContent = salaryRanges.entryLevel;
          document.getElementById('sMid').textContent = salaryRanges.midLevel;
          document.getElementById('sSenior').textContent = salaryRanges.seniorLevel;

          document.getElementById('industriesList').innerHTML = topPayingIndustries.map(i => `<li>${i}</li>`).join('');
          document.getElementById('skillsList').innerHTML = skillsThatBoostPay.map(s => `<li>${s}</li>`).join('');
          document.getElementById('marketTrendTxt').textContent = marketTrend;

          document.getElementById('loadingStep').classList.add('hidden');
          document.getElementById('resultStep').classList.remove('hidden');
        } catch (e) {
          alert("Error generating API data"); location.reload();
        }
      };
    });
  </script>
</body>
