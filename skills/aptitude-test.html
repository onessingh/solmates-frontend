    * {

    select {

    .btn-primary {

      border-radius: 40px;
      font-weight: 600;
      width: 100%;

    .question-box {
      background: var(--bg-card-hover);
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 1.2rem;

    }

    .option {
      padding: 16px;
      background: var(--bg-card);

      cursor: pointer;
    }

    .option.selected {

      border-color: #0071e3;
    }

    .result-score {
      font-size: 4rem;
      font-weight: 700;
      color: #0071e3;
      text-align: center;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-content {
      background: var(--bg-card);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-lighter);
    }

    .explanation-text {
      line-height: 1.6;
      font-size: 1rem;
      color: var(--text-main);
    }

    .explanation-text b {
      color: #0071e3;
    }

    .btn-why {
      background: var(--bg-card-hover);
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #0071e3;
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-why:hover {
      background: #e0e0e0;
    }

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            if (themeMeta) themeMeta.setAttribute('content', '#0f172a');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>

  <header class="top-nav" style="justify-content: center;">
    <span class="nav-logo" style="cursor: default;">Aptitude Test</span>
  </header>

  <div class="page-content">
    <div class="container">
      <div id="setupStep" class="card">
        <h1><i class="fas fa-brain"></i> Aptitude Test</h1>
        <p>Evaluate logical, numerical, and verbal reasoning dynamically with <b>Mate AI</b>.</p>

        <div class="input-grp">
          <label>Test Mode</label>
          <select id="testMode" onchange="toggleTestModeInputs()">
            <option value="random" selected>Random Test</option>
            <option value="exam">Exam Test</option>
            <option value="subject">Subject Test</option>
            <option value="topic">Topic Test</option>
          </select>
        </div>

        <div id="examContextGroup" style="display: none; background: var(--bg-card-hover); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color);">
          <div class="input-grp" id="grpExam" style="display: none;">
            <label>Exam Name</label>
            <input type="text" id="examName" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border-color); font-size: 0.95rem; color: var(--text-main); background: var(--bg-body);" placeholder="e.g. UGC NET">
          </div>
          <div class="input-grp" id="grpSubject" style="display: none;">
            <label>Subject</label>
            <input type="text" id="subjectName" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border-color); font-size: 0.95rem; color: var(--text-main); background: var(--bg-body);" placeholder="e.g. Management">
          </div>
          <div class="input-grp" id="grpTopic" style="display: none; margin-bottom: 0;">
            <label>Topic</label>
            <input type="text" id="topicName" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid var(--border-color); font-size: 0.95rem; color: var(--text-main); background: var(--bg-body);" placeholder="e.g. Marketing">
          </div>
        </div>

        <div class="input-grp">
          <label>Difficulty Level</label>
          <select id="diffLevel">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="input-grp">
          <label>Number of Questions</label>
          <select id="qCount">
            <option value="10" selected>10 Questions</option>
            <option value="15">15 Questions</option>
            <option value="30">30 Questions</option>
            <option value="45">45 Questions</option>
          </select>
        </div>

        <button class="btn-primary" id="startBtn">Generate Test</button>
      </div>

      <div id="loadingStep" class="card hidden" style="text-align: center;">
        <h3 style="color: var(--text-main); font-size: 1.3rem; font-weight: 600;"><i class="fas fa-spinner fa-spin" style="margin-right:10px; color:#0071e3;"></i> Generating AI Assessment...</h3>
      </div>

      <div id="testStep" class="card hidden">
        <div id="progress"></div>
        <div class="question-box">
          <div class="question-text" id="qText"></div>
          <div id="optContainer"></div>
        </div>
        <button class="btn-primary" id="nextBtn">Next</button>
      </div>

      <div id="resultStep" class="card hidden">
        <h1 style="text-align: center;">Results</h1>
        <div class="result-score" id="scoreDiv">0%</div>
        <div style="text-align: center; margin-top: 15px;">
          <a href="../tools/performance-analyzer.html?load=true" class="btn-primary" style="display: inline-block; background: #c0962d; text-decoration: none; padding: 10px 20px; font-size: 0.9rem;"><i class="fas fa-chart-line"></i> Open in Performance Analyzer</a>
        </div>
        <div id="reviewContainer" style="margin-top: 20px;"></div>
        <button class="btn-primary" id="retakeBtn" style="margin-top: 20px;">Retake Test</button>
      </div>
    </div>
  </div>

  <div id="whyModal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <h3 style="margin-bottom: 15px; color: #0071e3;"><i class="fas fa-lightbulb"></i> AI Explanation</h3>
      <div id="explanationBody" class="explanation-text">
        <div style="text-align: center; padding: 20px;">
          <i class="fas fa-circle-notch fa-spin"></i> Loading explanation...
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js?v=118.0"></script>

  <script src="/js/api-client.js"></script>
  <script>
    function toggleTestModeInputs() {
      const mode = document.getElementById('testMode').value;
      const grp = document.getElementById('examContextGroup');
      const gExam = document.getElementById('grpExam');
      const gSubj = document.getElementById('grpSubject');
      const gTopc = document.getElementById('grpTopic');
      
      if(mode === 'random') {
        grp.style.display = 'none';
      } else {
        grp.style.display = 'block';
        gExam.style.display = 'none';
        gSubj.style.display = 'none';
        gTopc.style.display = 'none';
        
        if(mode === 'exam') {
          gExam.style.display = 'block';
        } else if(mode === 'subject') {
          gExam.style.display = 'block';
          gSubj.style.display = 'block';
        } else if(mode === 'topic') {
          gExam.style.display = 'block';
          gSubj.style.display = 'block';
          gTopc.style.display = 'block';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      let sessionId, questions = [], answers = [], currentIdx = 0;

      const setupStep = document.getElementById('setupStep');
      const loadingStep = document.getElementById('loadingStep');
      const testStep = document.getElementById('testStep');
      const resultStep = document.getElementById('resultStep');
      const whyModal = document.getElementById('whyModal');
      const explanationBody = document.getElementById('explanationBody');

      document.getElementById('startBtn').onclick = async () => {
        setupStep.classList.add('hidden'); loadingStep.classList.remove('hidden');
        try {
          const difficulty = document.getElementById('diffLevel').value;
          const count = parseInt(document.getElementById('qCount').value) || 10;
          const mode = document.getElementById('testMode').value;
          
          let examContext = "";
          if (mode !== 'random') {
            const exam = document.getElementById('examName').value;
            const sub = document.getElementById('subjectName').value;
            const top = document.getElementById('topicName').value;
            examContext = `Mode: ${mode}, Exam: ${exam}, Subject: ${sub}, Topic: ${top}`;
          }

          // Mocking the context injection into API payload:
          const payload = { difficulty, count, examContext };
          
          const res = await window.solmatesAPI.generateAIToolData('aptitude-test', payload);
          if (!res.success) throw new Error();
          questions = res.data.questions;
          sessionId = res.data.sessionId;
          answers = new Array(questions.length).fill(null);
          currentIdx = 0;
          loadingStep.classList.add('hidden'); testStep.classList.remove('hidden');
          renderQ();
        } catch (e) {
          alert("Error generating API data"); location.reload();
        }
      };

      function renderQ() {
        if (currentIdx >= questions.length) { submitTest(); return; }
        document.getElementById('progress').textContent = `${currentIdx + 1}/${questions.length}`;
        document.getElementById('qText').textContent = questions[currentIdx].text;
        const c = document.getElementById('optContainer'); c.innerHTML = '';
        questions[currentIdx].options.forEach((opt, idx) => {
          const d = document.createElement('div'); d.className = 'option';
          if (answers[currentIdx] === idx) d.classList.add('selected');
          d.textContent = opt;
          d.onclick = () => {
            c.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            d.classList.add('selected'); answers[currentIdx] = idx;
          };
          c.appendChild(d);
        });
      }

      document.getElementById('nextBtn').onclick = () => {
        if (answers[currentIdx] === null) return alert("Select an answer");
        currentIdx++; renderQ();
      };

      async function submitTest() {
        testStep.classList.add('hidden'); loadingStep.classList.remove('hidden');
        try {
          const res = await window.solmatesAPI.submitAIToolResult(sessionId, answers);
          document.getElementById('scoreDiv').textContent = `${res.score}% (${res.rawScore}/${res.totalQuestions})`;

          const rc = document.getElementById('reviewContainer'); rc.innerHTML = '';
          res.questions.forEach((q, i) => {
            const isRight = q.correctIndex === answers[i];
            const resCard = document.createElement('div');
            resCard.style.cssText = `padding:15px; margin-bottom:12px; border-left:5px solid ${isRight ? '#10b981' : '#ef4444'}; background:var(--bg-card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05);`;

            resCard.innerHTML = `
          <div style="font-weight:600; margin-bottom:6px;">${i + 1}. ${q.text}</div>
          <div style="font-size:13px; color: var(--text-muted);">Correct: <span style="color:#10b981; font-weight:600;">${q.options[q.correctIndex]}</span></div>
          <div style="font-size:13px; color: var(--text-muted);">Your Answer: <span style="color:${isRight ? '#10b981' : '#ef4444'}; font-weight:600;">${answers[i] !== null ? q.options[answers[i]] : 'None'}</span></div>
          <button class="btn-why" data-idx="${i}"><i class="fas fa-wand-sparkles"></i> Why / Explain?</button>
        `;
            rc.appendChild(resCard);
          });

          // Bind Why buttons
          rc.querySelectorAll('.btn-why').forEach(btn => {
            btn.onclick = async () => {
              const idx = parseInt(btn.dataset.idx);
              const q = res.questions[idx];
              whyModal.classList.remove('hidden');
              explanationBody.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-circle-notch fa-spin"></i> Mate AI is thinking...</div>';

              try {
                const expRes = await window.solmatesAPI.explainAnswer(q.text, q.options[q.correctIndex], 'Aptitude Test');
                if (expRes.success) {
                  explanationBody.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6;">${expRes.explanation}</div>`;
                } else {
                  explanationBody.innerHTML = `<div style="color: #bf3b3b; padding: 10px; background: var(--bg-card-hover); border-radius: 10px;">
                <i class="fas fa-exclamation-circle"></i> ${expRes.error || 'Could not generate explanation.'}
                ${expRes.detail ? `<br><small style="opacity: 0.8;">${expRes.detail}</small>` : ''}
              </div>`;
                }
              } catch (e) {
                explanationBody.innerHTML = `<div style="color: #bf3b3b; padding: 10px; background: var(--bg-card-hover); border-radius: 10px;">
              <i class="fas fa-wifi"></i> Error connecting to AI. Please try again.
              <br><small style="opacity: 0.8;">${e.message}</small>
            </div>`;
              }
            };
          });

          loadingStep.classList.add('hidden'); resultStep.classList.remove('hidden');
        } catch (e) { alert("Submission failed"); }
      }

      document.getElementById('closeModal').onclick = () => whyModal.classList.add('hidden');
      window.onclick = (e) => { if (e.target === whyModal) whyModal.classList.add('hidden'); };

      document.getElementById('retakeBtn').onclick = () => location.reload();
    });
  </script>
