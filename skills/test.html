<script>// OS-based theme-color for TWA status bar
(function(){var m=document.getElementById("theme-color-meta");if(!m){m=document.createElement("meta");m.name="theme-color";m.id="theme-color-meta";document.head&&document.head.appendChild(m);}function setOsColor(){if(m)m.setAttribute("content",window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"#0f172a":"#ffffff");}setOsColor();window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",setOsColor);})();
</script>

<script>

    document.onkeydown = function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) return false;
    };
    /* Aggressive devtools polling removed */
})();
</script>
