<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=111.9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Ideas Generator — SOLMATES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--bg-body) !important;
      color: var(--text-main) !important;
    }

    .top-nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 52px;
      background: var(--bg-nav);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .nav-logo {
      font-weight: 600;
      font-size: 1.25rem;
    }

    .back-link {
      text-decoration: none;
      color: #0071e3;
      font-weight: 500;
    }

    .page-content {
      padding: 92px 24px 48px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .btn-primary {
      background: #0071e3;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    .project-card {
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      background: var(--bg-card);
    }

    .project-card h3 {
      color: var(--brand-primary);
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .badge-diff {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 15px;
      background: var(--bg-card-hover);
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .p-section {
      margin-bottom: 15px;
    }

    .p-section strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text-main);
    }

    .tech-tag {
      display: inline-block;
      padding: 4px 10px;
      background: var(--bg-card-hover);
      color: #0071e3;
      border-radius: 5px;
      font-size: 0.85rem;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    
  

    /* Dark Mode Native OS Integration */
    :root {
      --bg-body: #ffffff;
      --text-main: #111111;
      --text-muted: #555555;
      --text-lighter: #666666;
      --bg-nav: rgba(255, 255, 255, 0.98);
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9fb;
      --border-color: #eeeeee;
      --hero-bg: linear-gradient(to bottom, #ffffff, #f5f5f7);
      --brand-primary: #0f2b46;
      --brand-accent: #c0962d;
    }

    /* dark mode moved */
    
    input, select, textarea {
      background: var(--bg-card-hover) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-muted) !important;
      opacity: 0.7;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #0071e3 !important;
      box-shadow: 0 0 0 2px rgba(0,113,227,0.2);
    }

    </style>
  <script src="/js/sol-cache.js?v=90.0"></script>


<style id="solmates-dark-style" media="(prefers-color-scheme: dark)">

      :root {
        --bg-body: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-lighter: #cbd5e1;
        --bg-nav: rgba(15, 23, 42, 0.98);
        --bg-card: #1e293b;
        --bg-card-hover: #334155;
        --border-color: #334155;
        --hero-bg: linear-gradient(to bottom, #0f172a, #1e293b);
        --brand-primary: #f8fafc;
        --brand-accent: #c0962d;
      }
      .top-nav { border-bottom: 1px solid var(--border-color) !important; }
    
</style>
<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            document.documentElement.style.colorScheme = 'dark';
        } else if (theme === 'light') {
            meta.setAttribute('content', 'light only');
            document.documentElement.style.colorScheme = 'light';
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>
</head>

<body>

  <header class="top-nav" style="justify-content: center;">
    <span class="nav-logo" style="cursor: default;">Project Ideas Generator</span>
  </header>

  <div class="page-content">
    <div class="container">
      <div id="setupStep" class="card">
        <h1><i class="fas fa-lightbulb"></i> Project Ideas Generator</h1>
        <p>Need portfolio projects? AI will generate 3 highly impressive real-world project ideas based on your domain.
        </p>

        <label>Target Domain / Area</label>
        <input type="text" id="targetDom" placeholder="e.g. Data Visualization, Full-Stack Web, Cybersecurity">

        <label>Current Skill Level</label>
        <select id="currLev">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <button class="btn-primary" id="startBtn">Generate Projects</button>
      </div>

      <div id="loadingStep" class="card hidden" style="text-align: center;">
        <h3>Brainstorming with AI...</h3>
      </div>

      <div id="resultStep" class="card hidden">
        <h1 style="text-align: center; margin-bottom: 30px;">Your Custom Project Ideas</h1>

        <div id="projectsContainer"></div>

        <div
          style="background: var(--bg-card-hover); border-left: 5px solid #0071e3; padding: 20px; border-radius: 10px; margin-top: 30px;">
          <h3><i class="fas fa-briefcase"></i> Portfolio Advice</h3>
          <p id="advTxt" style="margin-top: 10px;"></p>
        </div>

        <button class="btn-primary" onclick="location.reload()">Generate More</button>
      </div>
    </div>
  </div>

  <script src="/config.js?v=117.0"></script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('startBtn').onclick = async () => {
        const dom = document.getElementById('targetDom').value;
        if (!dom) return alert("Please enter a domain.");

        document.getElementById('setupStep').classList.add('hidden');
        document.getElementById('loadingStep').classList.remove('hidden');

        try {
          const res = await window.solmatesAPI.generateAIToolData('project-ideas', {
            domain: dom,
            level: document.getElementById('currLev').value
          });
          if (!res.success) throw new Error();

          const { projects, portfolioAdvice } = res.data;

          document.getElementById('advTxt').textContent = portfolioAdvice;

          document.getElementById('projectsContainer').innerHTML = projects.map(p => `
        <div class="project-card">
          <h3>${p.title}</h3>
          <span class="badge-diff"><i class="fas fa-hammer"></i> ${p.difficulty}</span>
          
          <div class="p-section">
            <strong>Description</strong>
            ${p.description}
          </div>
          
          <div class="p-section">
            <strong>Tech Stack</strong>
            ${p.techStack.map(t => `<span class="tech-tag">${t}</span>`).join('')}
          </div>
          
          <div class="p-section">
            <strong>Learning Outcomes</strong>
            <ul style="padding-left: 20px;">
              ${p.learningOutcomes.map(o => `<li>${o}</li>`).join('')}
            </ul>
          </div>
        </div>
      `).join('');

          document.getElementById('loadingStep').classList.add('hidden');
          document.getElementById('resultStep').classList.remove('hidden');
        } catch (e) {
          alert("Error generating API data"); location.reload();
        }
      };
    });
  </script>
</body>

</html>
