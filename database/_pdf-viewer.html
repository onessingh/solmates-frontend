<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();

<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

  <script>
    function showToast(msg, type = 'info', duration = 3000, action = null) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let icon = 'fa-info-circle';
      if (type === 'success') icon = 'fa-check-circle';
      if (type === 'downloading') icon = 'fa-spinner fa-spin';

      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${msg}</span>
        ${action ? `<a href="${action.url}" target="_blank" class="drive-btn">${action.text}</a>` : ''}
      `;
      
      container.appendChild(toast);
      if (duration > 0) {
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-20px)';
          setTimeout(() => toast.remove(), 500);
        }, duration);
      }
      return toast;
    }

    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.hostname)) {
        window.history.back();
      } else {
        window.location.href = '/database';
      }
    }

    async function applySolmatesWatermark(pdfBytes) {
      const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
      const pages = pdfDoc.getPages();
      const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      const fontRegular = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      for (const page of pages) {
        const { width, height } = page.getSize();
        const centerText = 'SOLMATES - solmates.in';
        const textSize = Math.min(Math.max(width * 0.065, 28), 44);
        const textWidth = fontBold.widthOfTextAtSize(centerText, textSize);
        const angle = 45;
        const angleRad = angle * Math.PI / 180;
        const centerX = (width / 2) - (textWidth / 2) * Math.cos(angleRad);
        const centerY = (height / 2) - (textWidth / 2) * Math.sin(angleRad);

        page.drawText(centerText, {
          x: centerX,
          y: centerY,
          size: textSize,
          font: fontBold,
          color: PDFLib.rgb(0.35, 0.35, 0.40),
          opacity: 0.21,
          rotate: PDFLib.degrees(angle),
        });

        page.drawText('SOLMATES EDUCATION | solmates.in', {
          x: 20,
          y: height - 18,
          size: 8.5,
          font: fontRegular,
          color: PDFLib.rgb(0.28, 0.28, 0.28),
          opacity: 0.65,
        });

        page.drawText('Downloaded from Solmates (solmates.in) | For Personal Student Use Only', {
          x: 20,
          y: 12,
          size: 8.5,
          font: fontRegular,
          color: PDFLib.rgb(0.28, 0.28, 0.28),
          opacity: 0.65,
        });
      }

      const modifiedBytes = await pdfDoc.save();
      return new Blob([modifiedBytes], { type: 'application/pdf' });
    }

    async function handleDownload() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('type') === 'analysis') {
        const frame = document.getElementById('pdfFrame');
        const docElem = frame?.contentDocument?.querySelector('.doc-container') || frame?.contentDocument?.body;
        if (!docElem) return;

        const title = params.get('title') || 'PYQ Analysis';
        const cleanFileName = (title.replace(/[^a-z0-9_\-\s]/gi, '').trim() || 'Document') + '.pdf';

        const btn = document.getElementById('dlBtn');
        const origBtnHtml = btn ? btn.innerHTML : '';
        if (btn) {
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Preparing...</span>';
          btn.style.pointerEvents = 'none';
        }

        const modalFileName = document.getElementById('dlModalFileName');
        if (modalFileName) {
          modalFileName.textContent = cleanFileName;
        }

        const statusEl = document.getElementById('dlModalStatus');
        if (statusEl) {
          statusEl.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 0;">
              <i class="fas fa-circle-notch fa-spin fa-2x" style="color:#2563eb;"></i>
              <span style="font-size:14px; font-weight:700; color:#1e293b;">Generating Complete PDF...</span>
              <span style="font-size:12px; color:#64748b;">Compiling all chapters, questions and watermark</span>
            </div>
          `;
        }

        const overlay = document.getElementById('downloadModalOverlay');
        if (overlay) overlay.classList.add('open');

        // Render full PDF without 5-second cutoff
        (async () => {
          try {
            if (typeof html2pdf === 'undefined') {
              throw new Error('html2pdf library not loaded');
            }

            const scrollH = docElem.scrollHeight || 3500;

            const opt = {
              margin: [10, 10, 10, 10],
              filename: cleanFileName,
              image: { type: 'jpeg', quality: 0.98 },
              enableLinks: false,
              pagebreak: {
                mode: ['avoid-all', 'css', 'legacy'],
                avoid: ['.card', '.topic-card', '.approach-box', '.q-box', '.section-title', 'ul.tips-list li']
              },
              html2canvas: {
                scale: 2,
                useCORS: true,
                letterRendering: true,
                logging: false,
                scrollY: 0,
                scrollX: 0,
                windowWidth: 1000,
                windowHeight: scrollH + 500,
                onclone: (clonedDoc) => {
                  const frame = document.getElementById('pdfFrame');
                  if (frame && frame.contentDocument) {
                    frame.contentDocument.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => {
                      clonedDoc.head.appendChild(s.cloneNode(true));
                    });
                  }
                  const container = clonedDoc.querySelector('.doc-container');
                  if (container) {
                    container.style.height = 'auto';
                    container.style.maxHeight = 'none';
                    container.style.overflow = 'visible';
                  }
                  if (clonedDoc.body) {
                    clonedDoc.body.style.height = 'auto';
                    clonedDoc.body.style.maxHeight = 'none';
                    clonedDoc.body.style.overflow = 'visible';
                  }
                }
              },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const rawBlob = await html2pdf().set(opt).from(docElem).outputPdf('blob');
            const rawBuffer = await rawBlob.arrayBuffer();
            const watermarkedBlob = await applySolmatesWatermark(rawBuffer);

            if (statusEl) {
              statusEl.innerHTML = '<div style="color:#22c55e; font-weight:700; font-size:15px; margin:8px 0;"><i class="fas fa-check-circle"></i> Download Complete!</div>';
            }

            if (watermarkedBlob) {
              const blobUrl = URL.createObjectURL(watermarkedBlob);
              const a = document.createElement('a');
              a.href = blobUrl;
              a.download = cleanFileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
              showToast("Watermarked PDF Downloaded Successfully! 📄", "success", 4000);
            } else {
              showToast("Failed to generate PDF.", "error", 4000);
            }
          } catch (e) {
            console.error('Analysis PDF render failed:', e);
            if (statusEl) {
              statusEl.innerHTML = `<div style="color:#ef4444; font-weight:700; font-size:13px; margin:8px 0;">Generation failed: ${e.message}</div>`;
            }
            showToast("Failed to generate PDF. Please try again.", "error", 4000);
          } finally {
            if (btn) {
              btn.innerHTML = origBtnHtml;
              btn.style.pointerEvents = 'auto';
            }
            dlModalCloseTimeout = setTimeout(() => {
              closeDownloadModal();
            }, 1200);
          }
        })();
        return;
      }
      const rawUrl = params.get('file');
      const title = params.get('title') || 'Document';
      
      if (!rawUrl) return;

      const btn = document.getElementById('dlBtn');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Downloading...</span>';
      btn.style.pointerEvents = 'none';

      // Detect extension based on rawUrl and title
      let isSlides = false;
      let extension = 'pdf';
      let downloadUrl = '';

      const lowerUrl = rawUrl.toLowerCase();
      const lowerTitle = title.toLowerCase();

      if (lowerUrl.includes('docs.google.com/presentation/d/')) {
        isSlides = true;
        extension = 'pptx';
        const pptMatch = rawUrl.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
        if (pptMatch && pptMatch[1]) {
          downloadUrl = `https://docs.google.com/presentation/d/${pptMatch[1]}/export/pptx`;
        }
      } else if (lowerUrl.includes('drive.google.com') && (lowerUrl.includes('.ppt') || lowerUrl.includes('.pptx') || lowerTitle.includes('.ppt') || lowerTitle.includes('.pptx'))) {
        isSlides = true;
        extension = lowerUrl.includes('.ppt') ? 'ppt' : 'pptx';
        if (lowerTitle.includes('.pptx')) extension = 'pptx';
        else if (lowerTitle.includes('.ppt')) extension = 'ppt';

        const driveMatch = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) {
          downloadUrl = `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
        }
      } else if (lowerUrl.endsWith('.ppt') || lowerUrl.endsWith('.pptx')) {
        isSlides = true;
        extension = lowerUrl.endsWith('.ppt') ? 'ppt' : 'pptx';
        downloadUrl = rawUrl;
      }

      if (isSlides) {
        const loadingToast = showToast("Downloading PowerPoint...", "downloading", 0);
        
        // Direct anchor download for PowerPoint to bypass CORS limitations gracefully
        const a = document.createElement('a');
        a.href = downloadUrl;
        // Removed target='_blank' to prevent the screen from flashing black on mobile during download
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        setTimeout(() => {
          btn.innerHTML = original;
          btn.style.pointerEvents = 'auto';
          loadingToast.remove();
          showToast("PowerPoint Downloaded!", "success", 6000);
        }, 1500);
        return;
      }

      const loadingToast = showToast("Downloading PDF...", "downloading", 0);

      try {
        let directUrl = rawUrl;
        if (rawUrl.includes('drive.google.com')) {
          const fileId = rawUrl.match(/[-\w]{25,}/);
          if (fileId) directUrl = `https://drive.google.com/uc?export=download&id=${fileId[0]}`;
        }
        
        // 100% CLIENT-SIDE: Try direct browser fetch & blob download (0 Render Backend Bandwidth)
        const response = await fetch(directUrl);
        if (!response.ok) throw new Error("Client fetch failed");

        const blob = await response.blob();
        const bUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = bUrl;
        a.download = `${title.replace(/[^a-z0-9]/gi, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(bUrl);
        
        loadingToast.remove();
        
        const driveUrl = rawUrl.includes('drive.google.com') ? rawUrl : `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}`;

        showToast("PDF Downloaded!", "success", 6000, {
          text: "OPEN WITH DRIVE",
          url: driveUrl
        });

      } catch (err) {
        console.warn("Direct fetch restricted, triggering direct browser download link", err);
        loadingToast.remove();
        
        let downloadLink = rawUrl;
        if (rawUrl.includes('drive.google.com')) {
          const fileId = rawUrl.match(/[-\w]{25,}/);
          if (fileId) downloadLink = `https://drive.google.com/uc?export=download&id=${fileId[0]}`;
        }

        // Direct anchor download without opening blank tabs or touching backend
        const fallbackA = document.createElement('a');
        fallbackA.href = downloadLink;
        fallbackA.download = `${title.replace(/[^a-z0-9]/gi, '_')}.pdf`;
        document.body.appendChild(fallbackA);
        fallbackA.click();
        document.body.removeChild(fallbackA);
        
        const driveUrl = rawUrl.includes('drive.google.com') ? rawUrl : `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}`;
        showToast("PDF Download Started!", "success", 6000, {
          text: "OPEN WITH DRIVE",
          url: driveUrl
        });
      } finally {
        setTimeout(() => {
          btn.innerHTML = original;
          btn.style.pointerEvents = 'auto';
        }, 3000);
      }
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title') || 'Document View';
      
      document.getElementById('fileTitle').innerText = title;
      document.title = title + ' | SOLMATES';

      if (params.get('type') === 'analysis') {
        loadPyqAnalysisView(params);
        return;
      }

      const rawUrl = params.get('file');
      if (!rawUrl) {
        showError('No file link provided.');
        return;
      }

      const finalUrl = transformDriveLink(decodeURIComponent(rawUrl));
      const frame = document.getElementById('pdfFrame');
      
      // Dynamically apply cropping class and toggle secure transparent blocker based on final URL type
      if (finalUrl.includes('drive.google.com') || finalUrl.includes('docs.google.com/presentation')) {
        frame.className = 'drive-preview';
        document.getElementById('iframeBlocker').style.display = 'block';
      } else {
        frame.className = 'docs-viewer';
        document.getElementById('iframeBlocker').style.display = 'none';
      }
      
      frame.onload = function() {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
        }, 500);
      };

      // Fallback for load detection - extended for large files
      setTimeout(() => {
        if (document.getElementById('loading').style.display !== 'none') {
          document.getElementById('loading').style.opacity = '0';
          setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
        }
      }, 8000);

      frame.src = finalUrl;
    }

    function transformDriveLink(url) {
      // 1. If it's already a docs viewer, leave it
      if (url.includes('docs.google.com/viewer')) return url;

      // 2. Extract Google Slides / Presentation links and render in the 100% stable native Google Drive Preview format (Never Edit View!)
      if (url.includes('docs.google.com/presentation/d/')) {
        const pptMatch = url.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
        if (pptMatch && pptMatch[1]) {
          return `https://drive.google.com/file/d/${pptMatch[1]}/preview`;
        }
      }

      // 3. Extract File ID for standard Drive Links (PDF, binary .ppt/.pptx, etc.)
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        // Render Google Drive files using native Drive Preview format for absolute stability
        return `https://drive.google.com/file/d/${fileId}/preview`;
      }

      // 4. Fallback: Google Docs Viewer for other documents
      return `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true&chrome=false`;
    }

.qfield input:focus, .qfield select:focus, .qfield textarea:focus { border-color: var(--qfocus, #3b82f6); background: var(--qinput-focus, #ffffff); box-shadow: 0 0 0 3px var(--qring, rgba(59, 130, 246, 0.15)); }
.qfield textarea { resize: vertical; min-height: 85px; line-height: 1.5; }
.qchar { font-size: 11px; color: var(--qsub, #94a3b8); text-align: right; margin-top: 4px; margin-right: 4px; font-weight: 500; }
#qSubmitBtn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--qbtn1, #0f2b46), var(--qbtn2, #1a4a75)); color: #ffffff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; margin-bottom: 20px; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(15,43,70,0.2); display: flex; justify-content: center; align-items: center; gap: 8px; }
#qSubmitBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,43,70,0.3); }
#qSubmitBtn:active { transform: translateY(0); }
#qSubmitBtn:disabled { background: var(--qborder, #cbd5e1); color: var(--qsub, #94a3b8); cursor: not-allowed; box-shadow: none; transform: none; }
#qCloseBtn { position: absolute; top: 16px; right: 16px; background: var(--qinput, #f1f5f9); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; color: var(--qsub, #64748b); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 10; }
#qCloseBtn:hover { background: var(--qborder, #e2e8f0); color: var(--qtxt, #0f172a); }
#qSuccessMsg { display: none; text-align: center; padding: 30px 10px 40px; }
#qSuccessMsg .qcheck { font-size: 54px; margin-bottom: 10px; animation: qPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes qPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
#qSuccessMsg h3 { color: var(--qhead, #0f2b46); margin: 0 0 8px; font-size: 22px; font-weight: 700; }
#qSuccessMsg p { color: var(--qsub, #64748b); font-size: 14px; margin: 0; line-height: 1.5; }
.qopt { color: var(--qsub, #94a3b8); font-size: 11px; font-weight: 500; }
html[data-solmates-theme=dark] #queryModal, body.dark-mode #queryModal { --qbg: rgba(15,23,42,0.95); --qtxt: #f8fafc; --qhead: #f8fafc; --qsub: #94a3b8; --qlabel: #e2e8f0; --qborder: rgba(255,255,255,0.1); --qinput: rgba(0,0,0,0.2); --qinput-focus: rgba(0,0,0,0.4); --qfocus: #3b82f6; --qring: rgba(59,130,246,0.25); --qbtn1: #3b82f6; --qbtn2: #2563eb; }
</style>
<button id="queryFloatBtn" onclick="openQueryModal()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
  Ask Query
</button>
<div id="queryModalOverlay">
  <div id="queryModal">
    <button id="qCloseBtn" onclick="closeQueryModal()">&#x2715;</button>
    <div id="qFormSection">
      <div id="qHeader">
        <h2>Need Help?</h2>
        <p class="qsub">Ask us anything, we're here for you &#128591;</p>
      </div>
      <div class="qfield"><label>Full Name *</label><input type="text" id="qName" placeholder="S.Singh" maxlength="60"></div>
      <div class="qfield"><label>Phone Number <span class="qopt">(or Email)</span></label><input type="tel" id="qPhone" placeholder="10-digit mobile number" maxlength="10"></div>
      <div class="qfield"><label>Email Address <span class="qopt">(or Phone)</span></label><input type="email" id="qGmail" placeholder="singh@gmail.com"></div>
      <div style="display:flex; gap:10px;">
        <div class="qfield" style="flex:1;"><label>Semester *</label>
          <select id="qSemester"><option value="">-- Select --</option><option value="1st Sem">1st Sem</option><option value="2nd Sem">2nd Sem</option><option value="3rd Sem">3rd Sem</option><option value="4th Sem">4th Sem</option></select>
        </div>
        <div class="qfield" style="flex:1.2;"><label>Topic *</label>
          <select id="qType"><option value="">-- Select --</option><option value="Study Material">Study Material</option><option value="Exam Related">Exam Related</option><option value="Technical Issue">Technical Issue</option><option value="General">General</option></select>
        </div>
      </div>
      <div class="qfield"><label>Your Query *</label>
        <textarea id="qQuestion" placeholder="Please describe your query clearly in detail..." maxlength="500" oninput="document.getElementById('qCharCount').textContent=this.value.length+'/500'"></textarea>
        <div class="qchar"><span id="qCharCount">0/500</span></div>
      </div>
      <button id="qSubmitBtn" onclick="submitQuery()">
        Send Message 
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
    <div id="qSuccessMsg">
      <div class="qcheck">&#10004;&#65039;</div>
      <h3>Message Sent!</h3>
      <p>Thank you for reaching out. Our team will contact you on your number shortly.</p>
    </div>
  </div>
</div>
<script src="/js/profanity.js"></script>
<script src="/js/draggable-query.js"></script>
<script>
(function(){
  var isViewer = window.location.pathname.includes("viewer");
  if(isViewer) { document.getElementById("queryFloatBtn").style.bottom = "140px"; }
  var isAdmin = window.solmatesAPI && window.solmatesAPI.isAdminLoggedIn();
  if(isAdmin) { document.getElementById("queryFloatBtn").style.display = "none"; }
  function qT(){var t=localStorage.getItem("solmates_theme")||"light";if(t==="dark")document.documentElement.setAttribute("data-solmates-theme","dark");else document.documentElement.removeAttribute("data-solmates-theme");}
  qT();window.addEventListener("storage",function(e){if(e.key==="solmates_theme")qT();});
  function qCtx(){try{var p=window.location.pathname,q=new URLSearchParams(window.location.search);if(p.includes("pdf-viewer"))return "PDF: "+(q.get("file")||q.get("name")||"PDF");if(p.includes("video-viewer"))return "Video: "+(q.get("title")||q.get("name")||"Video");return "Page: "+p.split("/").pop();}catch(e){return "Solmates";}}
  function qRL(ph){try{var k="qrl_"+ph,d=JSON.parse(localStorage.getItem(k)||'{"count":0,"date":""}'),t=new Date().toDateString();if(d.date!==t)d={count:0,date:t};if(d.count>=3)return false;d.count++;localStorage.setItem(k,JSON.stringify(d));return true;}catch(e){return true;}}
  window.openQueryModal=function(){document.getElementById("queryModalOverlay").classList.add("open");document.getElementById("qFormSection").style.display="block";document.getElementById("qSuccessMsg").style.display="none";document.getElementById("qSubmitBtn").disabled=false;qT();};
  window.closeQueryModal=function(){document.getElementById("queryModalOverlay").classList.remove("open");};
  document.getElementById("queryModalOverlay").addEventListener("click",function(e){if(e.target===this)closeQueryModal();});
  window.submitQuery=async function(){
    var n=(document.getElementById("qName").value||"").trim(),ph=(document.getElementById("qPhone").value||"").trim(),gm=(document.getElementById("qGmail").value||"").trim(),sm=document.getElementById("qSemester").value,qt=document.getElementById("qType").value,qq=(document.getElementById("qQuestion").value||"").trim();
    if(!n){alert("Please enter your full name.");return;}
    if(!ph && !gm){alert("Please provide either your Phone Number or Email Address.");return;}if(ph && !/^[0-9]{10}$/.test(ph)){alert("Please enter a valid 10-digit phone number.");return;}
    if(!sm){alert("Please select your semester.");return;}
    if(!qt){alert("Please select a topic.");return;}
    if(!qq){alert("Please describe your query.");return;}
    if(window.solmatesCheckProfanity && (window.solmatesCheckProfanity(n) || window.solmatesCheckProfanity(qq))){alert("Please keep your query respectful and appropriate.");return;}
    if(!qRL(ph || gm)){alert("You have reached the limit of 3 queries per day. Please try again tomorrow.");return;}
    var btn=document.getElementById("qSubmitBtn");btn.disabled=true;btn.innerHTML="Sending...";
    var ctx=qCtx(),ts=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    var url = window.location.href;
    var msg="\u2753 Student Query\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\ud83d\udc64 "+n+"\n\ud83d\udcf1 "+(ph||"Not provided")+"\n\ud83d\udce7 "+(gm||"Not provided")+"\n\ud83c\udf93 "+sm+"\n\ud83d\udcc2 "+qt+"\n\ud83d\udccc Context: "+ctx+"\n\ud83d\udd17 Link: "+url+"\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n"+qq+"\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\u23f0 "+ts+" IST";
    try{
      var r=await fetch("https://api.telegram.org/bot8597525439:AAEV6WWYB3KXReoaNmbUoNWQqCyPvUe2laY/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:"1772865405",text:msg})});
      if(!r.ok)throw new Error("err");
      document.getElementById("qFormSection").style.display="none";document.getElementById("qSuccessMsg").style.display="block";
    }catch(err){alert("Failed to send. Please try again.");btn.disabled=false;btn.innerHTML="Send Message <svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><line x1='22' y1='2' x2='11' y2='13'></line><polygon points='22 2 15 22 11 13 2 9 22 2'></polygon></svg>";}
  };
})();
</script>
