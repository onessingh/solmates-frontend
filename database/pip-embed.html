<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Solmates Lecture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 1. Solmates Top Shield: 100% BLOCKS channel avatar, name, and subscribers */
        .solmates-top-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #000000;
            z-index: 2147483647;
            pointer-events: auto;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .solmates-badge {
            background: rgba(15, 23, 42, 0.95);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            text-shadow: 0 1px 2px #000;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .lecture-title {
            color: #f1f5f9;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 2. Solmates Bottom Shield & Controls: 100% BLOCKS YouTube logo & link icon */
        .solmates-bottom-shield {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: #000000;
            z-index: 2147483647;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            color: #38bdf8;
            background: rgba(255, 255, 255, 0.1);
        }

        .play-pause-btn {
            background: #38bdf8;
            border: none;
            color: #0f172a;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .play-pause-btn:hover {
            background: #7dd3fc;
            transform: scale(1.06);
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <!-- Top Shield -->
        <div class="solmates-top-shield">
            <span class="solmates-badge">🎓 Solmates</span>
            <span id="pipTitle" class="lecture-title">Class Lecture</span>
        </div>

        <!-- YouTube Embed with Native Solmates Origin Context -->
        <iframe id="pipFrame" 
                src="about:blank" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <!-- Bottom Shield with Solmates Controls -->
        <div class="solmates-bottom-shield">
            <button id="pipRewindBtn" class="ctrl-btn" title="Rewind 10 seconds">
                ⏪ 10s
            </button>
            <button id="pipPlayPauseBtn" class="play-pause-btn" title="Play / Pause">
                ⏸
            </button>
            <button id="pipForwardBtn" class="ctrl-btn" title="Forward 10 seconds">
                10s ⏩
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('videoId');
        const title = params.get('title') || 'Class Lecture';
        const start = parseInt(params.get('start')) || 0;

        document.getElementById('pipTitle').innerText = title;
        document.title = title + " - Solmates";

        const pipFrame = document.getElementById('pipFrame');
        const playPauseBtn = document.getElementById('pipPlayPauseBtn');
        const rewindBtn = document.getElementById('pipRewindBtn');
        const forwardBtn = document.getElementById('pipForwardBtn');

        let isPlaying = true;
        let currentTime = start;

        function sendYtCommand(func, args = []) {
            if (pipFrame && pipFrame.contentWindow) {
                pipFrame.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: func,
                    args: args
                }), '*');
            }
        }

        // Initialize YouTube embed iframe with correct origin and referrer headers
        if (videoId) {
            const startParam = start > 0 ? `&start=${start}` : '';
            const origin = encodeURIComponent(window.location.origin);
            const ref = encodeURIComponent(window.location.href);
            pipFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&fs=0${startParam}&origin=${origin}&widget_referrer=${ref}`;
        }

        playPauseBtn.onclick = () => {
            if (isPlaying) {
                sendYtCommand('pauseVideo');
                isPlaying = false;
                playPauseBtn.innerText = '▶';
            } else {
                sendYtCommand('playVideo');
                isPlaying = true;
                playPauseBtn.innerText = '⏸';
            }
        };

        rewindBtn.onclick = () => {
            currentTime = Math.max(0, currentTime - 10);
            sendYtCommand('seekTo', [currentTime, true]);
        };

        forwardBtn.onclick = () => {
            currentTime = currentTime + 10;
            sendYtCommand('seekTo', [currentTime, true]);
        };

        // Listen for YouTube events to update state and save progress to localStorage
        window.addEventListener('message', (event) => {
            if (!event.origin.includes('youtube.com')) return;
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (data.event === 'infoDelivery' && data.info) {
                    if (typeof data.info.currentTime !== 'undefined') {
                        currentTime = Math.floor(data.info.currentTime);
                        if (currentTime > 0 && videoId) {
                            localStorage.setItem('yt_pos_' + videoId, currentTime);
                        }
                    }
                    if (typeof data.info.playerState !== 'undefined') {
                        if (data.info.playerState === 1) { // Playing
                            isPlaying = true;
                            playPauseBtn.innerText = '⏸';
                        } else if (data.info.playerState === 2) { // Paused
                            isPlaying = false;
                            playPauseBtn.innerText = '▶';
                        }
                    }
                }
            } catch (e) {}
        });

        // Periodic heartbeat so YouTube iframe continuously streams time updates
        setInterval(() => {
            sendYtCommand('listening');
        }, 1000);
    </script>
</body>
</html>
