<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();

<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();

    <script>
      // ===== MBA SECTION LOCK GUARD =====
      (async function() {
        const p = new URLSearchParams(window.location.search);
        if (p.get('folderId')) return; // Already inside a subfolder — lock check passed on parent page
        const cat = (function() {
          const c = p.get('category');
          if (c) return c;
          const path = window.location.pathname.toLowerCase();
          if (path.includes('/notes')) return 'notes';
          if (path.includes('/pyqs')) return 'pyqs';
          if (path.includes('/oneshot')) return 'oneshot';
          if (path.includes('/professor')) return 'professor';
          return '';
        })();
        
        // If it's a healthcare category, the HC guard handles it.
        if (cat.startsWith('hc-')) return;
        
        const LOCK_MAP = {
          'recorded-class': '__MBA_RC_LOCKED__',
          'notes':          '__MBA_NOTES_LOCKED__',
          'pyqs':           '__MBA_PYQS_LOCKED__',
          'oneshot':        '__MBA_OS_LOCKED__',
          'elearning':      '__MBA_EL_LOCKED__',
          'youtube':        '__MBA_YT_LOCKED__',
          'professor':      '__MBA_CM_LOCKED__',
          'live-classes':   '__MBA_LIVE_LOCKED__'
        };
        const sectionLockKey = LOCK_MAP[cat];

          
        if (!sectionLockKey) return;

          // Block rendering while checking lock state (MBA)
          const __lockBlockerMba = document.createElement('div');
          __lockBlockerMba.id = 'lock-blocker-mba';
          __lockBlockerMba.style.cssText = 'position:fixed;inset:0;z-index:999999;background:var(--bg-body, #fff);display:flex;align-items:center;justify-content:center;';
          __lockBlockerMba.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:24px;color:var(--accent, #3b82f6);"></i>';
          // document.documentElement.appendChild(__lockBlockerMba);


          
        
        let tries = 0;
        while (!window.solmatesAPI && tries < 20) {
          await new Promise(r => setTimeout(r, 200));
          tries++;
        }
        if (!window.solmatesAPI) { if (typeof __lockBlockerMba !== 'undefined' && __lockBlockerMba && __lockBlockerMba.parentNode) __lockBlockerMba.remove(); if (typeof __lockBlockerHc !== 'undefined' && __lockBlockerHc && __lockBlockerHc.parentNode) __lockBlockerHc.remove(); return; }
        
        // Admin notification bypass
        const isAdmin = window.solmatesAPI.isAdminLoggedIn();
        
        try {
          const res = await window.solmatesAPI.getSOLFolders('recorded-class', 0, null, true);
          const folders = (res && res.data) ? res.data : [];
          const sectionLocked = folders.some(f => (f.name||'').includes(sectionLockKey));
          if (__lockBlockerMba && __lockBlockerMba.parentNode) __lockBlockerMba.remove();
          
          if (sectionLocked) {
            if (isAdmin) {

  <script>
    const params = new URLSearchParams(window.location.search);
    const CATEGORY = (function() {
      const fromParam = params.get('category');
      if (fromParam) return fromParam;
      const path = window.location.pathname.toLowerCase();
      if (path.includes('/pyqs')) return 'pyqs';
      if (path.includes('/notes')) return 'notes';
      if (path.includes('/oneshot')) return 'oneshot';
      if (path.includes('/professor')) return 'professor';
      if (path.includes('/youtube')) return 'youtube';
      if (path.includes('/elearning')) return 'elearning';
      if (path.includes('/classes')) return 'live-classes';
      return 'notes';
    })();

    let semester = null, folderId = null, navStack = [], editingItemId = null, isNavigating = false, isReorderMode = false;
    let sortableInstance = null;

    const CAT_LABELS = {
      'live-classes': 'Live Portal', 'recorded-class': 'Recorded Class', 'notes': 'Study Notes',
      'pyqs': 'Previous Year Papers', 'oneshot': 'One-Shot Revision', 'youtube': 'Video Lessons',
      'elearning': 'E-Books', 'professor': 'Class Materials',
      'hc-recorded-class': 'Healthcare Recorded Classes', 'hc-notes': 'Healthcare Notes',
      'hc-pyqs': 'Healthcare PYQs', 'hc-oneshot': 'Healthcare One-Shot', 'hc-youtube': 'Healthcare Video Lessons',
      'hc-elearning': 'Healthcare E-Books', 'hc-professor': 'Healthcare Class Materials'
    };

    function init() {
      document.getElementById('pageTitle').innerText = CAT_LABELS[CATEGORY] || 'Database';
        document.title = (CAT_LABELS[CATEGORY] || 'Database') + ' - DU SOL MBA | Solmates';
      if (window.solmatesAPI.isAdminLoggedIn()) {
        document.getElementById('adminBar').style.display = 'flex';
        document.getElementById('adminIndicator').classList.add('active');
      }
      const urlSem = parseInt(params.get('semester')), urlFolderId = params.get('folderId'), urlName = params.get('name');
      if (urlSem) {
        semester = urlSem;
        if (urlFolderId) {
          folderId = urlFolderId;
          navStack = [{ name: `Semester ${semester}`, folderId: null }, { name: urlName || 'Folder', folderId: urlFolderId }];
        } else navStack = [{ name: `Semester ${semester}`, folderId: null }];
        window.history.replaceState({ stack: [...navStack], folderId, semester }, '', window.location.href);
        document.getElementById('pageDesc').innerText = `${CAT_LABELS[CATEGORY]} • Semester ${semester}`;
        updateBreadcrumb();
        loadContent();
      } else {
        window.history.replaceState({ stack: [], folderId: null, semester: null }, '', window.location.href);
        renderSemesters(true);
      }
    }

    async function onSemesterClick(s) {
      if (isNavigating) return;
      if (CATEGORY.includes('elearning')) { window.location.href = `/database/elearning-subjects.html?category=${CATEGORY}&semester=${s}`; return; }
      if (CATEGORY.includes('youtube')) { window.location.href = `/database/youtube-browse.html?category=${CATEGORY}&semester=${s}`; return; }
      semester = s; navStack = [{ name: `Semester ${s}`, folderId: null }];
      history.pushState({ stack: [...navStack], folderId: null, semester: s }, "", window.location.pathname + `?category=${CATEGORY}&semester=${s}`);
      document.getElementById('pageDesc').innerText = `${CAT_LABELS[CATEGORY]} • Semester ${s}`;
      updateBreadcrumb();
      if (window.solmatesAPI.isAdminLoggedIn()) document.getElementById('adminBar').style.display = 'flex';
      await loadContent();
    }

    async function loadContent() {
      if (isReorderMode) return;
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
      try {
        const isAdmin = window.solmatesAPI.isAdminLoggedIn();
        
        // Deep-link Lock Protection
        if (folderId && !isAdmin) {
          const allFoldersRes = await window.solmatesAPI.getSOLFolders(CATEGORY, semester, null, true, true);
          const allFolders = allFoldersRes.data || [];
          let curr = folderId;
          let isLockedHierarchy = false;
          while (curr) {
            const f = allFolders.find(fd => fd.id === curr);
            if (!f) break;
            if (f.isLocked || (f.name && f.name.includes('[LOCKED]'))) { isLockedHierarchy = true; break; }
            curr = f.parentId;
            if (curr === f.id) break;
          }
          if (isLockedHierarchy) {
            grid.innerHTML = '<div class="empty"><i class="fas fa-lock" style="font-size:2rem;color:#f59e0b;margin-bottom:10px;"></i><br><strong>This folder is locked by the Administrator.</strong></div>';
            return;
          }
        }

        const [fRes, iRes] = await Promise.all([
          window.solmatesAPI.getSOLFolders(CATEGORY, semester, folderId, true),
          window.solmatesAPI.getSOLContent(CATEGORY, semester, folderId, true)
        ]);
        renderGrid(fRes.data || [], iRes.data || []);
      } catch (e) {
        const msg = e.message || '';
        if (msg.toLowerCase().includes('locked')) {
          grid.innerHTML = '<div class="empty"><i class="fas fa-lock" style="font-size:2rem;color:#f59e0b;margin-bottom:10px;"></i><br><strong>This folder is locked by the Administrator.</strong></div>';
        } else {
          grid.innerHTML = '<div class="empty"><i class="fas fa-folder-open" style="font-size:2rem;color:#9ca3af;margin-bottom:10px;"></i><br><strong>Admin has not added anything here yet.</strong></div>';
        }
      }
    }

    function renderGrid(folders, items) {
      const isAdmin = window.solmatesAPI.isAdminLoggedIn();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!folders.length && !items.length) { grid.innerHTML = '<div class="empty">No content here.</div>'; return; }
      
      folders.forEach(f => {
        const isHidden = (f.name || '').includes('[HIDDEN]');
        if (isHidden && !isAdmin) return;

        const fId = f.id || f._id;
        const isLocked = f.isLocked || (f.name || '').includes('[LOCKED]');
        const card = mkCard('folder', isLocked ? '<i class="fas fa-lock main-icon"></i>' : '<i class="fas fa-folder main-icon"></i>', f.name, fId);
        
        if (isHidden) card.style.opacity = '0.5';

        if (isAdmin) {
          const edt = document.createElement('div'); edt.className = 'ctrl-btn edit'; edt.innerHTML = '<i class="fas fa-edit"></i>';
          edt.onclick = e => { e.stopPropagation(); editFolderName(fId, f.name); };
          
          const del = document.createElement('div'); del.className = 'ctrl-btn delete'; del.innerHTML = '<i class="fas fa-trash"></i>';
          del.onclick = e => { e.stopPropagation(); deleteFolder(fId); };
          
          const mv = document.createElement('div'); mv.className = 'ctrl-btn move'; mv.innerHTML = '<i class="fas fa-arrows-alt"></i>';
          mv.onclick = e => { e.stopPropagation(); openMoveModal('folder', f); };

          const hd = document.createElement('div'); hd.className = 'ctrl-btn hide';
          hd.innerHTML = isHidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
          hd.onclick = e => { e.stopPropagation(); toggleHide('folder', f); };

          card.appendChild(edt); card.appendChild(del); card.appendChild(mv); card.appendChild(hd);
        }
        setupLongPress(card, fId);
        card.onclick = () => {
          if (isReorderMode) return;
          if (isLocked && !isAdmin) return alert("Locked.");
          navStack.push({ name: f.name, folderId: fId }); folderId = fId;
          history.pushState({ stack: [...navStack], folderId, semester }, "", window.location.pathname + `?category=${CATEGORY}&semester=${semester}&folderId=${fId}&name=${encodeURIComponent(f.name)}`);
          updateBreadcrumb(); loadContent();
        };
        grid.appendChild(card);
      });

      items.forEach(item => {
        const title = item.title || item.subject || '';
        const isHidden = title.includes('[HIDDEN]');
        if (isHidden && !isAdmin) return;

        const card = mkCard('file', '<i class="fas fa-file-lines main-icon"></i>', title, item.id);
        
        if (isHidden) card.style.opacity = '0.5';

        card.onclick = () => {
          if (isReorderMode) return;
          const link = item.link || item.pdf || item.url || item.videoUrl;
          
          // v101.0: Redirect to appropriate internal viewer
          if (link) {
            const l = link.toLowerCase();
            if (l.includes('drive.google.com') || l.includes('docs.google.com/presentation') || l.endsWith('.pdf') || l.endsWith('.ppt') || l.endsWith('.pptx') || l.includes('youtube.com') || l.includes('youtu.be') || l.includes('photos.app.goo.gl')) {
                const viewer = (l.endsWith('.pdf') || l.endsWith('.ppt') || l.endsWith('.pptx') || l.includes('docs.google.com/presentation') || (l.includes('drive.google.com') && !l.includes('VIDEO') && !l.includes('MP4'))) 
                    ? 'pdf-viewer' 
                    : 'video-viewer';
                window.location.href = `/database/${viewer}?file=${encodeURIComponent(link)}&title=${encodeURIComponent(title)}`;
            } else {
                window.open(link, '_blank');
            }
          }
        };
        if (isAdmin) {
          const edit = document.createElement('div'); edit.className = 'ctrl-btn edit'; edit.innerHTML = '<i class="fas fa-edit"></i>';
          edit.onclick = e => { e.stopPropagation(); openEditModal(item); };
          
          const del = document.createElement('div'); del.className = 'ctrl-btn delete'; del.innerHTML = '<i class="fas fa-trash"></i>';
          del.onclick = e => { e.stopPropagation(); deleteItem(item.id); };

          const mv = document.createElement('div'); mv.className = 'ctrl-btn move'; mv.innerHTML = '<i class="fas fa-arrows-alt"></i>';
          mv.onclick = e => { e.stopPropagation(); openMoveModal('item', item); };

          const hd = document.createElement('div'); hd.className = 'ctrl-btn hide';
          hd.innerHTML = isHidden ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
          hd.onclick = e => { e.stopPropagation(); toggleHide('item', item); };

          card.appendChild(edit); card.appendChild(del); card.appendChild(mv); card.appendChild(hd);
        }
        grid.appendChild(card);
      });
      
      initSortable();
    }

    function initSortable() {
      const isAdmin = window.solmatesAPI.isAdminLoggedIn();
      if (!isAdmin || typeof Sortable === 'undefined') return;
      const grid = document.getElementById('grid');
      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = Sortable.create(grid, {
        animation: 150,
        handle: isReorderMode ? null : '.drag-handle',
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        forceFallback: true,
        onStart: () => { if (navigator.vibrate) navigator.vibrate(50); },
        onEnd: async () => {
          const cards = Array.from(grid.querySelectorAll('.card'));
          const folderIds = cards.filter(c => c.getAttribute('data-type') === 'folder').map(c => c.getAttribute('data-id'));
          const itemIds = cards.filter(c => c.getAttribute('data-type') === 'file').map(c => c.getAttribute('data-id'));
          
          try {
            const btn = document.getElementById('btnReorder');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            if (folderIds.length > 0) await window.solmatesAPI.reorderBulkSOL('folders', folderIds, semester);
            if (itemIds.length > 0) await window.solmatesAPI.reorderBulkSOL(CATEGORY, itemIds, semester);
            btn.innerHTML = original;
          } catch(e) { alert('Failed to save: ' + e.message); }
        }
      });
    }

    function toggleReorderMode() {
      isReorderMode = !isReorderMode;
      const btn = document.getElementById('btnReorder');
      if (isReorderMode) {
        btn.classList.add('active'); btn.innerHTML = '<i class="fas fa-check"></i> Done';
        document.body.classList.add('reorder-mode-active');
      } else {
        btn.classList.remove('active'); btn.innerHTML = '<i class="fas fa-arrows-alt"></i> Organize';
        document.body.classList.remove('reorder-mode-active');
      }
      initSortable();
    }

    function mkCard(type, icon, title, id) {
      const div = document.createElement('div'); div.className = `card ${type}`;
      div.setAttribute('data-id', id); div.setAttribute('data-type', type);
      div.innerHTML = `<div class="drag-handle"><i class="fas fa-grip-vertical"></i></div><div class="card-icon">${icon}</div><h3>${title}</h3>`;
      return div;
    }

    function jumpTo(index) {
      if (isNavigating) return;
      navStack = navStack.slice(0, index + 1);
      const target = navStack[navStack.length - 1];
      folderId = target.folderId;
      const targetName = encodeURIComponent(target.name);
      history.pushState({ stack: [...navStack], folderId, semester }, "", window.location.pathname + `?category=${CATEGORY}&semester=${semester}&folderId=${folderId || ''}&name=${targetName}`);
      updateBreadcrumb();
      loadContent();
    }

    function updateBreadcrumb() {
      const bc = document.getElementById('breadcrumb'); bc.style.display = 'flex'; bc.innerHTML = '';
      const home = document.createElement('span'); home.innerText = 'Database';
      home.onclick = () => { renderSemesters(); }; bc.appendChild(home);
      navStack.forEach((item, i) => {
        const sep = document.createElement('i'); sep.className = 'fas fa-chevron-right sep'; bc.appendChild(sep);
        const span = document.createElement('span'); span.innerText = item.name;
        if (i < navStack.length - 1) span.onclick = () => jumpTo(i);
        else span.className = 'current';
        bc.appendChild(span);
      });
    }

    async function createFolder() {
      const name = document.getElementById('folderName').value.trim();
      if (!name) return;
      try {
        await window.solmatesAPI.addSOLFolder({ name, category: CATEGORY, semester, parentId: folderId });
        closeModal('folderModal'); 
        document.getElementById('folderName').value = '';
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        window.location.reload();
      } catch (e) { alert(e.message); }
    }

    async function addLink() {
      const title = document.getElementById('linkTitle').value.trim(), url = document.getElementById('linkUrl').value.trim();
      if (!title || !url) return;
      const today = new Date().toISOString().split('T')[0];
      let data = { folderId, title, link: url, pdf: url, date: today, subject: title };
      try {
        if (editingItemId) await window.solmatesAPI.updateSOLItem(CATEGORY, semester, editingItemId, data);
        else await window.solmatesAPI.addSOLItem(CATEGORY, semester, data);
        closeModal('linkModal'); 
        document.getElementById('linkTitle').value = '';
        document.getElementById('linkUrl').value = '';
        editingItemId = null;
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        window.location.reload();
      } catch (e) { alert(e.message); }
    }

    function openEditModal(item) {
      editingItemId = item.id; document.getElementById('linkTitle').value = item.title || item.subject;
      document.getElementById('linkUrl').value = item.link || item.pdf || item.videoUrl || item.url; openModal('linkModal');
    }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function deleteFolder(id) { if (confirm('Delete?')) window.solmatesAPI.deleteSOLFolder(id).then(() => window.location.reload()); }
    function deleteItem(id) { if (confirm('Delete?')) window.solmatesAPI.deleteSOLItem(CATEGORY, semester, id).then(() => window.location.reload()); }
    function editFolderName(id, old) { const n = prompt('New name:', old); if (n) window.solmatesAPI.updateSOLFolder(id, { name: n }).then(() => window.location.reload()); }
    
    // -- Admin Move Logic --------------------------------------------------------
    let movingType = null;
    let movingEntity = null;

    function openMoveModal(type, entity) {
      movingType = type;
      movingEntity = entity;
      document.getElementById('moveSemester').value = String(semester || 1);
      openModal('moveModal');
      loadDestFolders();
    }

    async function loadDestFolders() {
      const sem = parseInt(document.getElementById('moveSemester').value);
      const folderSelect = document.getElementById('moveFolder');
      folderSelect.innerHTML = '<option value="">Semester Root (No Folder)</option>';
      try {
        const res = await window.solmatesAPI.getSOLFolders(CATEGORY, sem, null, true, true);
        const folders = (res && res.data) ? res.data : [];
        function buildFolderTree(list, parentId = null, depth = 0) {
          let optionsHtml = '';
          const children = list.filter(f => (f.parentId || null) === parentId);
          children.forEach(c => {
            if (movingType === 'folder' && c.id === movingEntity.id) return;
            const cleanName = c.name.replace(/\[FOLDER\]/gi, '').replace(/\[LOCKED\]/gi, '').replace(/\[HIDDEN\]/gi, '').trim();
            const prefix = '&nbsp;&nbsp;'.repeat(depth * 3) + (depth > 0 ? '+- ' : '');
            optionsHtml += `<option value="${c.id}">${prefix}${cleanName}</option>`;
            optionsHtml += buildFolderTree(list, c.id, depth + 1);
          });
          return optionsHtml;
        }
        folderSelect.innerHTML += buildFolderTree(folders, null, 0);
      } catch (e) { console.error(e); }
    }

    async function submitMove() {
      const targetSem = document.getElementById('moveSemester').value;
      const targetFolderId = document.getElementById('moveFolder').value || null;
      if (!confirm('Are you sure you want to move this item?')) return;
      try {
        if (movingType === 'folder') {
          await window.solmatesAPI.updateSOLFolder(movingEntity.id, { semester: parseInt(targetSem), parentId: targetFolderId });
        } else {
          let updatedItem = Object.assign({}, movingEntity);
          updatedItem.semester = parseInt(targetSem);
          updatedItem.folderId = targetFolderId;
          delete updatedItem.id;
          delete updatedItem._id;
          await window.solmatesAPI.updateSOLItem(CATEGORY, semester, movingEntity.id, updatedItem);
        }
        closeModal('moveModal');
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        window.location.reload();
      } catch (e) { alert('Move failed: ' + e.message); }
    }

    async function toggleHide(type, entity) {
      const isHidden = (type === 'folder' ? entity.name : (entity.title || entity.subject)).includes('[HIDDEN]');
      let newName = type === 'folder' ? entity.name : (entity.title || entity.subject);
      
      if (isHidden) {
        newName = newName.replace('[HIDDEN]', '').trim();
      } else {
        newName = newName.trim() + ' [HIDDEN]';
      }

      try {
        if (type === 'folder') {
          await window.solmatesAPI.updateSOLFolder(entity.id, { name: newName });
        } else {
          await window.solmatesAPI.updateSOLItem(CATEGORY, semester, entity.id, { title: newName, subject: newName });
        }
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        window.location.reload();
      } catch (e) { alert('Error: ' + e.message); }
    }
    
    // -- Long-Press Lock Logic ---------------------------------------------------
    function setupLongPress(card, fId) {
      if (!window.solmatesAPI.isAdminLoggedIn()) return;
      
      let holdTimer = null;
      let startX = 0;
      let startY = 0;

      const startHold = (e) => {
        if (isReorderMode) return;
        if (holdTimer) clearTimeout(holdTimer);
        
        if (e.touches && e.touches[0]) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
        
        card.classList.add('holding');
        holdTimer = setTimeout(async () => {
          try {
            await window.solmatesAPI.toggleSOLFolderLock(fId);
            window.location.reload();
          } catch (err) {
            alert('Lock failed: ' + err.message);
            stopHold();
          }
        }, 800);
      };
      
      const stopHold = () => {
        if (holdTimer) clearTimeout(holdTimer);
        card.classList.remove('holding');
      };
      
      const onTouchMove = (e) => {
        if (e.touches && e.touches[0]) {
          const dx = Math.abs(e.touches[0].clientX - startX);
          const dy = Math.abs(e.touches[0].clientY - startY);
          if (dx > 10 || dy > 10) stopHold();
        } else {
          stopHold();
        }
      };

      card.addEventListener('mousedown', startHold);
      card.addEventListener('touchstart', (e) => { startHold(e); }, { passive: true });
      card.addEventListener('mouseup', stopHold);
      card.addEventListener('mouseleave', stopHold);
      card.addEventListener('touchend', stopHold);
      card.addEventListener('touchcancel', stopHold);
      card.addEventListener('touchmove', onTouchMove, { passive: true });
    }

    window.onpopstate = function(event) {
      if (isNavigating) return;
      if (event.state) {
        navStack = event.state.stack || [];
        folderId = event.state.folderId || null;
        semester = event.state.semester || null;
        
        if (!semester) {
          renderSemesters(true); // true = don't push state
        } else {
          document.getElementById('pageDesc').innerText = `${CAT_LABELS[CATEGORY]} • Semester ${semester}`;
          updateBreadcrumb();
          loadContent();
        }
      } else {
        renderSemesters(true);
      }
    };

    async function renderSemesters(skipHistory = false) {
      semester = null; folderId = null; navStack = [];
      if (!skipHistory) {
        history.pushState({ stack: [], folderId: null, semester: null }, "", window.location.pathname + `?category=${CATEGORY}`);
      }
      document.getElementById('adminBar').style.display = 'none';
      document.getElementById('pageDesc').innerText = 'Select a semester to continue';
      document.getElementById('breadcrumb').style.display = 'none';
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'];
      const ordinal = ['1st', '2nd', '3rd', '4th'];
      for (let s = 1; s <= 4; s++) {
        const card = document.createElement('div');
        card.className = 'card sem';
        card.innerHTML = `<div style="width:60px;height:60px;background:${colors[s - 1]};color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;">${s}</div>
                      <div><h3>${ordinal[s - 1]} Semester</h3><p style="font-size:12px;color: var(--text-muted);margin-top:4px;">View Subjects</p></div>`;
        card.onclick = () => onSemesterClick(s);
        grid.appendChild(card);
      }
    }

    init();
  </script>
