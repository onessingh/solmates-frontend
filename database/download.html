<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q6GVS9XX1M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Q6GVS9XX1M');
  </script>

  <!-- Google AdSense Auto Ads (Vignette & Interstitial Support) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8498686057506423" crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Download Document - SOLMATES</title>
  
  <link rel="icon" href="/favicon.ico?v=v899" type="image/x-icon">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=v899">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .dl-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin: auto 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }
      .dl-card {
        padding: 20px 8px;
        border-radius: 16px;
      }
    }

    .file-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
    }

    .file-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      padding: 0 8px;
      word-break: break-word;
    }

    .timer-wrap {
      margin: 12px 8px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .timer-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .timer-count {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      display: block;
      margin-top: 4px;
    }

    .dl-action-btn {
      display: none;
      width: calc(100% - 16px);
      margin: 0 8px;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .dl-action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    .ad-container {
      width: 100%;
      margin: 16px 0 8px 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .ad-container .sol-ad-banner {
      width: 100% !important;
      max-width: 100% !important;
      overflow: hidden !important;
      border-radius: 12px !important;
      background: #0b1120 !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      padding: 8px 0 !important;
      margin: 0 !important;
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/" class="brand">
      <img src="/favicon.ico?v=v899" alt="Solmates">
      <span>SOLMATES</span>
    </a>
    <a href="javascript:history.back()" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>

  <main class="dl-card">
    <div class="file-icon" id="fileIcon">
      <i class="fas fa-file-pdf"></i>
    </div>
    <h1 class="file-title" id="docTitle">Loading Document...</h1>

    <!-- 5-Second Countdown Timer -->
    <div class="timer-wrap" id="timerSection">
      <span class="timer-text" id="statusMessage">Your secure download will begin in</span>
      <span class="timer-count" id="countdownSec">5</span>
    </div>

    <!-- Ready Download Button (Shows after countdown) -->
    <button class="dl-action-btn" id="manualDownloadBtn" onclick="triggerDownload()">
      <i class="fas fa-download"></i>
      <span>Download Now</span>
    </button>

    <!-- AdSense In-Page Ad (100% Policy Compliant) -->
    <div class="ad-container">
      <div class="sol-ad-banner">
        <div class="ad-label" style="color: #64748b;">ADVERTISEMENT</div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-8498686057506423"
             data-ad-slot="8194517845"
             data-ad-format="auto"
             data-full-width-responsive="false"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>

    <p class="footer-note">Free educational resource powered by Solmates</p>
  </main>

  <div style="height: 10px;"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawUrl = params.get('file');
    const docTitle = params.get('title') || 'Document';

    if (rawUrl) {
      document.getElementById('docTitle').textContent = docTitle;
      const lowerUrl = rawUrl.toLowerCase();
      const lowerTitle = docTitle.toLowerCase();
      if (lowerUrl.includes('.ppt') || lowerTitle.includes('.ppt') || lowerUrl.includes('presentation')) {
        document.getElementById('fileIcon').innerHTML = '<i class="fas fa-file-powerpoint"></i>';
      }
    } else {
      document.getElementById('docTitle').textContent = 'No file specified';
      document.getElementById('statusMessage').textContent = 'Invalid file link. Please go back.';
      document.getElementById('countdownSec').style.display = 'none';
    }

    let timeLeft = 5;
    const timerElem = document.getElementById('countdownSec');
    const manualBtn = document.getElementById('manualDownloadBtn');
    const statusMsg = document.getElementById('statusMessage');

    const countdownInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElem.textContent = timeLeft;
      } else {
        clearInterval(countdownInterval);
        timerElem.style.display = 'none';
        statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#22c55e;"></i> Ready! Starting download...';
        manualBtn.style.display = 'inline-flex';
        triggerDownload();
      }
    }, 1000);

    async function triggerDownload() {
      if (!rawUrl) return;
      manualBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Downloading...</span>';

      const lowerUrl = rawUrl.toLowerCase();
      const lowerTitle = docTitle.toLowerCase();
      let isSlides = false;
      let downloadUrl = rawUrl;

      if (lowerUrl.includes('docs.google.com/presentation/d/')) {
        isSlides = true;
        const pptMatch = rawUrl.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
        if (pptMatch && pptMatch[1]) downloadUrl = `https://docs.google.com/presentation/d/${pptMatch[1]}/export/pptx`;
      } else if (lowerUrl.includes('drive.google.com') && (lowerUrl.includes('.ppt') || lowerTitle.includes('.ppt'))) {
        isSlides = true;
        const driveMatch = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) downloadUrl = `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
      } else if (lowerUrl.includes('drive.google.com')) {
        const fileId = rawUrl.match(/[-\w]{25,}/);
        if (fileId) downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId[0]}`;
      }

      if (isSlides) {
        const a = document.createElement('a');
        a.href = downloadUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        manualBtn.innerHTML = '<i class="fas fa-redo"></i> <span>Download Again</span>';
        return;
      }

      try {
        const response = await fetch(downloadUrl);
        if (!response.ok) throw new Error('Fetch failed');
        const blob = await response.blob();
        const bUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = bUrl;
        a.download = `${docTitle.replace(/[^a-z0-9]/gi, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(bUrl);
        manualBtn.innerHTML = '<i class="fas fa-redo"></i> <span>Download Again</span>';
      } catch (err) {
        // Fallback direct link
        window.open(downloadUrl, '_blank');
        manualBtn.innerHTML = '<i class="fas fa-redo"></i> <span>Download Again</span>';
      }
    }
  </script>
</body>
</html>
