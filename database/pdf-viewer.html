<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();

<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

  <script>
    function showToast(msg, type = 'info', duration = 3000, action = null) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let icon = 'fa-info-circle';
      if (type === 'success') icon = 'fa-check-circle';
      if (type === 'downloading') icon = 'fa-spinner fa-spin';

      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${msg}</span>
        ${action ? `<a href="${action.url}" target="_blank" class="drive-btn">${action.text}</a>` : ''}
      `;
      
      container.appendChild(toast);
      if (duration > 0) {
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-20px)';
          setTimeout(() => toast.remove(), 500);
        }, duration);
      }
      return toast;
    }

    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.hostname)) {
        window.history.back();
      } else {
        window.location.href = '/database';
      }
    }

    async function handleDownload() {
      const params = new URLSearchParams(window.location.search);
      const rawUrl = params.get('file');
      const title = params.get('title') || 'Document';
      
      if (!rawUrl) return;

      const btn = document.getElementById('dlBtn');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Downloading...</span>';
      btn.style.pointerEvents = 'none';

      // Detect extension based on rawUrl and title
      let isSlides = false;
      let extension = 'pdf';
      let downloadUrl = '';

      const lowerUrl = rawUrl.toLowerCase();
      const lowerTitle = title.toLowerCase();

      if (lowerUrl.includes('docs.google.com/presentation/d/')) {
        isSlides = true;
        extension = 'pptx';
        const pptMatch = rawUrl.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
        if (pptMatch && pptMatch[1]) {
          downloadUrl = `https://docs.google.com/presentation/d/${pptMatch[1]}/export/pptx`;
        }
      } else if (lowerUrl.includes('drive.google.com') && (lowerUrl.includes('.ppt') || lowerUrl.includes('.pptx') || lowerTitle.includes('.ppt') || lowerTitle.includes('.pptx'))) {
        isSlides = true;
        extension = lowerUrl.includes('.ppt') ? 'ppt' : 'pptx';
        if (lowerTitle.includes('.pptx')) extension = 'pptx';
        else if (lowerTitle.includes('.ppt')) extension = 'ppt';

        const driveMatch = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (driveMatch && driveMatch[1]) {
          downloadUrl = `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
        }
      } else if (lowerUrl.endsWith('.ppt') || lowerUrl.endsWith('.pptx')) {
        isSlides = true;
        extension = lowerUrl.endsWith('.ppt') ? 'ppt' : 'pptx';
        downloadUrl = rawUrl;
      }

      if (isSlides) {
        const loadingToast = showToast("Downloading PowerPoint...", "downloading", 0);
        
        // Direct anchor download for PowerPoint to bypass CORS limitations gracefully
        const a = document.createElement('a');
        a.href = downloadUrl;
        // Removed target='_blank' to prevent the screen from flashing black on mobile during download
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        setTimeout(() => {
          btn.innerHTML = original;
          btn.style.pointerEvents = 'auto';
          loadingToast.remove();
          showToast("PowerPoint Downloaded!", "success", 6000);
        }, 1500);
        return;
      }

      const loadingToast = showToast("Downloading PDF...", "downloading", 0);

      try {
        const config = window.solmatesConfig || { BACKEND_URL: 'https://solmates-backend-w27e.onrender.com' };
        let proxyDownloadUrl = `${config.BACKEND_URL}/api/media/download/pdf?url=${encodeURIComponent(rawUrl)}&title=${encodeURIComponent(title)}`;
        
        // Use Fetch to verify the stream and track completion
        const response = await fetch(proxyDownloadUrl);
        if (!response.ok) throw new Error("Server error");

        const blob = await response.blob();
        const bUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = bUrl;
        a.download = `${title.replace(/[^a-z0-9]/gi, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();
        
        loadingToast.remove();
        
        // Finalized PDF view URL for "Open with Drive"
        const driveUrl = rawUrl.includes('drive.google.com') ? rawUrl : `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}`;

        showToast("PDF Downloaded!", "success", 6000, {
          text: "OPEN WITH DRIVE",
          url: driveUrl
        });

      } catch (err) {
        console.warn("Direct fetch failing, using fallback", err);
        loadingToast.remove();
        
        // Absolute Fallback: Send user directly to raw URL if proxy fails
        const fallbackA = document.createElement('a');
        fallbackA.href = rawUrl;
        fallbackA.target = '_blank'; // For raw URLs, open in new tab to let native handlers take over
        document.body.appendChild(fallbackA);
        fallbackA.click();
        document.body.removeChild(fallbackA);
        
        const driveUrl = rawUrl.includes('drive.google.com') ? rawUrl : `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}`;
        showToast("Download Initialized!", "success", 6000, {
          text: "OPEN WITH DRIVE",
          url: driveUrl
        });
      } finally {
        setTimeout(() => {
          btn.innerHTML = original;
          btn.style.pointerEvents = 'auto';
        }, 3000);
      }
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const rawUrl = params.get('file');
      const title = params.get('title') || 'Document View';
      
      document.getElementById('fileTitle').innerText = title;
      document.title = title + ' | SOLMATES';

      if (!rawUrl) {
        showError('No file link provided.');
        return;
      }

      const finalUrl = transformDriveLink(decodeURIComponent(rawUrl));
      const frame = document.getElementById('pdfFrame');
      
      // Dynamically apply cropping class and toggle secure transparent blocker based on final URL type
      if (finalUrl.includes('drive.google.com') || finalUrl.includes('docs.google.com/presentation')) {
        frame.className = 'drive-preview';
        document.getElementById('iframeBlocker').style.display = 'block';
      } else {
        frame.className = 'docs-viewer';
        document.getElementById('iframeBlocker').style.display = 'none';
      }
      
      frame.onload = function() {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
        }, 500);
      };

      // Fallback for load detection - extended for large files
      setTimeout(() => {
        if (document.getElementById('loading').style.display !== 'none') {
          document.getElementById('loading').style.opacity = '0';
          setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
        }
      }, 8000);

      frame.src = finalUrl;
    }



    function transformDriveLink(url) {
      // 1. If it's already a docs viewer, leave it
      if (url.includes('docs.google.com/viewer')) return url;

      // 2. Extract Google Slides / Presentation links and render in the 100% stable native Google Drive Preview format (Never Edit View!)
      if (url.includes('docs.google.com/presentation/d/')) {
        const pptMatch = url.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
        if (pptMatch && pptMatch[1]) {
          return `https://drive.google.com/file/d/${pptMatch[1]}/preview`;
        }
      }

      // 3. Extract File ID for standard Drive Links (PDF, binary .ppt/.pptx, etc.)
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        const fileId = driveMatch[1];
        // Render Google Drive files using native Drive Preview format for absolute stability
        return `https://drive.google.com/file/d/${fileId}/preview`;
      }

      // 4. Fallback: Google Docs Viewer for other documents
      return `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true&chrome=false`;
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('pdfFrame').style.display = 'none';
      document.getElementById('errorState').style.display = 'flex';
      document.getElementById('errorMsg').innerText = msg;
    }

    window.onload = init;
  </script>
