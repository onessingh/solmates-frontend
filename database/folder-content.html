<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();

      if (fromParam) return fromParam;
      const path = window.location.pathname.toLowerCase();
      if (path.includes('/pyqs') || path.includes('/pyq')) return 'pyqs';
      if (path.includes('/notes')) return 'notes';
      if (path.includes('/oneshot')) return 'oneshot';
      if (path.includes('/professor')) return 'professor';
      if (path.includes('/youtube')) return 'youtube';
      if (path.includes('/elearning') || path.includes('/ebooks')) return 'elearning';
      if (path.includes('/classes')) return 'live-classes';
      return 'notes';

        } catch (e) {

        }
      }

      const isAdmin = window.solmatesAPI && window.solmatesAPI.isAdminLoggedIn();

      const titleEl = document.getElementById('pageTitle');
      if (titleEl) {
        if (isEBook || CATEGORY === 'youtube') {
          const icon = isEBook ? 'fa-book' : 'fa-play-circle';

          if (CATEGORY.startsWith('hc-')) displayTitle = 'Healthcare ' + displayTitle;
          titleEl.innerHTML = `<i class="fas ${icon}" style="color:var(--accent)"></i> ${displayTitle}`;
          document.getElementById('pageSub').innerText = `${label} • ${ordinals[SEMESTER] || SEMESTER} Semester`;
        } else {
          let displayTitle = FOLDER_NAME;
          if (CATEGORY.startsWith('hc-')) displayTitle = 'Healthcare ' + displayTitle;
          titleEl.innerText = displayTitle;
          let catLabel = CAT_LABELS[CATEGORY] || CATEGORY;
          document.getElementById('pageSub').innerText = `${catLabel} • ${ordinals[SEMESTER] || SEMESTER} Semester`;
        }
      }
      buildBreadcrumb();

      const noContent = params.get('noContent') === 'true';

      if (isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        if (document.getElementById('adminIndicator')) document.getElementById('adminIndicator').classList.add('active');

        if (isEBook || CATEGORY === 'youtube') {
          document.getElementById('btnNewFolderSubject').style.display = 'inline-flex';
          document.getElementById('btnNewFolderGeneric').style.display = 'inline-flex';
          document.getElementById('btnNewFolderDefault').style.display = 'none';
          document.getElementById('btnNewLink').style.display = 'none';
          document.getElementById('btnToggleOther').style.display = 'inline-flex';

          if (isEBook) {
            const tabs = document.getElementById('elearningTabs');
            if (tabs) tabs.classList.add('visible');
            if (!otherVisible) {
              otherVisible = false;
            } else {
              otherVisible = localStorage.getItem(`elearning_other_visible_${FOLDER_ID}`) !== 'false';
            }
            updateOtherUISettings();
          }

          if (CATEGORY === 'youtube') {
            document.getElementById('btnNewFolderSubject').innerHTML = '<i class="fas fa-play-circle"></i> Add Subject';
          }
        } else {
          // Non-elearning: show generic folder + link buttons
          document.getElementById('btnNewFolderDefault').style.display = 'inline-flex';
          document.getElementById('btnNewLink').style.display = 'inline-flex';
          document.getElementById('btnNewFolderSubject').style.display = 'none';
          document.getElementById('btnNewFolderGeneric').style.display = 'none';
        }
      } else {
        if (isEBook || CATEGORY === 'youtube') {
          const tabs = document.getElementById('elearningTabs');
          if (tabs) tabs.classList.toggle('visible', isEBook);
          if (isEBook) {
            if (!otherVisible) {
              otherVisible = false;
            } else {
              otherVisible = localStorage.getItem(`elearning_other_visible_${FOLDER_ID}`) !== 'false';
            }
            updateOtherUISettings();
          }

      if (noContent && !isAdmin) {
        document.getElementById('grid').innerHTML = `
        <div class="empty">
          <i class="fas fa-folder-open"></i>
          <strong>No Content Available</strong>
          <br><small>Content for this subject has not been uploaded yet. Please check back later.</small>
        </div>`;
        return;
      }

      if (noContent && isAdmin) {
        document.getElementById('grid').innerHTML = `
        <div class="empty">
          <i class="fas fa-folder-plus"></i>
          <strong>Empty Subject</strong>
          <br><small>Use the buttons above to create folders or add links in this subject.</small>
        </div>`;
        return;
      }

      const urlTab = params.get('tab');
      if (urlTab === 'other' || urlTab === 'sol') {
        currentTab = urlTab;
        const tabSol = document.getElementById('tabSol');
        const tabOther = document.getElementById('tabOther');
        if (tabSol) tabSol.classList.toggle('active', currentTab === 'sol');
        if (tabOther) tabOther.classList.toggle('active', currentTab === 'other');
      }

      loadContent();
    }

    async function loadContent() {
      if (isReorderMode) return;
      const isAdmin = window.solmatesAPI && window.solmatesAPI.isAdminLoggedIn();

      // Use shared cache keys like elearning-subjects for instant switching
      const fKey = `folders_${CATEGORY}_${SEMESTER}_${FOLDER_ID || 'root'}`;
      const iKey = isEBook ? `content_${CATEGORY}_${SEMESTER}_all` : `content_${CATEGORY}_${SEMESTER}_${FOLDER_ID}`;

      // Step 1: Instant Cache Render (Solid)
      const cFolders = window.solmatesAPI ? window.solmatesAPI.getCache(fKey) : null;
      const cItems = window.solmatesAPI ? window.solmatesAPI.getCache(iKey) : null;

      if (cFolders || cItems) {
        renderGridSafe(cFolders?.data || [], cItems?.data || [], isAdmin, true);
      } else {
        // Only show text if absolutely no cache exists
        document.getElementById('grid').innerHTML = '<div class="empty">Loading...</div>';
      }

      try {
        // Step 2: Background Refresh (Silent)
        const [fRes, iRes] = await Promise.all([
          window.solmatesAPI.getSOLFolders(CATEGORY, SEMESTER, FOLDER_ID, true).catch(() => null),
          isEBook
            ? window.solmatesAPI.getSOLContent(CATEGORY, SEMESTER, 'all', true).catch(() => null)
            : window.solmatesAPI.getSOLContent(CATEGORY, SEMESTER, FOLDER_ID, true).catch(() => null)
        ]);

        if (fRes?.data || iRes?.data) {
          renderGridSafe(fRes?.data || [], iRes?.data || [], isAdmin);
        }
      } catch (err) {
        console.warn('Refresh fail:', err);
      } finally {
        isNavigating = false;
      }
    }

    function renderGridSafe(folders, allItems, isAdmin, isStale = false) {
      const grid = document.getElementById('grid');
      if (!grid) return;
      const esc = s => (s && typeof s === 'string') ? s.replace(/"/g, '&quot;') : (s?.name || '');

      // Universal Tab Filtering (Works for eBooks & Dataset)
      const items = allItems.filter(x => {
        if (x.bookType) return x.bookType === currentTab;
        const name = (x.name || x.title || x.subject || '').toUpperCase();
        const isOther = name.includes('[OTHER]');
        return currentTab === 'other' ? isOther : !isOther;
      });

      const filteredFolders = folders.filter(f => {
        const isOther = (f.name || '').includes('[OTHER]');
        return currentTab === 'other' ? isOther : !isOther;
      });

      // CRITICAL: Hold previous tab state during switch to prevent 0.1s flicker
      if (isStale && filteredFolders.length === 0 && items.length === 0) return;

      const frag = document.createDocumentFragment();

      if (filteredFolders.length === 0 && items.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty';
        emptyDiv.innerText = 'No books added in this tab yet.';
        frag.appendChild(emptyDiv);
        grid.replaceChildren(frag);
        return;
      }

      // Folders
      filteredFolders.forEach(f => {
        try {
          const sName = f.name || '(unnamed)';
          const isHidden = sName.includes('[HIDDEN]');
          if (isHidden && !isAdmin) return;

          const isGeneric = sName.includes('[FOLDER]');
          const isSubject = !isGeneric && (isEBook || CATEGORY === 'youtube');
          const displayName = sName.replace(/\[LOCKED\]/gi, '').replace(/\[FOLDER\]/gi, '').replace(/\[OTHER\]/gi, '').replace(/\[HIDE_OTHER\]/gi, '').replace(/\[HIDDEN\]/gi, '').trim() || '(unnamed)';
          const upperDispName = displayName.toUpperCase();

          const bookItem = isEBook ? items.find(i => {
            if (String(i.folderId || '') === String(f.id)) return true;
            return (i.subject || i.title || '').trim().toUpperCase() === upperDispName;
          }) : null;

          const bookLink = bookItem ? (bookItem.pdf || bookItem.link) : null;
          const mainIconClass = isSubject ? (isEBook ? 'fa-book' : 'fa-play-circle') : 'fa-folder';

          const card = document.createElement('div');
          card.className = `subject-card ${!isSubject ? 'centered-folder' : ''}`;
          card.setAttribute('data-id', f.id);
          card.setAttribute('data-type', 'folder');

          card.innerHTML = `
            ${isAdmin ? `<div class="edit-btn" onclick="event.stopPropagation(); window.editFolderName('${f.id}', '${esc(f.name)}')"><i class="fas fa-pencil-alt"></i></div>` : ''}
            ${isAdmin ? `<div class="btn-del-folder" onclick="event.stopPropagation(); window.deleteFolder('${f.id}', '${esc(f.name)}')"><i class="fas fa-trash"></i></div>` : ''}
            ${isAdmin ? `<div class="edit-btn" style="left:58px; background:rgba(100,116,139,0.9);" onclick="event.stopPropagation(); window.toggleHide('folder', '${f.id}', '${esc(f.name)}')"><i class="fas ${isHidden ? 'fa-eye-slash' : 'fa-eye'}"></i></div>` : ''}
            <div style="display:flex; align-items:center; width:100%; margin-bottom:12px; gap:8px">
                ${isAdmin ? '<div class="drag-handle">??</div>' : ''}
                <div class="subject-name" style="flex:1; ${isHidden ? 'opacity:0.5;' : ''}">
                    <i class="fas ${mainIconClass}"></i>
                    <h3 style="margin:0">${displayName}</h3>
                </div>
            </div>
            ${isEBook && !isGeneric ? `
              <a ${bookLink ? `href="javascript:void(0)" onclick="event.stopPropagation(); window.openViewer('${esc(bookLink)}', '${esc(displayName)}');"` : ''} class="book-link-btn ${!bookLink ? 'not-available' : ''}">
                <i class="fas ${bookLink ? 'fa-file-pdf' : 'fa-times-circle'}"></i> ${bookLink ? 'Read Book' : 'Not Available'}</a>
            ` : ''}
            ${isAdmin && !isGeneric ? `
              <div class="admin-controls visible">
                <input type="text" class="admin-input" placeholder="Paste Book Link" value="${bookLink || ''}" onclick="event.stopPropagation()">
                <button class="btn-save" data-subject="${esc(displayName)}" data-fid="${f.id}" onclick="event.stopPropagation(); window.saveSubjectLink(this)"><i class="fas fa-save"></i> Save</button>
              </div>
            ` : ''}
        `;

          card.onclick = (e) => {
            if (isNavigating || isReorderMode || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('a')) return;
            if (isSubject && bookLink) { window.openViewer(bookLink, displayName); return; }
            isNavigating = true; card.classList.add('navigating');
            setTimeout(() => {
              window.location.href = `/database/folder-content.html?category=${CATEGORY}&semester=${SEMESTER}&folderId=${f.id}&name=${encodeURIComponent(f.name)}&parentName=${encodeURIComponent(FOLDER_NAME)}`;
            }, 150);
          };
          frag.appendChild(card);
        } catch (err) { }
      });

      // Items
      items.forEach(item => {
        if (CATEGORY.includes('elearning') && item.folderId) return;
        try {
          const rawTitle = item.title || item.subject || '(untitled)';
          const isHidden = rawTitle.includes('[HIDDEN]');
          if (isHidden && !isAdmin) return;
          
          const displayTitle = rawTitle.replace('[OTHER]', '').replace('[HIDDEN]', '').trim();
          const itemLink = item.link || item.pdf || item.url || (item.attachments?.[0]?.url);

          const card = document.createElement('div');
          card.className = 'subject-card item';
          if (isHidden) card.style.opacity = '0.5';
          card.setAttribute('data-id', item.id);
          card.setAttribute('data-type', 'item');
          card.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px; width:100%">
            ${isAdmin ? '<div class="drag-handle">??</div>' : ''}
            <i class="fas fa-file-alt" style="font-size:32px; color:#3b82f6"></i>
            <h3 style="flex:1; margin:0">${displayTitle}</h3>
          </div>
          ${isAdmin ? `<div class="btn-del-folder" onclick="event.stopPropagation(); window.deleteItem('${item.id}', '${esc(displayTitle)}')"><i class="fas fa-trash"></i></div>` : ''}
          ${isAdmin ? `<div class="edit-btn" style="background:rgba(100,116,139,0.9);" onclick="event.stopPropagation(); window.toggleHide('item', '${item.id}', '${esc(rawTitle)}')"><i class="fas ${isHidden ? 'fa-eye-slash' : 'fa-eye'}"></i></div>` : ''}
        `;
          card.onclick = () => { if (!isReorderMode && itemLink) window.openViewer(itemLink, displayTitle); };
          frag.appendChild(card);
        } catch (err) { }
      });

      grid.replaceChildren(frag);
      if (isAdmin) initSortable();
    }

    function initSortable() {
      const isAdmin = window.solmatesAPI && window.solmatesAPI.isAdminLoggedIn();
      if (!isAdmin || typeof Sortable === 'undefined') return;
      const grid = document.getElementById('grid');
      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = Sortable.create(grid, {
        animation: 150,
        handle: isReorderMode ? null : '.drag-handle',
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        forceFallback: true,
        fallbackOnBody: true,
        touchStartThreshold: 5,
        onStart: function () { if (navigator.vibrate) navigator.vibrate(50); },
        onEnd: async function () {
          try {
            const btn = document.getElementById('btnReorder');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const grid = document.getElementById('grid');
            const cards = Array.from(grid.querySelectorAll('.subject-card'));
            const foldersOrder = [];
            const itemsOrder = [];

            cards.forEach((card, index) => {
              const id = card.getAttribute('data-id');
              const type = card.getAttribute('data-type');
              if (type === 'folder') foldersOrder.push({ id, order: index });
              else itemsOrder.push({ id, order: index });
            });

            if (foldersOrder.length > 0) await window.solmatesAPI.reorderBulkSOL('folder', foldersOrder, SEMESTER);
            if (itemsOrder.length > 0) await window.solmatesAPI.reorderBulkSOL(CATEGORY, itemsOrder, SEMESTER);

            if (window.solmatesAPI && window.solmatesAPI._cacheClear) {
              window.solmatesAPI._cacheClear('');
            }
            btn.innerHTML = originalText;
          } catch (err) {
            alert('Sort failed: ' + err.message);
            init(); // Revert on failure
          }
        }
      });
    }

    // FIX 4: toggleReorderMode now adds class to body (same as elearning-subjects)
    function toggleReorderMode() {
      isReorderMode = !isReorderMode;
      const btn = document.getElementById('btnReorder');
      const container = document.body;

      if (isReorderMode) {
        btn.classList.add('active');
        btn.innerHTML = '<i class="fas fa-check"></i> Done';
        container.classList.add('reorder-mode-active');
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<i class="fas fa-arrows-alt"></i> Organize';
        container.classList.remove('reorder-mode-active');
      }

      initSortable();
    }

    window.editFolderName = async function (id, oldName) {
      const cleanOldName = oldName.replace(/\[FOLDER\]/gi, '').replace(/\[LOCKED\]/gi, '').replace(/\[OTHER\]/gi, '').replace(/\[HIDE_OTHER\]/gi, '').trim();
      const newName = prompt('Enter new folder name:', cleanOldName);
      if (!newName || newName.trim() === cleanOldName) return;
      try {
        let finalName = newName.trim();
        if (oldName.includes('[FOLDER]')) finalName += ' [FOLDER]';
        if (oldName.includes('[OTHER]')) finalName += ' [OTHER]';
        if (oldName.includes('[LOCKED]')) finalName += ' [LOCKED]';
        if (oldName.includes('[HIDE_OTHER]')) finalName += ' [HIDE_OTHER]';
        await window.solmatesAPI.updateSOLFolder(id, { name: finalName });
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        await loadContent();
      } catch (e) { alert('Error: ' + e.message); }
    };

    let activeModalType = 'subject';
    function openModal(id, type = 'subject') {
      activeModalType = type;
      if (id === 'folderModal') {
        document.querySelector('#folderModal h2').innerHTML = type === 'subject'
          ? '<i class="fas fa-book-medical"></i> New Subject'
          : '<i class="fas fa-folder-plus"></i> New Folder';
      }
      document.getElementById(id).classList.add('open');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    async function createFolder() {
      const name = document.getElementById('folderName').value.trim();
      if (!name) return alert('Enter name.');
      try {
        let folderName = name;
        if (activeModalType === 'folder' && !folderName.includes('[FOLDER]')) folderName += ' [FOLDER]';
        if (CATEGORY.includes('elearning') && currentTab === 'other') folderName += ' [OTHER]';
        await window.solmatesAPI.addSOLFolder({ name: folderName, category: CATEGORY, semester: SEMESTER, parentId: FOLDER_ID });
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        closeModal('folderModal');
        document.getElementById('folderName').value = '';
        window.location.reload();
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function addLink() {
      const titleVal = document.getElementById('linkTitle').value.trim();
      const url = document.getElementById('linkUrl').value.trim();
      if (!titleVal || !url) return alert('Fill all fields.');
      let title = titleVal;
      if (CATEGORY.includes('elearning') && currentTab === 'other') title += ' [OTHER]';
      const today = new Date().toISOString().slice(0, 10);
      let data = { folderId: FOLDER_ID, title, link: url, pdf: url, date: today, subject: title };
      try {
        await window.solmatesAPI.addSOLItem(CATEGORY, SEMESTER, data);
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        closeModal('linkModal');
        document.getElementById('linkTitle').value = '';
        document.getElementById('linkUrl').value = '';
        window.location.reload();
      } catch (e) { alert('Error: ' + e.message); }
    }

    window.toggleHide = async function(type, id, oldName) {
      const isHidden = oldName.includes('[HIDDEN]');
      let newName = oldName;
      if (isHidden) newName = newName.replace('[HIDDEN]', '').trim();
      else newName = newName.trim() + ' [HIDDEN]';
      try {
        if (type === 'folder') await window.solmatesAPI.updateSOLFolder(id, { name: newName });
        else await window.solmatesAPI.updateSOLItem(CATEGORY, SEMESTER, id, { title: newName, subject: newName });
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        window.location.reload();
      } catch(e) { alert(e.message); }
    };

      try {
        await window.solmatesAPI.deleteSOLFolder(id);
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        await loadContent();
      } catch (e) { alert('Error: ' + e.message); }

    async function deleteItem(id, name = 'this item') {
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        await window.solmatesAPI.deleteSOLItem(CATEGORY, SEMESTER, id);
        if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');

    function switchTab(tab) {
      if (isNavigating) return;
      currentTab = tab;
      document.getElementById('tabSol').classList.toggle('active', tab === 'sol');
      document.getElementById('tabOther').classList.toggle('active', tab === 'other');
      loadContent();

    async function toggleOtherVisibility() {
      otherVisible = !otherVisible;
      localStorage.setItem(`elearning_other_visible_${FOLDER_ID}`, otherVisible);
      const isAdmin = window.solmatesAPI && window.solmatesAPI.isAdminLoggedIn();
      if (isAdmin && FOLDER_ID) {
        try {
          const marker = ' [HIDE_OTHER]';
          const actualOldName = await (async () => {
            const fRes = await window.solmatesAPI.getSOLFolders(CATEGORY, SEMESTER, null, true, true);
            const folderList = (fRes && fRes.data) ? fRes.data : [];
            const currentFolder = folderList.find(f => f.id === FOLDER_ID);
            return currentFolder ? currentFolder.name : FOLDER_NAME;
          })();
          let newName = actualOldName.replace(/\[HIDE_OTHER\]/gi, '').replace(/\s+/g, ' ').trim();
          if (!otherVisible) newName += marker;

          // Update server
          await window.solmatesAPI.updateSOLFolder(FOLDER_ID, { name: newName });
          if (window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');

          // Update local state and URL for consistency
          FOLDER_NAME = newName;
          const newUrl = new URL(window.location);
          newUrl.searchParams.set('name', newName);
          window.history.pushState({}, '', newUrl);

          // Update UI immediately
          buildBreadcrumb();
          const titleEl = document.getElementById('pageTitle');
          if (titleEl) {
            const icon = isEBook ? 'fa-book' : 'fa-play-circle';
            const cleanName = FOLDER_NAME.replace('[HIDE_OTHER]', '').trim();
            let displayTitle = cleanName;
            if (CATEGORY.startsWith('hc-')) {
              displayTitle = 'Healthcare ' + displayTitle;
            }
            titleEl.innerHTML = `<i class="fas ${icon}" style="color:var(--accent)"></i> ${displayTitle}`;
          }
        } catch (e) {
          console.error(e);
          alert("Failed to update visibility: " + e.message);
        }
      }
      updateOtherUISettings();
      if (!otherVisible && currentTab === 'other') switchTab('sol');
      else loadContent(); // Refresh to apply filters immediately
    }

    function updateOtherUISettings() {
      const btn = document.getElementById('btnToggleOther');
      const tab = document.getElementById('tabOther');
      if (btn) btn.innerHTML = otherVisible ? '<i class="fas fa-eye-slash"></i> Hide Other Books' : '<i class="fas fa-eye"></i> Show Other Books';
      if (tab) tab.classList.toggle('hidden', !otherVisible);
    };

    window.saveSubjectLink = async function (btn) {
      const subjectName = btn.getAttribute('data-subject');
      const folderId = btn.getAttribute('data-fid');
      const input = btn.closest('.admin-controls').querySelector('.admin-input');
      let link = input.value.trim();

      if (!link) return alert('Pehle link paste karein.');

      // Auto-fix protocol if missing (Prevents API validation errors)
      if (link && !link.startsWith('http') && !link.startsWith('mailto:')) {
        link = 'https://' + link;
      }

      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        if (window.solmatesAPI && window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');

        const iRes = await window.solmatesAPI.getSOLContent(CATEGORY, SEMESTER, folderId || 'all');
        const existing = (iRes?.data || []).filter(i =>
          String(i.folderId) === String(folderId) ||
          (i.subject || i.title || '').trim().toUpperCase() === subjectName.trim().toUpperCase()
        );

        for (const item of existing) { await window.solmatesAPI.deleteSOLItem(CATEGORY, SEMESTER, item.id); }

        let finalTitle = subjectName;
        if (currentTab === 'other') finalTitle += ' [OTHER]';

        const payload = {
          title: finalTitle,
          subject: subjectName,
          pdf: link,
          link: link,
          folderId: folderId,
          bookType: currentTab
        };

        const result = await window.solmatesAPI.addSOLItem(CATEGORY, SEMESTER, payload);

        if (!result || !result.success) {
          throw new Error(result?.error || 'API returned failure');
        }

        if (window.solmatesAPI && window.solmatesAPI._cacheClear) window.solmatesAPI._cacheClear('');
        await loadContent();
      } catch (e) {
        alert('Save nahi ho paya:\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    };

    window.openViewer = function (link, title) {
      if (!link) return;
      const l = link.toLowerCase();
      // v101.0: Redirect to appropriate internal viewer
      if (l.includes('drive.google.com') || l.includes('docs.google.com/presentation') || l.endsWith('.pdf') || l.endsWith('.ppt') || l.endsWith('.pptx') || l.includes('youtube.com') || l.includes('youtu.be') || l.includes('photos.app.goo.gl')) {
        const viewer = (l.endsWith('.pdf') || l.endsWith('.ppt') || l.endsWith('.pptx') || l.includes('docs.google.com/presentation') || (l.includes('drive.google.com') && !l.includes('VIDEO') && !l.includes('MP4'))) 
          ? 'pdf-viewer' 
          : 'video-viewer';
        window.location.href = `/database/${viewer}?file=${encodeURIComponent(link)}&title=${encodeURIComponent(title)}`;
      } else {
        window.open(link, '_blank');
      }
    };

    // -- Real-time (Socket.io) -------------------------------------------------
    (function () {
      if (typeof io === 'undefined') return;
      try {
        const base = window.getSocketBaseURL ? window.getSocketBaseURL() : (window.RENDER_BACKEND_URL || (window.PRODUCTION_API_URL || 'http://localhost:3000/api').replace(/\/api$/, ''));
        const sock = io(base, { transports: ['polling', 'websocket'], reconnection: true, reconnectionDelay: 3000 });
        if (window.addConnectionStatusDot) window.addConnectionStatusDot(sock);
        sock.on('connect', () => {
          sock.emit('sol:subscribe', { category: CATEGORY, semester: SEMESTER });
          sock.emit('sol:subscribe', { category: 'folders', semester: SEMESTER });
        });
        sock.on('sol:updated', (d) => {
          if (!d || d.category === CATEGORY || d.category === 'folders') {
            if (window.solmatesAPI) window.solmatesAPI._cacheClear('');
            loadContent();
          }
        });
      } catch (e) { }
    })();

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    window.addEventListener('pageshow', () => {
      isNavigating = false;
      document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('navigating'));
    });
  </script>
