<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solmates - Offline</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #333; text-align: center; overflow: hidden; touch-action: none; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1a1a1a; }
        p { font-size: 16px; color: #666; margin-bottom: 30px; padding: 0 20px; }
        .btn { background-color: #1a365d; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="icon">??</div>
    <h1>No Internet Connection</h1>
    <p>Please check your network and try again. Solmates needs internet to load this page.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
