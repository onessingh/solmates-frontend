<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Exams</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    .btn { background: #3b82f6; color: white; padding: 5px 10px; border: none; cursor: pointer; }
  </style>

<script>
// --- STRICT ANTI-SCRAPING MODULE ---
(function() {
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) return false;
    };
    setInterval(function() {
        let devtoolsOpen = false;
        const threshold = 160;
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) devtoolsOpen = true;
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) devtoolsOpen = true;
        if (devtoolsOpen) {
            document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:20%;'>Security Violation: Access Denied.</h1>";
            document.head.innerHTML = "";
            window.location.replace("about:blank");
        }
    }, 1000);
})();
</script>

</head>
<body>
  <h1>Manage Exams</h1>
  <a href="../admin-dashboard.html">Back to Dashboard</a>
  
  <h3>Create New Exam</h3>
  <input type="text" id="name" placeholder="Exam Name (e.g. UGC NET)">
  <input type="text" id="slug" placeholder="Slug (e.g. ugc-net)">
  <input type="text" id="cat" placeholder="Category (e.g. management)">
  <button class="btn" onclick="addExam()">Add Exam</button>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Slug</th><th>Actions</th></tr>
    </thead>
    <tbody id="exam-list"></tbody>
  </table>
  
  <script>
    function addExam() {
        alert('API integration pending. This is a scaffold.');
    }
  </script>
</body>
</html>
