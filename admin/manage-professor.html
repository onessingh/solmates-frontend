  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header h1 {
      color: var(--text-main);
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-edit {
      background: linear-gradient(135deg, #28a745, #20c997);
      color: white;
    }

    .btn-edit:hover {
      background: linear-gradient(135deg, #218838, #1aa179);
    }

    .content-list {
      display: grid;
      gap: 16px;
    }

    .content-item {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .content-item:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .item-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .item-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-semester {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .badge-subject {
      background: #e9ecef;
      color: #495057;
    }

    .badge-year {
      background: #e0e7ff;
      color: #4338ca;
    }

    .quick-year-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .btn-year-toggle {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-year-toggle:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    .btn-year-toggle.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .form-select-styled, .form-input-styled {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      background: var(--bg-card);
      transition: all 0.2s ease;
      box-sizing: border-box;
      outline: none;
    }

    .form-select-styled:focus, .form-input-styled:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* Lecture PPT Year Divider */
    .ppt-year-divider {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 36px 0 16px 0;
      width: 100%;
      user-select: none;
    }

    .ppt-year-divider-line {
      flex: 1;
      height: 4px;
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.1), rgba(99, 102, 241, 0.65), rgba(99, 102, 241, 0.1));
      border-radius: 4px;
    }

    .ppt-year-divider-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
      border: 2px solid rgba(99, 102, 241, 0.5);
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #4f46e5;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
      white-space: nowrap;
    }

    .ppt-year-divider-badge.current-batch {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15));
      border-color: rgba(16, 185, 129, 0.5);
      color: #059669;
    }

    .ppt-year-divider-badge.previous-batch {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.15));
      border-color: rgba(245, 158, 11, 0.5);

    .item-meta {

      font-size: 14px;
      margin-bottom: 12px;
    }

    .item-description {
      color: var(--text-lighter);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .item-link {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .item-link:hover {
      text-decoration: underline;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #e9ecef;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 24px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border-radius: 12px;
    }

    .empty-state i {
      font-size: 64px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      color: var(--text-lighter);
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions {
        flex-direction: column;
      }

      .btn {
        justify-content: center;
      }
    }

<script>
    (function() {
      const savedTheme = localStorage.getItem('solmates_theme');
      if (savedTheme) {
        document.documentElement.style.colorScheme = savedTheme;
        const darkStyle = document.getElementById('solmates-dark-style');
        if (darkStyle) {
          if (savedTheme === 'dark') { darkStyle.media = 'all'; darkStyle.disabled = false; }
          else if (savedTheme === 'light') { darkStyle.media = 'not all'; darkStyle.disabled = true; }
        }
      }
    })();
  </script>
<script id="color-scheme-sync">
(function() {
    function updateMetaColorScheme() {
        var meta = document.querySelector('meta[name="color-scheme"]');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var darkStyle = document.getElementById('solmates-dark-style');
        if (!meta) return;
        var theme = localStorage.getItem('solmates_theme');
        if (!theme) {
            theme = 'light';
            localStorage.setItem('solmates_theme', 'light');
        }
        if (theme === 'dark') {
            meta.setAttribute('content', 'dark only');
            
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'screen');
        } else if (theme === 'light') {
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        } else {
            // Force light mode for new users to override OS dark mode in PWA status bar
            meta.setAttribute('content', 'only light');
            
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.remove('dark');
            if (darkStyle) darkStyle.setAttribute('media', 'not all');
        }
    }
    updateMetaColorScheme();
    window.addEventListener('storage', function(e) {
        if (e.key === 'solmates_theme') updateMetaColorScheme();
    });
    var originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === 'solmates_theme') updateMetaColorScheme();
    };
})();
</script>

<body>
  <div class="container">
    <div class="header">
      <h1>
        <i class="fas fa-file-powerpoint"></i>
        Manage Lecture PPTs
      </h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="fas fa-plus"></i> Add New PPT
        </button>
        <button class="btn btn-secondary" onclick="window.location.href='/database'">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </button>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading Lecture PPTs...</p>
    </div>

    <div id="content-list" class="content-list"></div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <i class="fas fa-folder-open"></i>
      <h2>No Lecture PPTs Yet</h2>
      <p>Add your first PPT to get started!</p>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-plus-circle"></i> Add New Material</h2>
      </div>
      <form id="addContentForm">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" required placeholder="e.g., Marketing Management - Unit 1">
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input type="text" id="subject" name="subject" required placeholder="e.g., Marketing Management">
        </div>

        <div class="form-group">
          <label for="semester">Semester *</label>
          <select id="semester" name="semester" required>
            <option value="">Select Semester</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
          </select>
        </div>

        <div class="form-group">
          <label for="link">Content Link *</label>
          <input type="text" id="link" name="link" required placeholder="https://drive.google.com/...">
        </div>

        <div class="form-group">
          <label for="addBatchSelect"><i class="fas fa-calendar-alt"></i> Batch / Academic Year *</label>
          <select id="addBatchSelect" class="form-select-styled" onchange="onBatchDropdownChange(this, 'addCustomBatchWrap', 'addCustomBatchInput')">
            <option value="2026">Batch 2026 (Latest / Current)</option>
            <option value="2025">Batch 2025 (Previous Year)</option>
            <option value="2026,2025">Both (2025 & 2026 Batches)</option>
            <option value="__custom__">+ Add Custom Year / Batch...</option>
          </select>
          <div id="addCustomBatchWrap" style="display: none; margin-top: 8px;">
            <input type="text" id="addCustomBatchInput" placeholder="Enter year e.g. 2027 (or 2024, 2025)" class="form-input-styled">
            <small style="color: var(--text-lighter); font-size: 0.8rem; display: block; margin-top: 4px;">Enter year (e.g. 2027) or multiple comma-separated years.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description (Optional)</label>
          <textarea id="description" name="description" placeholder="Brief description of the content..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Add Material
          </button>
        </div>
      </form>
    </div>
  </div>


  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-edit"></i> Edit Material</h2>
      </div>

          <label for="editSubject">Subject *</label>
          <input type="text" id="editSubject" name="editSubject" required placeholder="e.g., Marketing Management">

            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editLink">Material Link *</label>
          <input type="text" id="editLink" name="editLink" required placeholder="https://drive.google.com/...">

        <div class="form-group">
          <label for="editBatchSelect"><i class="fas fa-calendar-alt"></i> Batch / Academic Year *</label>
          <select id="editBatchSelect" class="form-select-styled" onchange="onBatchDropdownChange(this, 'editCustomBatchWrap', 'editCustomBatchInput')">
            <option value="2026">Batch 2026 (Latest / Current)</option>
            <option value="2025">Batch 2025 (Previous Year)</option>

            <small style="color: var(--text-lighter); font-size: 0.8rem; display: block; margin-top: 4px;">Enter year (e.g. 2027) or multiple comma-separated years.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="editDescription">Description (Optional)</label>
          <textarea id="editDescription" name="editDescription"

        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/config.js?v=v933"></script>
  <script src="/js/uptime-helper.js?v=v933"></script>
  <script src="/js/api-client.js?v=v933"></script>
  <script>
    const CONTENT_TYPE = 'professor';

    // ========== AUTHENTICATION CHECK ==========
    async function checkAuth() {
      if (!solmatesAPI.isAdminLoggedIn()) {
        alert('Please login as admin');
        window.location.href = '/';
        return false;
      }

      try {
        const verification = await solmatesAPI.verifyAdminToken();
        if (!verification.valid) {
          // Server explicitly said token invalid - clear and redirect
          localStorage.removeItem('solmates_admin_token');
          localStorage.removeItem('solmates_admin_logged_in');
          window.location.href = '/';
          return false;
        }
      } catch (e) {
        // Network error - backend might be starting, proceed anyway
        console.warn('Token verify network error - proceeding');
      }

      return true;
    }

    // ========== LOAD CONTENT ==========
    async function loadContent() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content-list').style.display = 'none';
      document.getElementById('empty-state').style.display = 'none';
      try {
        const response = await solmatesAPI.getContent(CONTENT_TYPE);

        document.getElementById('loading').style.display = 'none';

        if (!response.data || response.data.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          document.getElementById('content-list').style.display = 'none';
          return;
        }

        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('content-list').style.display = 'grid';

        const container = document.getElementById('content-list');
        container.innerHTML = '';

        const getItemYears = (it) => {
          if (Array.isArray(it.years) && it.years.length > 0) return it.years.map(String);
          if (it.year) return [String(it.year)];
          if (it.title && it.title.includes('2025')) return ['2025'];
          return ['2026'];
        };

        const allYearsSet = new Set();
        response.data.forEach(it => {
          getItemYears(it).forEach(y => allYearsSet.add(y));
        });
        const sortedYears = Array.from(allYearsSet).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

        function createContentItemCard(item, itemYears) {
          const div = document.createElement('div');
          div.className = 'content-item';
          div.dataset.id = item.id;
          div.dataset.title = item.title || '';
          div.dataset.subject = item.subject || '';
          div.dataset.semester = item.semester || '';
          div.dataset.url = item.url || item.pdf || item.link || '';
          div.dataset.description = item.description || '';
          div.dataset.years = JSON.stringify(itemYears);

          const has2026 = itemYears.includes('2026');
          const has2025 = itemYears.includes('2025');
          const hasBoth = has2026 && has2025;

          const yearBadgeText = hasBoth ? 'Both 2025 & 2026' : `Batch: ${itemYears.join(', ')}`;

          const rawCreated = item.created_at || (item._id && item._id.length === 24 ? new Date(parseInt(item._id.substring(0, 8), 16) * 1000) : null);
          const createdDateObj = rawCreated ? new Date(rawCreated) : null;
          const isValidDate = createdDateObj && !isNaN(createdDateObj.getTime());
          const dateFormatted = isValidDate ? createdDateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Unknown';
          const timeFormatted = isValidDate ? createdDateObj.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }) : '';

          div.innerHTML = `
            <div class="item-header">
              <div>
                <div class="item-title">${escapeHtml(item.title)}</div>
                <div class="item-badges">
                  <span class="badge badge-semester">Semester ${item.semester}</span>
                  <span class="badge badge-subject">${escapeHtml(item.subject)}</span>
                  <span class="badge badge-year"><i class="fas fa-calendar-alt"></i> ${escapeHtml(yearBadgeText)}</span>
                  <span class="badge badge-date" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:600;"><i class="far fa-calendar-alt"></i> Added: ${dateFormatted}</span>
                </div>
              </div>
            </div>
            <div class="quick-year-toggle">
              <span style="font-size:12px;color:var(--text-lighter);font-weight:600;">Quick Batch:</span>
              <button type="button" class="btn-year-toggle ${has2026 && !hasBoth ? 'active' : ''}" onclick="quickSetYear('${item.id}', ['2026'], this)">2026</button>
              <button type="button" class="btn-year-toggle ${has2025 && !hasBoth ? 'active' : ''}" onclick="quickSetYear('${item.id}', ['2025'], this)">2025</button>
              <button type="button" class="btn-year-toggle ${hasBoth ? 'active' : ''}" onclick="quickSetYear('${item.id}', ['2026', '2025'], this)">Both (2025+2026)</button>
            </div>
            ${item.description ? `<div class="item-description">${escapeHtml(item.description)}</div>` : ''}
            <a href="${escapeHtml(item.url || item.pdf || item.link || '')}" target="_blank" class="item-link">
              <i class="fas fa-external-link-alt"></i> Open Link
            </a>
            <div class="item-meta">
              <i class="fas fa-clock"></i> Exact Added Time: ${dateFormatted}${timeFormatted ? ' at ' + timeFormatted : ''}
            </div>
            <div class="item-actions">
              <button class="btn btn-edit" onclick="openEditModalFromCard(this.closest('.content-item'))">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn btn-danger" onclick="deleteContent('${item.id}')">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          `;
          return div;
        }

        // Render grouped by year with thick divider lines
        sortedYears.forEach((year, yIdx) => {
          const yearItems = response.data.filter(it => getItemYears(it).includes(year));
          if (yearItems.length === 0) return;

          const isLatest = (yIdx === 0);
          const divider = document.createElement('div');
          divider.className = 'ppt-year-divider';
          divider.innerHTML = `
            <div class="ppt-year-divider-line"></div>
            <div class="ppt-year-divider-badge ${isLatest ? 'current-batch' : 'previous-batch'}">
              <i class="fas ${isLatest ? 'fa-layer-group' : 'fa-calendar-alt'}"></i> Batch ${escapeHtml(year)} ${year === '2025' ? '(Previous Year)' : (isLatest ? '(Latest)' : '')}
            </div>
            <div class="ppt-year-divider-line"></div>
          `;
          container.appendChild(divider);

          yearItems.forEach(item => {
            const card = createContentItemCard(item, getItemYears(item));
            container.appendChild(card);
          });
        });

      } catch (error) {
        console.error('Error loading content:', error);
        alert('Error loading Materials: ' + error.message);
        document.getElementById('loading').style.display = 'none';
      }
    }

    // ========== ADD CONTENT ==========
    document.getElementById('addContentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const url = formData.get('link');
      const finalYears = getYearsFromDropdown('addBatchSelect', 'addCustomBatchInput');
      const data = {
        title: formData.get('title'),
        subject: formData.get('subject'),
        url: url,
        link: url,
        pdf: url,
        description: formData.get('description'),
        years: finalYears,
        year: finalYears[0]
      };

      const semester = formData.get('semester');
      const subject = formData.get('subject');

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

      try {
        const response = await solmatesAPI.addContent(CONTENT_TYPE, data, semester, subject);

        if (response.success) {
          alert('Material added successfully!');
          closeAddModal();
          e.target.reset();
          loadContent();
        }
      } catch (error) {
        alert('Error adding Material: ' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Add Material';
      }
    });

    // ========== DELETE CONTENT ==========
    async function deleteContent(id) {
      if (!confirm('Are you sure you want to delete this material?')) return;

      try {
        const response = await solmatesAPI.deleteContent(CONTENT_TYPE, id);

        if (response.success) {
          alert('Material deleted successfully!');
          loadContent();
        }
      } catch (error) {
        alert('Error deleting Material: ' + error.message);
      }
    }

    // ========== MODAL CONTROLS ==========
    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      const addSelect = document.getElementById('addBatchSelect');
      if (addSelect) addSelect.value = '2026';
      const wrap = document.getElementById('addCustomBatchWrap');
      if (wrap) wrap.style.display = 'none';
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.body.style.overflow = 'auto';
      document.getElementById('addContentForm').reset();
    }

    // ========== UTILITY ==========
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========== BATCH DROPDOWN HELPERS ==========
    function onBatchDropdownChange(selectElem, wrapId, inputId) {
      const wrap = document.getElementById(wrapId);
      const input = document.getElementById(inputId);
      if (selectElem.value === '__custom__') {
        if (wrap) wrap.style.display = 'block';
        if (input) input.focus();
      } else {
        if (wrap) wrap.style.display = 'none';
      }
    }

    function getYearsFromDropdown(selectId, inputId) {
      const select = document.getElementById(selectId);
      if (!select) return ['2026'];
      if (select.value === '__custom__') {
        const input = document.getElementById(inputId);
        const val = input ? input.value.trim() : '';
        if (!val) return ['2026'];
        const parts = val.split(/[,/&]+/).map(s => s.trim()).filter(Boolean);
        return parts.length > 0 ? parts : ['2026'];
      }
      const parts = select.value.split(',').map(s => s.trim()).filter(Boolean);
      return parts.length > 0 ? parts : ['2026'];
    }

    function setYearsInDropdown(years, selectId, wrapId, inputId) {
      const select = document.getElementById(selectId);
      const wrap = document.getElementById(wrapId);
      const input = document.getElementById(inputId);
      if (!select) return;

      const yArr = Array.isArray(years) ? years.map(String) : [String(years || '2026')];
      const sortedKey = [...yArr].sort().reverse().join(',');

      if (sortedKey === '2026') {
        select.value = '2026';
        if (wrap) wrap.style.display = 'none';
      } else if (sortedKey === '2025') {
        select.value = '2025';
        if (wrap) wrap.style.display = 'none';
      } else if (sortedKey === '2026,2025') {
        select.value = '2026,2025';
        if (wrap) wrap.style.display = 'none';
      } else {
        let existingOpt = select.querySelector(`option[value="${sortedKey}"]`);
        if (!existingOpt) {
          const opt = document.createElement('option');
          opt.value = sortedKey;
          opt.textContent = `Batch ${yArr.join(' & ')}`;
          select.insertBefore(opt, select.querySelector('option[value="__custom__"]'));
        }
        select.value = sortedKey;
        if (wrap) wrap.style.display = 'none';
      }
    }

    async function quickSetYear(id, newYears, btn) {
      const card = btn.closest('.content-item');
      if (!card) return;
      btn.disabled = true;
      try {
        const data = {
          title: card.dataset.title,
          subject: card.dataset.subject,
          url: card.dataset.url,
          link: card.dataset.url,
          pdf: card.dataset.url,
          description: card.dataset.description,
          years: newYears,
          year: newYears[0]
        };
        const semester = card.dataset.semester;
        const subject = card.dataset.subject;
        const res = await solmatesAPI.updateContent(CONTENT_TYPE, id, data, semester, subject);
        if (res && res.success) {
          await loadContent();
        }
      } catch (err) {
        alert('Failed to update batch: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ========== EDIT MODAL ==========
    function openEditModalFromCard(card) {
      document.getElementById('editId').value = card.dataset.id;
      document.getElementById('editTitle').value = card.dataset.title;
      document.getElementById('editSubject').value = card.dataset.subject;
      document.getElementById('editSemester').value = card.dataset.semester;
      document.getElementById('editLink').value = card.dataset.url;
      document.getElementById('editDescription').value = card.dataset.description;

      const currentYears = JSON.parse(card.dataset.years || '["2026"]');
      setYearsInDropdown(currentYears, 'editBatchSelect', 'editCustomBatchWrap', 'editCustomBatchInput');

      document.getElementById('editModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      document.body.style.overflow = 'auto';
      document.getElementById('editContentForm').reset();
    }

    document.getElementById('editContentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const url = document.getElementById('editLink').value;
      const finalYears = getYearsFromDropdown('editBatchSelect', 'editCustomBatchInput');
      const data = {
        title: document.getElementById('editTitle').value,
        subject: document.getElementById('editSubject').value,
        url: url,
        link: url,
        pdf: url,
        description: document.getElementById('editDescription').value,
        years: finalYears,
        year: finalYears[0]
      };
      const semester = document.getElementById('editSemester').value;
      const subject = document.getElementById('editSubject').value;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        const response = await solmatesAPI.updateContent(CONTENT_TYPE, id, data, semester, subject);
        if (response.success) {
          alert('Updated successfully!');
          closeEditModal();
          loadContent();
        }
      } catch (error) {
        alert('Error updating: ' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
      }
    });

    // ========== INITIALIZE ==========
    async function init() {
      const isAuth = await checkAuth();
      if (isAuth) {
        await loadContent();
        initRealtime();
      }
    }

    // ========== REAL-TIME UPDATES (Socket.io + polling fallback) ==========
    function initRealtime() {
      if (typeof io !== 'undefined') {
        try {
          const base = window.getSocketBaseURL ? window.getSocketBaseURL() : (window.PRODUCTION_API_URL || 'http://localhost:3000/api').replace(/\/api$/, '');
          const socket = io(base, { transports: ['polling', 'websocket'], reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 1000 });
          socket.on('content:updated', async (data) => {
            if (!data.type || data.type === CONTENT_TYPE) await loadContent();
          });
          socket.on('reconnect', async () => { await loadContent(); });
        } catch (e) { console.warn('Socket.io init failed:', e); }
      }
      setInterval(async () => { await loadContent(); }, 15000);
      document.addEventListener('visibilitychange', async () => {
        if (!document.hidden) await loadContent();
      });
    }

    init();
  </script>



</body>

</html>
