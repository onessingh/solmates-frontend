<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=111.9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - SOLMATES</title>
  <meta http-equiv="refresh" content="0; url=/">
  <script>window.location.replace('/');</script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/sol-cache.js?v=89.0"></script>

<script>
  (function() {
    const savedTheme = localStorage.getItem('solmates_theme');
    if (savedTheme) {
      const darkStyle = document.getElementById('solmates-dark-style');
      if (darkStyle) {
        if (savedTheme === 'dark') darkStyle.media = 'all';
        else if (savedTheme === 'light') darkStyle.media = 'not all';
      }
    }
  })();
</script>
</head>

<body>
  <p>Redirecting to home... <a href="/">Click here if not redirected</a></p>
</body>

</html>
