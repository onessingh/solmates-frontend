<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="/css/global-lockdown.css?v=111.9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - SOLMATES</title>
  <meta http-equiv="refresh" content="0; url=/">
  <script>window.location.replace('/');</script>
  <script src="/js/uptime-helper.js?v=101.0"></script>
  <script src="/js/sol-cache.js?v=89.0"></script>

<script>
  (function() {
    const savedTheme = localStorage.getItem('solmates_theme');
    if (savedTheme) {
      for (let i = 0; i < document.styleSheets.length; i++) {
        try {
          let sheet = document.styleSheets[i];
          if (sheet.href && new URL(sheet.href, window.location.href).origin !== window.location.origin) continue;
          let rules = sheet.cssRules || sheet.rules;
          if (!rules) continue;
          for (let j = 0; j < rules.length; j++) {
            let rule = rules[j];
            if (rule.conditionText && rule.conditionText.includes('prefers-color-scheme: dark')) {
              if (savedTheme === 'dark') {
                rule.media.mediaText = 'all /* solmates-dark-override */';
              } else if (savedTheme === 'light') {
                rule.media.mediaText = 'not all /* solmates-dark-override */';
              }
            }
          }
        } catch(e) {}
      }
    }
  })();
</script>
</head>

<body>
  <p>Redirecting to home... <a href="/">Click here if not redirected</a></p>
</body>

</html>
